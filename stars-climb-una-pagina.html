  /* ---------------- El cuerpo de una clase ----------------
   *
   * Una explicación de corrido obliga a leerla entera para saber si contestaba
   * la duda que uno traía. Por eso una clase va por partes numeradas y en
   * orden — primero el caso simple, después el raro — y cada parte trae sus
   * ejemplos pegados abajo, no todos juntos al final.
   *
   * Y cada clase termina con un "por qué". Saber que el inglés casi no marca
   * la persona en el verbo explica de una vez el pronombre obligatorio, el
   * "do" de las preguntas y la -s de he/she/it: tres reglas sueltas que pasan
   * a ser una sola. Una regla que se entiende no hay que memorizarla.
   */
  function parrafos(texto) {
    return String(texto).split("\n\n").map(function (parrafo) {
      return "<p>" + permitirNegrita(parrafo) + "</p>";
    }).join("");
  }

  function ejemplosDeClase(lista) {
    return '<ul class="clase-ejs">' + lista.map(function (e) {
      return "<li>" +
        '<button class="icono-btn" data-accion="audio" data-texto="' + d.esc(e.en) + '">🔊</button>' +
        '<span class="crece"><span class="ej-en">' + tocablesEn(e.en) + "</span>" +
        '<span class="ej-es">' + d.esc(e.es) + "</span></span></li>";
    }).join("") + "</ul>";
  }

  function cuerpoDeClase(t) {
    let h = "";

    /* La idea en una línea, arriba del todo. Si alguien sólo lee esto, ya se
     * lleva lo que importa; el resto es para cuando no basta. */
    if (t.idea) h += '<div class="clase-idea">' + permitirNegrita(t.idea) + "</div>";

    if (t.pasos && t.pasos.length) {
      h += '<ol class="clase-pasos">' + t.pasos.map(function (paso) {
        return '<li class="clase-paso">' +
          '<div class="paso-tit">' + d.esc(paso.titulo) + "</div>" +
          '<div class="paso-texto">' + parrafos(paso.texto) + "</div>" +
          (paso.ejemplos && paso.ejemplos.length ? ejemplosDeClase(paso.ejemplos) : "") +
          "</li>";
      }).join("") + "</ol>";
    } else if (t.explicacion) {
      h += '<div class="explicacion">' + parrafos(t.explicacion) + "</div>";
    }

    if (t.tabla) h += tablaTocable(t.tabla);

    if (t.porque) {
      h += '<div class="clase-porque">' +
        '<div class="tit">¿Por qué es así?</div>' +
        '<div class="cuerpo">' + parrafos(t.porque) + "</div></div>";
    }
    return h;
  }

  /* La clase de una lección de pares mínimos ("ship" / "sheep").
   *
   * Estos ejercicios ya traían su explicación, pero llegaba DESPUÉS de fallar,
   * y en pronunciación eso no sirve: si nunca has oído la diferencia entre las
   * dos, la primera vez es una moneda al aire y la segunda también.
   *
   * Así que primero se oyen las dos, una al lado de la otra y con el botón
   * para repetirlas, y recién después se pregunta cuál era.
   */
  function paresDeSonido(ejercicios) {
    const vistos = {};
    const out = [];
    (ejercicios || []).forEach(function (ej) {
      const ops = (ej.opciones || []).filter(function (o) { return o.simbolo; });
      if (ops.length !== 2) return;
      const llave = ops.map(function (o) { return o.texto; }).sort().join("|");
      if (vistos[llave]) return;
      vistos[llave] = true;
      out.push({ a: ops[0], b: ops[1], tip: ej.explicacion || "" });
    });
    return out;
  }

  function claseDeSonidos(titulo, pares, seguir) {
    const tandas = [];
    for (let i = 0; i < pares.length; i += 3) tandas.push(pares.slice(i, i + 3));
    if (!tandas.length) return seguir();

    let i = 0;
    function mostrar() {
      const tanda = tandas[i];
      const ultima = i === tandas.length - 1;
      hoja(
        '<div class="ficha-cabecera"><span class="emo-grande">👂</span>' +
        "<h2>" + d.esc(titulo) + "</h2></div>" +
        '<div class="clase-idea">Oye las dos antes de que te pregunten. ' +
        "Tócalas varias veces hasta notar en qué se diferencian.</div>" +
        tanda.map(function (p) {
          return '<div class="par-sonido">' +
            '<div class="par-botones">' +
            botonSonido(p.a) + '<span class="par-vs">y</span>' + botonSonido(p.b) +
            "</div>" +
            (p.tip ? '<div class="par-tip">' + d.esc(p.tip) + "</div>" : "") +
            "</div>";
        }).join("") +
        '<button class="btn" style="margin-top:14px" data-accion="clase-seguir">' +
        (ultima ? "Listo, a practicar" : "Siguiente") + "</button>" +
        (tandas.length > 1
          ? '<div class="mini apagado centro" style="margin-top:8px">' +
            (i + 1) + " de " + tandas.length + "</div>"
          : ""),
        function (acc, b, velo) {
          if (acc !== "clase-seguir") return;
          velo.remove();
          i++;
          if (i < tandas.length) mostrar();
          else seguir();
        }
      );
    }
    mostrar();
  }

  function botonSonido(o) {
    return '<button class="par-palabra" data-accion="audio" data-texto="' + d.esc(o.texto) + '">' +
      '<span class="par-en">' + d.esc(o.texto) + "</span>" +
      '<span class="par-simbolo">/' + d.esc(o.simbolo) + "/</span>" +
      '<span class="par-oir">🔊</span></button>';
  }

  /* La clase de una lección de vocabulario.
   *
   * Hasta ahora una lección que sólo practicaba palabras —"Hola", "Números",
   * "Colores"— no enseñaba nada: empezaba preguntando. Es el peor orden
   * posible, porque convierte la primera lección del curso en un examen de
   * algo que nadie ha visto. Adivinar no enseña; sólo deja la sensación de
   * ir atrasada desde el primer minuto.
   *
   * Así que ahora se muestran antes las palabras que la lección va a
   * preguntar. Las mismas exactamente: se sacan de los ejercicios ya
   * generados, no de una lista aparte que pudiera quedar descuadrada.
   *
   * Y van de a pocas por pantalla. Veinte palabras de golpe se leen como un
   * diccionario y no se queda ninguna; de a seis se pueden mirar, oír y
   * repetir antes de pasar.
   */
  const POR_TANDA = 6;

  function loQueEnseña(ejercicios) {
    /* Lo que la lección va a preguntar, sin repetir y en el orden en que se
     * va a preguntar: así la clase y la práctica van a la par.
     *
     * Los ejercicios guardan el id, no la tarjeta, y el de unir pares guarda
     * varios de golpe; hay que resolverlos contra el banco. */
    const vistos = {};
    const out = [];
    function meter(id) {
      if (!id || vistos[id]) return;
      const t = APP.datos.porId(id);
      if (!t || !t.en || !t.es) return;
      vistos[id] = true;
      out.push(t);
    }
    (ejercicios || []).forEach(function (ej) {
      meter(ej.tarjetaId);
      (ej.tarjetas || []).forEach(meter);
    });

    /* Las palabras sueltas primero y las frases después, y dentro de cada
     * grupo en el orden en que están escritas en el banco.
     *
     * El orden en que van a preguntarse lo decide el azar, y eso sirve para
     * practicar pero no para enseñar: una clase de principiante que empieza
     * por "you are welcome" y dice "hi" en la tercera pantalla está contando
     * la historia al revés. Los bancos están escritos en orden de dificultad
     * —saludar, despedirse, ser educada; cero, uno, dos— así que respetarlo
     * es gratis y ordena la clase sola. */
    const orden = {};
    APP.datos.TARJETAS.forEach(function (t, i) { orden[t.id] = i; });
    function porBanco(a, b) { return (orden[a.id] || 0) - (orden[b.id] || 0); }

    const palabras = out.filter(function (t) { return t.tipo !== "frase"; }).sort(porBanco);
    const frases = out.filter(function (t) { return t.tipo === "frase"; }).sort(porBanco);
    return palabras.concat(frases);
  }

  function claseDeVocabulario(titulo, tarjetas, seguir) {
    const tandas = [];
    for (let i = 0; i < tarjetas.length; i += POR_TANDA) {
      tandas.push(tarjetas.slice(i, i + POR_TANDA));
    }
    if (!tandas.length) return seguir();

    let i = 0;
    function mostrar() {
      const tanda = tandas[i];
      const ultima = i === tandas.length - 1;
      hoja(
        '<div class="ficha-cabecera"><span class="emo-grande">📖</span>' +
        "<h2>" + d.esc(titulo) + "</h2></div>" +
        '<div class="clase-idea">Esto es lo que vas a practicar. Tócalas para ' +
        "oírlas, y repite en voz alta antes de seguir.</div>" +
        '<ul class="vocab-clase">' +
        tanda.map(function (t) {
          return "<li>" +
            '<button class="vocab-oir" data-accion="audio" data-texto="' + d.esc(t.en) + '">' +
            (t.icon ? '<span class="vocab-icono">' + d.esc(t.icon) + "</span>" : "🔊") +
            "</button>" +
            '<span class="crece"><span class="vocab-en">' + d.esc(t.en) + "</span>" +
            '<span class="vocab-es">' + d.esc(t.es) + "</span>" +
            (t.nota ? '<span class="vocab-nota">' + d.esc(t.nota) + "</span>" : "") +
            "</span></li>";
        }).join("") +
        "</ul>" +
        '<button class="btn" style="margin-top:14px" data-accion="clase-seguir">' +
        (ultima ? "Listo, a practicar" : "Siguiente") + "</button>" +
        (tandas.length > 1
          ? '<div class="mini apagado centro" style="margin-top:8px">' +
            (i + 1) + " de " + tandas.length + "</div>"
          : ""),
        function (acc, b, velo) {
          if (acc !== "clase-seguir") return;
          velo.remove();
          i++;
          if (i < tandas.length) mostrar();
          else seguir();
        }
      );
    }
    mostrar();
  }

  /* La clase que abre una unidad. Se enseña la regla antes de practicarla: un
   * adulto entiende "he lleva -s" en diez segundos leyéndolo, y en veinte
   * ejercicios adivinándolo. */
  function claseAntesDe(l, ejercicios, seguir) {
    const temas = (l.clase || []).map(function (id) { return APP.datosGramatica.tema(id); })
      .filter(Boolean);

    /* Si la lección no declara clase pero practica una regla, la explicación
     * de esa regla hace de clase. Así nunca se practica algo que no se ha
     * explicado, y sobre todo nunca se explica una cosa para practicar otra,
     * que es peor: deja la sensación de que la explicación no servía. */
    if (!temas.length && l.reglas && l.reglas.length) {
      const re = APP.datosReglas.regla(l.reglas[0]);
      if (re) {
        fichaReglaComoClase(re, seguir);
        return;
      }
    }
    /* Ni tema de gramática ni regla: es una lección de vocabulario. Antes se
     * iba directo a preguntar; ahora se enseñan primero las palabras. */
    if (!temas.length) {
      const tarjetas = loQueEnseña(ejercicios);
      if (tarjetas.length >= 3) return claseDeVocabulario(l.titulo, tarjetas, seguir);
      // Una lección de pares mínimos no tiene vocabulario que enseñar, pero sí
      // sonidos que oír antes de que los pregunten.
      const pares = paresDeSonido(ejercicios);
      if (pares.length) return claseDeSonidos(l.titulo, pares, seguir);
      if (tarjetas.length) return claseDeVocabulario(l.titulo, tarjetas, seguir);
      return seguir();
    }

    let i = 0;
    function mostrar() {
      const t = temas[i];
      const ultimo = i === temas.length - 1;
      hoja(
        '<div class="ficha-cabecera"><span class="emo-grande">' + t.emo + "</span>" +
        "<h2>" + d.esc(t.titulo) + "</h2></div>" +
        cuerpoDeClase(t) +
        '<div class="trampa"><div class="mal">✗ ' + tocablesEn(t.trampa.mal) + "</div>" +
        '<div class="bien">✓ ' + tocablesEn(t.trampa.bien) + "</div>" +
        '<div class="mini" style="margin-top:6px">' + permitirNegrita(t.trampa.porque) + "</div></div>" +
        (t.ejemplos && t.ejemplos.length
          ? '<div class="clase-mas"><div class="tit">Más ejemplos</div>' +
            ejemplosDeClase(t.ejemplos) + "</div>"
          : "") +
        '<div class="mini apagado centro" style="margin-top:10px">' +
        "Toca cualquier palabra en inglés para ver qué significa.</div>" +
        '<button class="btn" style="margin-top:14px" data-accion="clase-seguir">' +
        (ultimo ? "Entendido, a practicar" : "Siguiente") + "</button>" +
        (temas.length > 1
          ? '<div class="mini apagado centro" style="margin-top:8px">' + (i + 1) + " de " + temas.length + "</div>"
          : ""),
        function (acc, b, velo) {
          if (acc !== "clase-seguir") return;
          velo.remove();
          i++;
          if (i < temas.length) mostrar();
          else seguir();
        }
      );
    }
    mostrar();
  }

  function fichaReglaComoClase(re, seguir) {
    hoja(
      '<div class="ficha-cabecera"><span class="emo-grande">' + re.emo + "</span>" +
      "<h2>" + d.esc(re.titulo) + "</h2></div>" +
      '<div class="clave-regla">' + d.esc(re.clave) + "</div>" +
      '<div class="explicacion">' + permitirNegrita(re.regla) + "</div>" +
      (re.tabla ? tablaTocable(re.tabla) : "") +
      '<div class="trampa"><div class="mal">✗ ' + tocablesEn(re.error.mal) + "</div>" +
      '<div class="bien">✓ ' + tocablesEn(re.error.bien) + "</div></div>" +
      '<div class="mini apagado centro" style="margin-top:10px">' +
      "Toca cualquier palabra en inglés para ver qué significa.</div>" +
      '<button class="btn" style="margin-top:14px" data-accion="clase-seguir">Entendido, a practicar</button>',
      function (acc, b, velo) {
        if (acc !== "clase-seguir") return;
        velo.remove();
        seguir();
      }
    );
  }

  /* Las tablas de las clases llevan ejemplos en inglés —"I work here"— y hasta
   * ahora no había forma de saber qué era "work". Esperar que alguien que
   * empieza ya conozca las palabras de los ejemplos es justo el supuesto que
   * hace que una explicación no se entienda. */
  function tablaTocable(t) {
    return '<div class="tabla-caja"><table class="tabla"><thead><tr>' +
      t.cabecera.map(function (c) { return "<th>" + d.esc(c) + "</th>"; }).join("") +
      "</tr></thead><tbody>" +
      t.filas.map(function (f) {
        return "<tr>" + f.map(function (c) { return "<td>" + tocablesEn(c) + "</td>"; }).join("") + "</tr>";
      }).join("") +
      "</tbody></table></div>";
  }

  function pantallaGramatica() {
    const G = APP.datosGramatica;
    hoja(
      '<div class="fila entre"><h2>Gramática</h2>' +
      '<button class="icono-btn" data-accion="cerrar-hoja">✕</button></div>' +
      '<p class="chico apagado">Cómo se arma el inglés, explicado comparándolo con el español. ' +
      "Cada tema termina con el error típico y por qué se comete.</p>" +

      '<button class="btn" style="margin-top:10px" data-accion="gram-trampas">' +
      "⚡ Repasar las 17 trampas</button>" +
      '<div class="mini apagado" style="margin-top:6px">Los errores concretos que hay que dejar de cometer, todos seguidos.</div>' +

      G.GRUPOS.map(function (grupo) {
        return (
          '<h3 style="margin-top:20px">' + d.esc(grupo) + "</h3>" +
          '<div style="display:flex;flex-direction:column;gap:8px">' +
          G.delGrupo(grupo).map(function (t) {
            const f = APP.gramatica.progresoDeTema(t);
            return (
              '<button class="tarjeta fila" style="width:100%;text-align:left;cursor:pointer;padding:12px" ' +
              'data-accion="ver-gramatica" data-id="' + t.id + '">' +
              '<span style="font-size:24px">' + t.emo + "</span>" +
              '<span class="crece"><span class="fuerte" style="display:block">' + d.esc(t.titulo) + "</span>" +
              '<span class="mini apagado">' + d.esc(t.resumen) + "</span>" +
              '<span class="barra-prog fina" style="margin-top:6px"><i style="width:' +
              Math.round(f * 100) + '%"></i></span></span>' +
              '<span class="apagado">›</span></button>'
            );
          }).join("") +
          "</div>"
        );
      }).join(""),
      function (a, b, velo) {
        if (a === "ver-gramatica") {
          velo.remove();
          fichaGramatica(b.getAttribute("data-id"));
        } else if (a === "gram-trampas") {
          velo.remove();

  function permitirNegrita(texto) {
    /* El contenido es nuestro, pero igual se escapa todo y después se
     * devuelven sólo las negritas: así, si algún día un texto trae un signo
     * raro, no se puede colar nada por accidente. */
    return d.esc(texto).replace(/&lt;b&gt;/g, "<b>").replace(/&lt;\/b&gt;/g, "</b>");
  }

  /* ---------------- Verbos ---------------- */

  const MODOS_VERBO = [
    { id: "presente", emo: "⏰", nombre: "Presente", sub: "El verbo con -s de he/she/it" },
    { id: "pasado", emo: "⏮️", nombre: "Pasado", sub: "Regulares e irregulares" },
    { id: "futuro", emo: "⏭️", nombre: "Futuro", sub: "will + verbo base" },
    { id: "participio", emo: "✅", nombre: "Participio", sub: "have / has + …" },
    { id: "irregulares", emo: "🔥", nombre: "Sólo irregulares", sub: "Los 60 que hay que memorizar" },
    { id: "significado", emo: "🇪🇸", nombre: "Significados", sub: "Qué quiere decir cada uno" },
    { id: "mixto", emo: "🎲", nombre: "Todo mezclado", sub: "Los cuatro tiempos revueltos" },
  ];

  function pantallaVerbos(filtro) {
    const texto = (filtro || "").trim().toLowerCase();
    const lista = APP.datosVerbos.VERBOS.filter(function (v) {
      if (!texto) return true;
      return (v.base + " " + v.pasado + " " + v.participio + " " + v.es).toLowerCase().indexOf(texto) >= 0;
    });

    const velo = hoja(
      '<div class="fila entre"><h2>Verbos</h2>' +
      '<button class="icono-btn" data-accion="cerrar-hoja">✕</button></div>' +
      '<p class="chico apagado">Los 102 verbos que de verdad se usan, con sus cinco formas. ' +
      "Toca uno para ver toda su conjugación.</p>" +

      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0">' +
      MODOS_VERBO.map(function (m) {
        return (
          '<button class="tarjeta" style="text-align:left;padding:11px" data-accion="verbo-modo" data-id="' + m.id + '">' +
          '<div style="font-size:20px">' + m.emo + "</div>" +
          '<div class="fuerte chico">' + d.esc(m.nombre) + "</div>" +
          '<div class="mini apagado">' + d.esc(m.sub) + "</div></button>"
        );
      }).join("") +
      "</div>" +

      '<input class="campo" id="buscar-verbo" style="min-height:auto" autocapitalize="none" ' +
      'autocorrect="off" spellcheck="false" placeholder="Buscar un verbo…" value="' + d.esc(filtro || "") + '">' +
      '<div class="mini apagado" style="margin:8px 0">' + lista.length + " verbos</div>" +

      '<ul class="lista-limpia">' +
      lista.map(function (v) {
        const f = APP.srs.fuerza(APP.verbos.idTarjeta(v, "pasado"));
        return (
          '<li><button class="fila" style="width:100%;text-align:left;background:none;border:none;' +
          'border-bottom:1px solid var(--borde);padding:10px 0;font:inherit;color:inherit;cursor:pointer" ' +
          'data-accion="ver-verbo" data-id="' + d.esc(v.base) + '">' +
          '<span class="crece"><b>' + d.esc(v.base) + "</b>" +
          (v.irregular ? ' <span class="pastilla mini" style="background:var(--rojo-suave);color:var(--rojo-oscuro)">irr</span>' : "") +
          '<br><span class="mini apagado">' + d.esc(v.pasado) + " · " + d.esc(v.participio) + " · " + d.esc(v.es) + "</span></span>" +
          '<span class="barra-prog fina" style="width:44px;flex:none"><i style="width:' +
          Math.round(f * 100) + '%"></i></span>' +
          '<span class="apagado">›</span></button></li>'
        );
      }).join("") +
      "</ul>",
      function (a, b, v) {
        if (a === "verbo-modo") {
          v.remove();
          practicarVerbos(b.getAttribute("data-id"));
        } else if (a === "ver-verbo") {
          const verbo = APP.datosVerbos.VERBOS.filter(function (x) { return x.base === b.getAttribute("data-id"); })[0];
          v.remove();
          fichaVerbo(verbo);
        }
      }
    );

    // La búsqueda redibuja la hoja entera conservando el foco y el texto: con
    // cien verbos, filtrar es la única forma cómoda de llegar a uno.
    const campo = d.$("#buscar-verbo", velo);
    if (campo) {
      campo.addEventListener("input", function () {
        const valor = campo.value;
        const posicion = campo.selectionStart;
        velo.remove();
        const nuevoVelo = pantallaVerbos(valor);
        const nuevoCampo = d.$("#buscar-verbo", nuevoVelo);
        if (nuevoCampo) {
          nuevoCampo.focus();
          try { nuevoCampo.setSelectionRange(posicion, posicion); } catch (e) { /* da igual */ }
        }
      });
    }
    return velo;
  }

      '<button class="btn hueco" data-accion="volver-verbos">Volver a la lista</button>',

          if (!ejercicios.length) return d.avisar("Nada que practicar", "Revisa los ajustes de teclado y micrófono.");
          APP.leccion.iniciar({
            ejercicios: ejercicios, titulo: v.base, modo: "practica",

  function practicarVerbos(modo) {
    const ejercicios = filtrar(APP.verbos.sesion(modo, 12));

  /* ---------------- Pronunciación ---------------- */

  function pantallaSonidos() {
    function grupo(tipo, titulo, explica) {
      const sonidos = APP.datosSonidos.SONIDOS.filter(function (s) { return s.tipo === tipo; });
      return (
        '<h3 style="margin-top:18px">' + d.esc(titulo) + "</h3>" +

        '<div class="sonidos">' +
        sonidos.map(function (s) {
          const p = APP.pronunciacion.progresoDeSonido(s.id);
          return (
            '<button class="sonido" data-accion="ver-sonido" data-id="' + s.id + '">' +
            '<span class="ipa">' + d.esc(s.simbolo) + "</span>" +
            '<span class="ej">' + d.esc(s.ejemplos[0]) + "</span>" +
            '<span class="barra-prog fina"><i style="width:' + Math.round(p * 100) + '%"></i></span>' +
            "</button>"

    hoja(

      '<button class="icono-btn" data-accion="cerrar-hoja">✕</button></div>' +

      "Ahí está la mitad de por qué cuesta entender y que te entiendan.</p>" +

      '<div class="aviso mini">Primero se aprende a <b>oír</b> la diferencia. ' +
      "No se puede pronunciar algo que todavía no se distingue de oído.</div>" +

      '<button class="btn" data-accion="sonidos-todos">Practicar los 20 mezclados</button>' +
      '<div style="height:8px"></div>' +
      '<div class="fila" style="gap:8px">' +
      '<button class="btn hueco chico" style="flex:1" data-accion="sonidos-simples">Sólo vocales simples</button>' +
      '<button class="btn hueco chico" style="flex:1" data-accion="sonidos-diptongos">Sólo diptongos</button>' +
      "</div>" +

      grupo("simple", "Vocales simples (12)", "Un solo sonido, sostenido. La diferencia suele estar en si es larga o corta.") +
      grupo("diptongo", "Diptongos (8)", "Dos vocales seguidas en un solo golpe de voz: empieza en una y termina en otra."),

   * Aprender con la letra de una canción que le gusta funciona mejor que

  function canciones() {
    const lista = A().estado().canciones;
    hoja(
      '<div class="fila entre"><h2>Canciones</h2>' +
      '<button class="icono-btn" data-accion="cerrar-hoja">✕</button></div>' +
      (lista.length

              '<span class="chico apagado">' + d.esc(c.artista || "") + " · " + c.lineas.length + " líneas</span></span>›</button>"
            );
          }).join("")
        : '<p class="apagado chico">Todavía no agregas ninguna. Busca la letra de una canción que te guste, cópiala y pégala acá.</p>') +
      '<button class="btn" data-accion="nueva-cancion">➕ Agregar una canción</button>',

      '<input class="campo" id="c-titulo" style="min-height:auto;margin-bottom:8px" placeholder="Título">' +
      '<input class="campo" id="c-artista" style="min-height:auto;margin-bottom:8px" placeholder="Artista (opcional)">' +
      '<textarea class="campo" id="c-letra" rows="8" placeholder="Pega la letra acá, una línea por renglón"></textarea>' +
      '<button class="btn" style="margin-top:10px" data-accion="guardar-cancion">Guardar</button>',
      function (a, b, velo) {
        if (a !== "guardar-cancion") return;
        const titulo = d.$("#c-titulo", velo).value.trim();
        const letra = d.$("#c-letra", velo).value.trim();
        if (!titulo || !letra) {
          d.avisar("Falta algo", "Necesito al menos el título y la letra de la canción.");
          return;
        }
        const lineas = letra.split("\n").map(function (x) { return x.trim(); }).filter(Boolean);
        A().estado().canciones.push({
          titulo: titulo,
          artista: d.$("#c-artista", velo).value.trim(),
          lineas: lineas,
        });
        A().guardar();
        velo.remove();
        canciones();
      }
    );
  }

  function verCancion(i) {
    const c = A().estado().canciones[i];
    if (!c) return;
    hoja(
      '<div class="fila entre"><h2>' + d.esc(c.titulo) + "</h2>" +
      '<button class="icono-btn" data-accion="cerrar-hoja">✕</button></div>' +
      '<p class="chico apagado">' + d.esc(c.artista || "") + "</p>" +
      '<button class="btn azul chico" data-accion="audio" data-texto="' + d.esc(c.lineas.join(". ")) + '">🔊 Escuchar todo</button>' +
      '<ul class="lista-limpia" style="margin-top:12px">' +
      c.lineas.map(function (l) {
        return (
          '<li class="fila" style="padding:8px 0;border-bottom:1px solid var(--borde)">' +
          '<span class="crece">' + d.esc(l) + "</span>" +
          '<button class="icono-btn" data-accion="audio" data-texto="' + d.esc(l) + '">🔊</button></li>'
        );
      }).join("") +
      "</ul>" +
      '<button class="btn hueco chico" style="margin-top:12px" data-accion="borrar-cancion">Borrar esta canción</button>',
      function (a, b, velo) {
        if (a !== "borrar-cancion") return;
        d.confirmar({
          titulo: "¿Borrar “" + c.titulo + "”?",
          texto: "Se quita de tu lista. Puedes volver a pegarla cuando quieras.",
          si: "Borrar",
          peligroso: true,
          alConfirmar: function () {
            A().estado().canciones.splice(i, 1);
            A().guardar();
            velo.remove();
            canciones();
          },
        });
      }
    );
  }

  /* ---------------- Respaldo ---------------- */

  function exportar() {
    const blob = new Blob([A().exportar()], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "ingles-respaldo-" + A().hoy() + ".json";
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      URL.revokeObjectURL(a.href);
      a.remove();
    }, 1000);
  }

  function copiarRespaldo() {
    /* La descarga no siempre está disponible: abierta dentro de otra página
     * (un enlace compartido, por ejemplo) el navegador la bloquea sin avisar.
     * Copiar el respaldo funciona en todos lados: se pega en una nota o se
     * manda por mensaje, y desde ahí se restaura. */
    const texto = A().exportar();
    function aviso(ok) {
      hoja(
        '<h2>' + (ok ? "Respaldo copiado" : "Copia esto y guárdalo") + "</h2>" +
        '<p class="chico apagado">Guárdalo en una nota o mándatelo por mensaje. ' +
        'Para volver a tener tu avance en otro teléfono, usa “Restaurar” y pega este texto en un archivo .json.</p>' +
        '<textarea class="campo" style="min-height:160px;font-size:12px" readonly>' +
        d.esc(texto) + "</textarea>" +
        '<button class="btn" style="margin-top:10px" data-accion="cerrar-hoja">Listo</button>'
      );
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(function () { aviso(true); }, function () { aviso(false); });
    } else {
      aviso(false);
    }
  }

  function importar() {
    const input = d.$("#archivo");
    if (!input) return;
    input.value = "";
    input.onchange = function () {
      const f = input.files[0];
      if (!f) return;
      const lector = new FileReader();
      lector.onload = function () {
        try {
          A().importar(lector.result);
          aplicarTema();
          pintar();
          d.avisar("Progreso restaurado", "Se juntó con lo que ya tenías en este aparato.");
        } catch (e) {
          d.avisar("No se pudo leer el archivo", e.message);
        }
      };
      lector.readAsText(f);
    };
    input.click();
  }

  function sincronizar(avisar) {
    pintar();
    APP.cuenta.sincronizar().then(function (r) {
      pintar();
      if (!avisar) return;
      if (r.ok) APP.audio.efectos.bien();
      else if (r.motivo && r.motivo !== "en-curso" && r.motivo !== "sin-cuenta") {
        d.avisar("No se pudo sincronizar", r.motivo);
      }
    });
  }

  function formularioCuenta(modo) {
    /* Un solo formulario para crear cuenta y para entrar: son los mismos dos
     * campos y la misma pantalla, cambia el texto y a dónde se manda. */
    const crear = modo === "crear";
    const velo = hoja(
      "<h2>" + (crear ? "Crear una cuenta" : "Entrar") + "</h2>" +
      '<p class="chico apagado">' +
      (crear
        ? "Sólo correo y contraseña. No mandamos correos ni pedimos nada más. " +
          "Lo que ya practicaste en este aparato se sube a la cuenta, no se pierde."
        : "Al entrar, lo que tengas acá se junta con lo de tu cuenta.") +
      "</p>" +
      '<input class="campo" id="c-email" type="email" style="min-height:auto;margin-bottom:8px" ' +
      'autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="tu@correo.cl">' +
      '<input class="campo" id="c-clave" type="password" style="min-height:auto" ' +
      'placeholder="' + (crear ? "Contraseña (mínimo 8 caracteres)" : "Contraseña") + '">' +
      '<div id="c-error"></div>' +
      '<button class="btn" style="margin-top:12px" data-accion="c-enviar">' +
      (crear ? "Crear cuenta" : "Entrar") + "</button>" +
      '<div style="height:8px"></div>' +
      '<button class="btn hueco" data-accion="c-cambiar">' +
      (crear ? "Ya tengo cuenta" : "Prefiero crear una cuenta") + "</button>",
      function (a, b, v) {
        if (a === "c-cambiar") {
          v.remove();
          return formularioCuenta(crear ? "entrar" : "crear");
        }
        if (a !== "c-enviar") return;

        const email = d.$("#c-email", v).value.trim();
        const clave = d.$("#c-clave", v).value;
        const caja = d.$("#c-error", v);
        const boton = b;

        if (!email || !clave) {
          caja.innerHTML = '<div class="aviso ojo mini" style="margin-top:10px">Falta el correo o la contraseña.</div>';
          return;
        }

        // El servidor puede estar dormido y tardar; sin este aviso parece colgado.
        boton.disabled = true;
        boton.textContent = crear ? "Creando…" : "Entrando…";
        caja.innerHTML = '<div class="mini apagado" style="margin-top:10px">Puede tardar unos segundos la primera vez.</div>';

        const accion = crear ? APP.cuenta.registrar : APP.cuenta.entrar;
        accion(email, clave).then(
          function () {
            v.remove();
            pintar();
            d.avisar(
              crear ? "Cuenta creada" : "Listo",
              "Tu avance quedó guardado en la cuenta. Entra con el mismo correo en tus otros aparatos."
            );
          },
          function (err) {
            boton.disabled = false;
            boton.textContent = crear ? "Crear cuenta" : "Entrar";
            caja.innerHTML = '<div class="aviso ojo mini" style="margin-top:10px">' + d.esc(err.message) + "</div>";
          }
        );
      }
    );
    const campo = d.$("#c-email", velo);
    if (campo) campo.focus();
    return velo;
  }

  function formularioClave() {
    hoja(
      "<h2>Cambiar contraseña</h2>" +
      '<input class="campo" id="k-actual" type="password" style="min-height:auto;margin-bottom:8px" placeholder="Contraseña actual">' +
      '<input class="campo" id="k-nueva" type="password" style="min-height:auto" placeholder="Contraseña nueva (mínimo 8)">' +
      '<div id="k-error"></div>' +
      '<button class="btn" style="margin-top:12px" data-accion="k-enviar">Cambiar</button>',
      function (a, b, v) {
        if (a !== "k-enviar") return;
        const caja = d.$("#k-error", v);
        b.disabled = true;
        APP.cuenta.cambiarClave(d.$("#k-actual", v).value, d.$("#k-nueva", v).value).then(
          function () {
            v.remove();
            d.avisar("Contraseña cambiada", "Úsala la próxima vez que entres.");
          },
          function (err) {
            b.disabled = false;
            caja.innerHTML = '<div class="aviso ojo mini" style="margin-top:10px">' + d.esc(err.message) + "</div>";
          }
        );
      }
    );
  }

  function confirmarBorrarCuenta() {
    hoja(
      "<h2>Borrar la cuenta</h2>" +
      '<p class="chico apagado">Se borra tu cuenta y la copia de tu avance que está en el servidor. ' +
      "No se puede deshacer.</p>" +
      '<p class="chico apagado">Lo que tienes guardado <b>en este teléfono</b> no se toca: puedes seguir ' +
      "practicando sin cuenta.</p>" +
      '<input class="campo" id="b-clave" type="password" style="min-height:auto" placeholder="Tu contraseña">' +
      '<div id="b-error"></div>' +
      '<button class="btn rojo" style="margin-top:12px" data-accion="b-enviar">Sí, borrar mi cuenta</button>' +
      '<div style="height:8px"></div>' +
      '<button class="btn hueco" data-accion="cerrar-hoja">Cancelar</button>',
      function (a, b, v) {
        if (a !== "b-enviar") return;
        const caja = d.$("#b-error", v);
        b.disabled = true;
        APP.cuenta.borrarCuenta(d.$("#b-clave", v).value).then(
          function () {
            v.remove();
            pintar();
            d.avisar("Cuenta borrada", "Tu avance sigue en este teléfono.");
          },
          function (err) {
            b.disabled = false;
            caja.innerHTML = '<div class="aviso ojo mini" style="margin-top:10px">' + d.esc(err.message) + "</div>";
          }
        );
      }
    );
  }

  function aplicarTema() {
    const t = A().estado().ajustes.tema;
    if (t === "auto") document.documentElement.removeAttribute("data-tema");
    else document.documentElement.setAttribute("data-tema", t);
  }

  /* ---------------- Eventos ---------------- */

  function enganchar() {
    raiz = d.$("#app");

    // Enter manda el mensaje al tutor: en una conversación, tener que buscar el
    // botón cada vez rompe el ritmo.
    raiz.addEventListener("keydown", function (ev) {
      if (ev.key !== "Enter" || ev.target.id !== "tutor-campo") return;
      ev.preventDefault();
      const t = ev.target.value;
      ev.target.value = "";
      enviarAlTutor(t);
    });

    raiz.addEventListener("input", function (ev) {
      if (ev.target.id === "dic-campo") return pintarBusqueda(ev.target.value);
      if (ev.target.getAttribute("data-accion") === "velocidad") {
        A().estado().ajustes.velocidad = parseFloat(ev.target.value);
        A().guardar();
        const et = ev.target.previousElementSibling;
        if (et) et.textContent = "Velocidad al hablar: " + parseFloat(ev.target.value).toFixed(2) + "×";
      }
    });

    d.alTocar(raiz, "[data-accion]", function (b) {
      const a = b.getAttribute("data-accion");
      const e = A().estado();

      if (a === "tab") {
        vista = null;
        tab = b.getAttribute("data-tab");
        pintar();
        return;
      }
      if (a === "desplegar") {
        const id = b.getAttribute("data-id");
        desplegadas[id] = !desplegadas[id];
        return pintar();
      }
      if (a === "leccion") return abrirLeccion(b.getAttribute("data-id"));
      if (a === "repaso") return repaso();
      if (a === "errores") return errores();
      if (a === "tema") return tema(b.getAttribute("data-id"));
      if (a === "reglas") { vista = "reglas"; return pintar(); }
      if (a === "tutor") { vista = "tutor"; return pintar(); }
      if (a === "tutor-enviar") {
        const c = d.$("#tutor-campo", raiz);
        const t = c ? c.value : "";
        if (c) c.value = "";
        return enviarAlTutor(t);
      }
      if (a === "tutor-micro") return dictarAlTutor();
      if (a === "tutor-tema") {
        const t = APP.tutor.ARRANQUES[parseInt(b.getAttribute("data-i"), 10)];
        if (!t) return;
        if (!t.en) {
          const c = d.$("#tutor-campo", raiz);
          if (c) c.focus();
          return;
        }
        return enviarAlTutor(t.en);
      }
      if (a === "tutor-nueva") {
        APP.tutor.reiniciar();
        pintarChat();
        return pintarBarraTutor(true);
      }
      if (a === "regla") return fichaRegla(b.getAttribute("data-id"));
      if (a === "regla-sugerida") {
        const re = APP.reglas.sugerida(3);
        if (re) fichaRegla(re.id);
        return;
      }
      if (a === "examen") return abrirExamen(b.getAttribute("data-id"));
      if (a === "ver-nivel") return verNivel(b.getAttribute("data-id"));
      if (a === "nivelacion") return abrirNivelacion();
      if (a === "saltar-nivelacion") {
        A().estado().ajustes.nivelacionHecha = true;
        A().guardar();
        return pintar();
      }
      if (a === "palabra") return palabra(b.getAttribute("data-palabra"));
      if (a === "volver") { vista = null; return pintar(); }
      if (a === "gramatica") return pantallaGramatica();
      if (a === "verbos") return pantallaVerbos();
      if (a === "sonidos") return pantallaSonidos();
      if (a === "frasario") return frasario();
      if (a === "canciones") return canciones();
      if (a === "audio") return APP.audio.hablar(b.getAttribute("data-texto"));

      if (a === "acento") {
        e.ajustes.acento = b.getAttribute("data-v");
        A().guardar();
        APP.audio.reiniciarVoz();
        APP.audio.hablar("Hello, this is how I sound.");
        pintar();
        return;
      }
      if (a === "apariencia") {
        e.ajustes.tema = b.getAttribute("data-v");
        A().guardar();
        aplicarTema();
        pintar();
        return;
      }
      if (a === "palanca") {
        const k = b.getAttribute("data-clave");
        e.ajustes[k] = e.ajustes[k] === false;
        A().guardar();
        pintar();
        return;
      }
      if (a === "crear-cuenta") return formularioCuenta("crear");
      if (a === "entrar-cuenta") return formularioCuenta("entrar");
      if (a === "cambiar-clave") return formularioClave();
      if (a === "borrar-cuenta") return confirmarBorrarCuenta();
      if (a === "sync-ahora") return sincronizar(true);
      if (a === "salir-cuenta") {
        d.confirmar({
          titulo: "¿Cerrar sesión?",
          texto: "Tu avance se queda en este teléfono. Puedes volver a entrar cuando quieras.",
          si: "Cerrar sesión",
          alConfirmar: function () {
            APP.cuenta.salir().then(function () { pintar(); });
          },
        });
        return;
      }

      if (a === "exportar") return exportar();
      if (a === "copiar") return copiarRespaldo();
      if (a === "importar") return importar();
      if (a === "borrar") {
        d.confirmar({
          titulo: "¿Borrar todo tu progreso?",
          texto: "Se pierden la racha, el XP, el vocabulario aprendido y los logros. No se puede deshacer.",
          si: "Sí, borrar todo",
          peligroso: true,
          alConfirmar: function () {
            A().borrarTodo();
            aplicarTema();
            pintar();
          },
        });
        return;
      }
    });
  }

  window.APP = window.APP || {};
  APP.pantallas = {
    pintar: pintar,
    palabra: palabra,
    preguntarTutor: preguntarTutor,
    enganchar: enganchar,
    aplicarTema: aplicarTema,
    irA: function (t) { tab = t; pintar(); },
  };
})();

</script>
<script>
/* js/puerta.js */
/* La puerta: a la aplicación sólo se entra con correo y contraseña.
 *
 * Dos cosas que conviene tener claras sobre qué protege esto y qué no.
 *
 * Lo que sí: el avance, la cuenta del tutor y todo lo que está en el servidor.
 * Eso ya estaba protegido de verdad — /progreso y /tutor contestan 401 sin
 * sesión — y ninguna pantalla puede saltarse esa comprobación, porque se hace
 * del otro lado.
 *
 * Lo que no: los archivos de la aplicación. Son una página web, y una página
 * web se descarga antes de saber quién la pide. Alguien con conocimientos
 * puede leer el JavaScript sin entrar. No hay nada personal ahí dentro —son
 * las lecciones, las mismas para todos—, así que no es un problema; pero decir
 * que esto "cierra" la aplicación sería prometer de más.
 *
 * Y una decisión importante: si el servidor no contesta, la puerta NO pide la
 * clave. Distinguir "no hay sesión" de "no hubo respuesta" es lo que permite
 * seguir practicando en el metro o con el servidor dormido. Quedarse sin señal
 * no debería dejarte fuera de tu propia aplicación.
 */
(function () {
  "use strict";

  const d = APP.dom;

  let cerrada = false;

  function ajustes() {
    return APP.almacen.estado().ajustes;
  }

  /* ¿Hay que pedir la clave antes de dejar ver nada?
   *
   * Sólo si en este aparato no se ha entrado nunca. Si ya se entró alguna vez,
   * se deja pasar y se comprueba contra el servidor por detrás: así abrir la
   * aplicación es instantáneo y funciona sin señal. */
  function hayQuePedir() {
    return !ajustes().aparatoAbierto;
  }

  /* Lo que se hace cuando el servidor sí contestó y dijo que no hay sesión:
   * la sesión caducó o se cerró desde otro sitio. Ahí sí se cierra la puerta. */
  function revisarTrasArrancar() {
    const e = APP.cuenta.estado();
    if (!e.respondio) return;      // sin respuesta: no se toca nada
    if (e.conectado) return;       // todo en orden
    if (!ajustes().aparatoAbierto) return;
    ajustes().aparatoAbierto = false;
    APP.almacen.guardar();
    pintar("La sesión se cerró. Vuelve a entrar para seguir.");
  }

  function pintar(aviso) {
    cerrada = true;

    /* Se quita lo que hubiera abierto: una lección a medias, una hoja, el
     * diccionario. Si no, la puerta se dibuja encima pero lo de abajo sigue
     * ahí y se alcanza a ver al hacer scroll. */
    Array.prototype.forEach.call(
      document.querySelectorAll(".velo, .leccion"),
      function (e) { e.remove(); }
    );

    const puerta = document.createElement("div");
    puerta.className = "puerta";
    puerta.id = "puerta";
    document.body.appendChild(puerta);
    document.body.classList.add("con-puerta");
    dibujar(puerta, "entrar", aviso || "");
  }

  function dibujar(puerta, modo, aviso) {
    const crear = modo === "crear";
    puerta.innerHTML =
      '<div class="puerta-caja">' +
      '<div class="puerta-marca">⭐</div>' +
      "<h1>Stars Climb</h1>" +
      '<p class="puerta-sub">' +
      (crear
        ? "Crea tu cuenta. Sólo correo y contraseña: no se manda ningún correo ni se pide nada más."
        : "Entra con tu correo y tu contraseña para continuar.") +
      "</p>" +
      (aviso ? '<div class="aviso ojo mini" style="margin-bottom:10px">' + d.esc(aviso) + "</div>" : "") +
      '<form id="puerta-form" autocomplete="on">' +
      '<input class="campo" id="p-email" type="email" name="email" required ' +
      'autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" ' +
      'style="min-height:auto;margin-bottom:8px" placeholder="tu@correo.cl">' +
      '<input class="campo" id="p-clave" type="password" name="password" required ' +
      'autocomplete="' + (crear ? "new-password" : "current-password") + '" ' +
      'style="min-height:auto" placeholder="' +
      (crear ? "Contraseña (mínimo 8 caracteres)" : "Contraseña") + '">' +
      '<div id="p-error"></div>' +
      '<button class="btn" type="submit" id="p-enviar" style="margin-top:12px">' +
      (crear ? "Crear cuenta y entrar" : "Entrar") + "</button>" +
      "</form>" +
      '<div style="height:8px"></div>' +
      '<button class="btn hueco" id="p-cambiar">' +
      (crear ? "Ya tengo cuenta" : "No tengo cuenta, quiero crear una") + "</button>" +
      '<p class="puerta-pie">Tu avance se guarda en tu cuenta. Entra con el mismo ' +
      "correo en el teléfono y en el computador y verás lo mismo en los dos.</p>" +
      "</div>";

    d.$("#p-cambiar", puerta).addEventListener("click", function () {
      dibujar(puerta, crear ? "entrar" : "crear", "");
    });

    /* Un <form> de verdad, y no un botón suelto: así el teclado del teléfono
     * muestra "Entrar", el gestor de contraseñas ofrece rellenar, y la tecla
     * Enter funciona. Son tres cosas gratis que con un div no se tienen. */
    d.$("#puerta-form", puerta).addEventListener("submit", function (ev) {
      ev.preventDefault();
      enviar(puerta, crear);
    });

    const campo = d.$("#p-email", puerta);
    const recordado = ajustes().entroComo;
    if (recordado) campo.value = recordado;
    if (recordado) d.$("#p-clave", puerta).focus();
    else campo.focus();
  }

  function enviar(puerta, crear) {
    const email = d.$("#p-email", puerta).value.trim();
    const clave = d.$("#p-clave", puerta).value;
    const caja = d.$("#p-error", puerta);
    const boton = d.$("#p-enviar", puerta);

    if (!email || !clave) {
      caja.innerHTML = '<div class="aviso ojo mini" style="margin-top:10px">' +
        "Falta el correo o la contraseña.</div>";
      return;
    }

    boton.disabled = true;
    boton.textContent = crear ? "Creando…" : "Entrando…";
    // El servidor gratuito se duerme y tarda en despertar; sin este aviso
    // parece colgado y se cierra la pestaña antes de que conteste.
    caja.innerHTML = '<div class="mini apagado" style="margin-top:10px">' +
      "Puede tardar unos segundos la primera vez del día.</div>";

    const accion = crear ? APP.cuenta.registrar : APP.cuenta.entrar;
    accion(email, clave).then(
      function () { abrir(); },
      function (err) {
        boton.disabled = false;
        boton.textContent = crear ? "Crear cuenta y entrar" : "Entrar";
        caja.innerHTML = '<div class="aviso ojo mini" style="margin-top:10px">' +
          d.esc(err.message) + "</div>";
        d.$("#p-clave", puerta).value = "";
        d.$("#p-clave", puerta).focus();
      }
    );
  }

  function abrir() {
    const puerta = document.getElementById("puerta");
    if (puerta) puerta.remove();
    document.body.classList.remove("con-puerta");
    cerrada = false;
    APP.pantallas.pintar();
  }

  window.APP = window.APP || {};
  APP.puerta = {
    hayQuePedir: hayQuePedir,
    revisarTrasArrancar: revisarTrasArrancar,
    pintar: pintar,
    abierta: function () { return !cerrada; },
  };
})();

</script>
<script>
/* js/app.js */
/* Arranque.
 *
 * Se ejecuta al final: todos los módulos ya se registraron en window.APP.
 */
(function () {
  "use strict";

  function arrancar() {
    APP.pantallas.aplicarTema();
    APP.pantallas.enganchar();

    /* La puerta. A la aplicación se entra con correo y contraseña.
     *
     * Si en este aparato no se ha entrado nunca, se pide antes de dibujar
     * nada: no tiene sentido pintar la aplicación entera para taparla medio
     * segundo después. Si ya se entró alguna vez, se abre de inmediato y la
     * sesión se comprueba por detrás — así abrir es instantáneo y sigue
     * funcionando sin señal. */
    if (APP.puerta.hayQuePedir()) {
      APP.puerta.pintar();
      registrarServicio();
      return;
    }

    APP.pantallas.pintar();

    /* Al volver a la aplicación después de un rato hay que redibujar: las vidas
     * se recuperan con el reloj y la racha cambia a medianoche, así que la
     * pantalla que quedó abierta puede estar mostrando datos de ayer. */
    document.addEventListener("visibilitychange", function () {
      if (document.hidden || document.getElementById("leccion")) return;
      if (!APP.puerta.abierta()) return;
      APP.pantallas.pintar();
      // Al volver puede que se haya practicado en otro aparato.
      APP.cuenta.sincronizarSiCorresponde(5).then(function (r) {
        if (r.ok) APP.pantallas.pintar();
      });
    });

    /* Al abrir se pregunta si hay sesión y, si la hay, se baja el avance del
     * servidor antes de redibujar. No se espera a que termine: la aplicación ya
     * se dibujó con lo local y tiene que poder usarse aunque el servidor esté
     * dormido o no haya señal. */
    APP.cuenta.arrancar().then(function (r) {
      // Si el servidor contestó que la sesión ya no vale, se cierra la puerta.
      APP.puerta.revisarTrasArrancar();
      if (r.ok && APP.puerta.abierta()) APP.pantallas.pintar();
    });

    registrarServicio();
    prepararInstalacion();
  }

  function registrarServicio() {
    if (!("serviceWorker" in navigator)) return;
    // La versión de una sola página (la que se abre desde un enlace, sin
    // instalar) no tiene sw.js: sin esta marca intentaría registrarlo y dejaría
    // un error en la consola cada vez que abre.
    if (!document.querySelector('meta[name="modo-sin-conexion"]')) return;

    /* Recargar sola cuando llega una versión nueva.
     *
     * Sin esto, publicar una versión nueva no se ve aunque todo esté bien
     * hecho. El service worker nuevo se instala y toma el control —hace
     * skipWaiting y claim— pero la página que ya está abierta se quedó con el
     * JavaScript que cargó al principio, que es el viejo. Hacía falta una
     * segunda recarga a mano, y nadie recarga dos veces: se concluye que la
     * actualización no llegó.
     *
     * 'teniaControlador' distingue el caso que sí importa. La primera vez que
     * alguien abre la aplicación no hay controlador y el evento igual salta:
     * recargar ahí sería un parpadeo gratis en la primera visita, justo la
     * peor para dar una impresión rara.
     */
    const teniaControlador = !!navigator.serviceWorker.controller;
    let recargando = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (!teniaControlador || recargando) return;
      recargando = true;
      window.location.reload();
    });

    // La ruta es relativa a propósito: la aplicación tiene que funcionar igual
    // servida desde la raíz del dominio o desde una subcarpeta.
    navigator.serviceWorker.register("sw.js").then(function (reg) {
      /* Y se vuelve a preguntar al volver a la aplicación. Una aplicación
       * instalada puede pasarse semanas sin recargarse —se deja en segundo
       * plano y se vuelve a ella— y entonces nunca se enteraría de que hay
       * algo nuevo. */
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) reg.update().catch(function () {});
      });
    }).catch(function () {
      /* sin service worker sigue funcionando, sólo que no offline */
    });
  }

  function prepararInstalacion() {
    /* Chrome en Android permite ofrecer la instalación con un botón propio.
     * Safari no: ahí sólo quedan las instrucciones que están en Ajustes. */
    window.addEventListener("beforeinstallprompt", function (ev) {
      ev.preventDefault();
      const caja = document.getElementById("instalar-caja");
      if (!caja) return;
      caja.innerHTML = '<button class="btn" style="margin-top:10px">📲 Instalar ahora</button>';
      caja.querySelector("button").addEventListener("click", function () {
        ev.prompt();
        caja.innerHTML = "";
      });
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", arrancar);
  } else {
    arrancar();
  }
})();

</script>
