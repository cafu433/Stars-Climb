      if (e) out.push(e);
    });
    const hablar = ejercicioHablar(v, alAzar(["presente", "pasado", "futuro"]));
    if (hablar) out.push(hablar);
    if (APP.almacen.estado().ajustes.teclado !== false) {
      out.push(ejercicioEscribir(v, alAzar(["presente", "pasado", "perfecto"])));
    }
    return out.slice(0, n || 8);
  }

  window.APP = window.APP || {};
  APP.verbos = {
    PERSONAS: PERSONAS,
    TIEMPOS: TIEMPOS,
    tercera: tercera,
    gerundio: gerundio,
    conjugar: conjugar,
    conFrase: conFrase,
    tabla: tabla,
    formasPrincipales: formasPrincipales,
    banco: banco,
    sesion: sesion,
    sesionDeUnVerbo: sesionDeUnVerbo,
    idTarjeta: idTarjeta,
  };
})();

</script>
<script>
/* js/pronunciacion.js */
/* Pronunciación: entrenar el oído antes que la boca.
 *
 * El orden importa y es al revés de lo que parece. No se puede pronunciar una
 * diferencia que no se oye: si "ship" y "sheep" suenan igual, decirlas distinto
 * es imposible. Por eso el módulo empieza siempre escuchando —pares mínimos,
 * dos palabras que sólo cambian en la vocal— y sólo después pide repetir.
 *
 * Los ejercicios salen con la misma forma que los del resto de la aplicación,
 * así que la pantalla de lección los dibuja sin saber de dónde vienen.
 */
(function () {
  "use strict";

  const D = function () { return APP.datosSonidos; };

  function revolver(a) {
    const x = a.slice();
    for (let i = x.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = x[i]; x[i] = x[j]; x[j] = t;
    }
    return x;
  }

  function alAzar(a) {
    return a[Math.floor(Math.random() * a.length)];
  }

  function idTarjeta(sonidoId, que) {
    return "sonido:" + sonidoId + ":" + (que || "oido");
  }

  /* ---------------- Escuchar y distinguir ---------------- */

  function ejercicioPar(par) {
    if (!APP.audio.hayVoz()) return null;
    const objetivo = Math.random() < 0.5 ? par.a : par.b;
    const sonidoA = D().sonido(par.sonidoA);
    const sonidoB = D().sonido(par.sonidoB);
    const elObjetivo = objetivo === par.a ? sonidoA : sonidoB;

    return {
      tipo: "escucha-elige",
      tarjetaId: idTarjeta(elObjetivo.id, "oido"),
      enunciado: "¿Qué palabra escuchaste?",
      audio: objetivo,
      autoAudio: true,
      opciones: revolver([
        { texto: par.a, simbolo: sonidoA.simbolo, correcta: objetivo === par.a },
        { texto: par.b, simbolo: sonidoB.simbolo, correcta: objetivo === par.b },
      ]),
      respuesta: objetivo,
      explicacion:
        "“" + par.a + "” lleva /" + sonidoA.simbolo + "/ y “" + par.b + "” lleva /" +
        sonidoB.simbolo + "/. " + elObjetivo.comoSuena,
      traduccion: par.es,
    };
  }

  function ejercicioIdentificar(sonido) {
    /* Al revés que el anterior: se oye una palabra y hay que decir qué sonido
     * tiene. Obliga a poner nombre a lo que se oye, que es lo que permite
     * después corregirse solo. */
    if (!APP.audio.hayVoz()) return null;
    const palabra = alAzar(sonido.ejemplos);
    const otros = revolver(
      D().SONIDOS.filter(function (s) { return s.id !== sonido.id && s.tipo === sonido.tipo; })
    ).slice(0, 3);
    if (otros.length < 2) return null;

    return {
      tipo: "escucha-elige",
      tarjetaId: idTarjeta(sonido.id, "identificar"),
      enunciado: "¿Qué vocal tiene esta palabra?",
      audio: palabra,
      autoAudio: true,
      opciones: revolver(
        [{ texto: "/" + sonido.simbolo + "/", correcta: true }].concat(
          otros.map(function (s) { return { texto: "/" + s.simbolo + "/", correcta: false }; })
        )
      ),
      respuesta: "/" + sonido.simbolo + "/",
      explicacion: "“" + palabra + "” lleva /" + sonido.simbolo + "/. " + sonido.comoSuena,
    };
  }

  function ejercicioHablar(sonido) {
    if (!APP.audio.hayMicrofono()) return null;
    const palabra = alAzar(sonido.ejemplos);
    return {
      tipo: "habla",
      tarjetaId: idTarjeta(sonido.id, "voz"),
      enunciado: "Dilo en voz alta",
      prompt: palabra,
      traduccion: "/" + sonido.simbolo + "/ — " + sonido.comoSuena,
      audio: palabra,
      respuesta: palabra,
    };
  }

  function ejercicioParHablado(par) {
    /* Decir las dos palabras seguidas es más difícil y más útil que decir una:
     * obliga a producir la diferencia, no sólo el sonido. */
    if (!APP.audio.hayMicrofono()) return null;
    const frase = par.a + " " + par.b;
    return {
      tipo: "habla",
      tarjetaId: idTarjeta(par.sonidoA, "par-voz"),
      enunciado: "Di las dos, marcando la diferencia",
      prompt: frase,
      traduccion: par.es,
      audio: frase,
      respuesta: frase,
    };
  }

  /* ---------------- Sesiones ---------------- */

  function peso(id) {
    const t = APP.srs.tarjeta(id);
    if (!t.rep && !t.fallos) return 3;
    if (APP.srs.vencida(id)) return 5;
    return Math.max(0.4, 3 * (1 - APP.srs.fuerza(id)));
  }

  function sortear(lista, n, aId) {
    const pool = lista.slice();
    const out = [];
    while (out.length < n && pool.length) {
      const pesos = pool.map(function (x) { return peso(aId(x)); });
      const total = pesos.reduce(function (a, b) { return a + b; }, 0);
      let r = Math.random() * total;
      let i = 0;
      while (i < pool.length - 1 && r > pesos[i]) { r -= pesos[i]; i++; }
      out.push(pool.splice(i, 1)[0]);
    }
    return out;
  }

  function sesionDeUnSonido(sonidoId, n) {
    // Todo lo que se puede practicar de un sonido concreto, de oír a decir.
    const s = D().sonido(sonidoId);
    if (!s) return [];
    const out = [];
    const pares = D().paresDe(sonidoId);

    pares.slice(0, 4).forEach(function (p) {
      const e = ejercicioPar(p);
      if (e) out.push(e);
    });

    const id = ejercicioIdentificar(s);
    if (id) out.push(id);

    // El schwa no tiene pares mínimos —sólo aparece en sílabas sin acento— así
    // que su práctica es identificarlo y repetirlo, no distinguirlo.
    if (!pares.length) {
      const otro = ejercicioIdentificar(s);
      if (otro) out.push(otro);
    }

    const hablar = ejercicioHablar(s);
    if (hablar) out.push(hablar);
    if (pares.length) {
      const parHablado = ejercicioParHablado(pares[0]);
      if (parHablado) out.push(parHablado);
    }

    return out.slice(0, n || 10);
  }

  function sesionMezcla(filtro, n) {
    /* filtro: "simple" | "diptongo" | null (todos)
     * Mezcla pares mínimos de todos los sonidos, priorizando los que cuestan. */
    const cuantos = n || 12;
    let pares = D().PARES;
    if (filtro) {
      pares = pares.filter(function (p) {
        const a = D().sonido(p.sonidoA);
        const b = D().sonido(p.sonidoB);
        return (a && a.tipo === filtro) || (b && b.tipo === filtro);
      });
    }
    const elegidos = sortear(pares, cuantos, function (p) { return idTarjeta(p.sonidoA, "oido"); });
    const out = [];
    elegidos.forEach(function (p, i) {
      // Uno de cada cuatro se practica hablando, para que no sea sólo oído.
      const e = i > 0 && i % 4 === 3 ? ejercicioParHablado(p) || ejercicioPar(p) : ejercicioPar(p);
      if (e) out.push(e);
    });
    return out;
  }

  function progresoDeSonido(sonidoId) {
    // Cuánto se lleva de un sonido: promedio de sus tarjetas de oído y de voz.
    const ids = [idTarjeta(sonidoId, "oido"), idTarjeta(sonidoId, "identificar"), idTarjeta(sonidoId, "voz")];
    let suma = 0;
    ids.forEach(function (id) { suma += APP.srs.fuerza(id); });
    return suma / ids.length;
  }

  window.APP = window.APP || {};
  APP.pronunciacion = {
    sesionDeUnSonido: sesionDeUnSonido,
    sesionMezcla: sesionMezcla,
    progresoDeSonido: progresoDeSonido,
    idTarjeta: idTarjeta,
  };
})();

</script>
<script>
/* js/gramatica.js */
/* Practicar una regla de gramática justo después de leerla.
 *
 * Una explicación que se lee y no se usa se olvida esa misma tarde. Por eso
 * cada tema tiene su botón de practicar, y los ejercicios salen de los propios
 * ejemplos del tema: lo que acaba de leer es lo que le va a tocar armar.
 *
 * El ejercicio propio de este módulo es "la trampa": se muestran la frase mal y
 * la frase bien, y hay que elegir. Es incómodo a propósito —la incorrecta suele
 * ser la que uno diría— y por eso se pega.
 */
(function () {
  "use strict";

  function revolver(a) {
    const x = a.slice();
    for (let i = x.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = x[i]; x[i] = x[j]; x[j] = t;
    }
    return x;
  }

  function idTarjeta(tema, que) {
    return "gramatica:" + tema.id + ":" + que;
  }

  function ejercicioTrampa(tema) {
    /* Elegir entre la frase mal y la bien. Se marca cuál es cuál sólo después
     * de responder: verlas juntas antes de decidir haría el ejercicio trivial. */
    return {
      tipo: "elige-en",
      tarjetaId: idTarjeta(tema, "trampa"),
      enunciado: "¿Cuál está bien dicha?",
      prompt: tema.titulo,
      opciones: revolver([
        { texto: tema.trampa.bien, correcta: true },
        { texto: tema.trampa.mal, correcta: false },
      ]),
      respuesta: tema.trampa.bien,
      explicacion: tema.trampa.porque,
      audioAlAcertar: tema.trampa.bien,
    };
  }

  function fichas(frase) {
    return (frase || "").trim().split(/\s+/);
  }

  function ejercicioArmar(tema, ejemplo, banco) {
    const piezas = fichas(ejemplo.en);
    if (piezas.length < 3) return null;
    // Un par de fichas de más, sacadas de otros ejemplos del mismo tema: si
    // sobran justo las palabras que no van, el ejercicio enseña algo.
    const usadas = {};
    piezas.forEach(function (p) { usadas[p.toLowerCase()] = true; });
    const senuelo = [];
    banco.forEach(function (o) {
      if (o.en === ejemplo.en) return;
      fichas(o.en).forEach(function (p) {
        if (!usadas[p.toLowerCase()] && !/^[A-Z]/.test(p) && senuelo.indexOf(p) < 0) senuelo.push(p);
      });
    });
    return {
      tipo: "arma",
      tarjetaId: idTarjeta(tema, "arma:" + ejemplo.en.slice(0, 20)),
      enunciado: "Arma la frase en inglés",
      prompt: ejemplo.es,
      respuesta: ejemplo.en,
      fichas: revolver(piezas.concat(revolver(senuelo).slice(0, 2))),
      audioAlAcertar: ejemplo.en,
      idioma: "en",
    };
  }

  function ejercicioEscribir(tema, ejemplo) {
    if (ejemplo.en.split(/\s+/).length > 9) return null;
    return {
      tipo: "escribe",
      tarjetaId: idTarjeta(tema, "escribe:" + ejemplo.en.slice(0, 20)),
      enunciado: "Escríbelo en inglés",
      prompt: ejemplo.es,
      respuesta: ejemplo.en,
      audioAlAcertar: ejemplo.en,
    };
  }

  function ejercicioTraducir(tema, ejemplo, banco) {
    const otros = revolver(banco.filter(function (o) { return o.en !== ejemplo.en; })).slice(0, 3);
    if (otros.length < 3) return null;
    return {
      tipo: "elige-es",
      tarjetaId: idTarjeta(tema, "traduce:" + ejemplo.en.slice(0, 20)),
      enunciado: "¿Qué significa?",
      prompt: ejemplo.en,
      audio: ejemplo.en,
      opciones: revolver(
        [{ texto: ejemplo.es, correcta: true }].concat(
          otros.map(function (o) { return { texto: o.es, correcta: false }; })
        )
      ),
      respuesta: ejemplo.es,
    };
  }

  function ejercicioDictado(tema, ejemplo) {
    if (!APP.audio.hayVoz()) return null;
    if (ejemplo.en.split(/\s+/).length > 9) return null;
    return {
      tipo: "escribe",
      tarjetaId: idTarjeta(tema, "dictado:" + ejemplo.en.slice(0, 20)),
      enunciado: "Escucha y escribe lo que oyes",
      audio: ejemplo.en,
      autoAudio: true,
      respuesta: ejemplo.en,
      traduccion: ejemplo.es,
    };
  }

  function sesionDeUnTema(tema, n) {
    if (!tema) return [];
    const out = [ejercicioTrampa(tema)];
    const banco = tema.ejemplos;
    const teclado = APP.almacen.estado().ajustes.teclado !== false;

    revolver(banco).forEach(function (ej, i) {
      let e = null;
      if (i % 3 === 0) e = ejercicioArmar(tema, ej, banco);
      else if (i % 3 === 1) e = ejercicioTraducir(tema, ej, banco);
      else e = teclado ? ejercicioEscribir(tema, ej) : ejercicioArmar(tema, ej, banco);
      if (e) out.push(e);
    });

    // Uno de dictado al final, si hay voz: obliga a oír la estructura, no sólo
    // a reconocerla escrita.
    const dictado = ejercicioDictado(tema, banco[0]);
    if (dictado) out.push(dictado);

    return out.slice(0, n || 10);
  }

  function sesionMezcla(n) {
    /* Un repaso de todas las trampas juntas. Es el ejercicio más útil del
     * módulo: son exactamente los errores que hay que dejar de cometer. */
    const temas = APP.datosGramatica.TEMAS;
    const pesados = temas.slice().sort(function (a, b) {
      return APP.srs.fuerza(idTarjeta(a, "trampa")) - APP.srs.fuerza(idTarjeta(b, "trampa"));
    });
    return revolver(pesados.slice(0, n || 12)).map(ejercicioTrampa);
  }

  function progresoDeTema(tema) {
    return APP.srs.fuerza(idTarjeta(tema, "trampa"));
  }

  window.APP = window.APP || {};
  APP.gramatica = {
    sesionDeUnTema: sesionDeUnTema,
    sesionMezcla: sesionMezcla,
    progresoDeTema: progresoDeTema,
    idTarjeta: idTarjeta,
  };
})();

</script>
<script>
/* js/reglas.js */
/* Practicar una regla hasta que salga sola.
 *
 * El módulo de gramática explica; éste automatiza, que es lo otro y no lo
 * mismo. Entender que "he" lleva -s se consigue leyendo una vez; decirlo sin
 * pensarlo se consigue haciéndolo doscientas veces. Para lo segundo hacen
 * falta ejercicios que no se acaben y que no se puedan contestar de memoria,
 * que es lo que resuelve 'generar' en datos-reglas.js.
 *
 * La tanda sube de exigencia sola, en tres etapas:
 *
 *   0  elegir entre opciones — para cuando la regla es nueva
 *   1  escribir la respuesta — es bastante más difícil y es lo que la fija
 *   2  dominada — se deja de insistir y pasa al repaso de mantenimiento
 *
 * Que suba sola importa: quedarse siempre en opciones da la sensación de
 * saberlo sin saberlo, porque reconocer la respuesta entre tres es mucho más
 * fácil que producirla. Y empezar escribiendo, cuando la regla es nueva, sólo
 * consigue que se falle todo y se abandone.
 */
(function () {
  "use strict";

  const APP = window.APP;
  const LARGO = 12;

  /* Evita que salga dos veces seguidas el mismo ejercicio. Es más importante
   * de lo que parece: repetido al hilo se contesta sin leer, de memoria corta,
   * y esa repetición no enseña nada. */
  /* 'forzar' permite pedir explícitamente ejercicios de elegir o de escribir,
   * sin mirar el dominio. Lo usa la lección por etapas: primero una tanda de
   * reconocer y después una de escribir, en la misma sesión. Sin esto, una
   * lección sólo podía dar uno de los dos y la etapa de escribir no existía
   * hasta ocho aciertos después. */
  function tanda(reglaId, cuantos, forzar) {
    const regla = APP.datosReglas.regla(reglaId);
    if (!regla) return [];

    const n = cuantos || LARGO;
    const escribir = forzar === "escribir"
      ? true
      : forzar === "elegir"
        ? false
        : APP.almacen.etapaRegla(reglaId) >= 1;
    const out = [];
    const vistas = {};
    let intentos = 0;

    while (out.length < n && intentos < n * 30) {
      intentos++;
      const e = regla.generar();
      const huella = e.frase + "|" + e.ok;
      if (vistas[huella]) continue;
      vistas[huella] = true;
      out.push(armar(regla, e, escribir));
    }

    // Si la regla tiene pocas variantes, se completa repitiendo antes que
    // devolver una tanda a medias.
    while (out.length < n) {
      out.push(armar(regla, regla.generar(), escribir));
    }
    return out;
  }

  function armar(regla, e, escribir) {
    return {
      tipo: escribir ? "regla-escribe" : "regla-elige",
      regla: regla.id,
      tituloRegla: regla.titulo,
      frase: e.frase,
      // La traducción de apoyo se arma juntando trozos, así que a veces empieza
      // con el sujeto en minúscula ("yo estoy cansada"). Se corrige acá y no en
      // cada generador, que son diecisiete.
      es: mayuscula(e.es),
      // En modo escribir no se mandan opciones: enseñarlas sería regalar la
      // respuesta, y el punto de esta etapa es producirla sin ayuda.
      opciones: escribir ? null : e.opciones,
      ok: e.ok,
      porque: e.porque,
      clave: regla.clave,
    };
  }

  /* La frase completa, con el hueco ya relleno. Es lo que se muestra al
   * corregir: ver la oración entera bien escrita enseña más que ver la palabra
   * suelta fuera de contexto. */
  function resuelta(ej, respuesta) {
    const r = respuesta === undefined ? ej.ok : respuesta;
    // Algunas respuestas traen dos huecos separados por " / " (Have / been).
    if (r.indexOf(" / ") > 0 && ej.frase.split("___").length === 3) {
      const partes = r.split(" / ");
      const trozos = ej.frase.split("___");
      return trozos[0] + partes[0] + trozos[1] + partes[1] + trozos[2];
    }
    return ej.frase.replace("___", r);
  }

  /* Se acepta con holgura: mayúsculas, espacios de más y el apóstrofo curvo
   * que ponen los teclados de iPhone. Lo que no se acepta es otra respuesta,
   * aunque se le parezca: el punto del ejercicio es justo esa distinción. */
  function correcta(ej, respuesta) {
    return normalizar(respuesta) === normalizar(ej.ok);
  }

  function mayuscula(t) {
    const x = String(t || "");
    return x ? x.charAt(0).toUpperCase() + x.slice(1) : x;
  }

  function normalizar(t) {
    return String(t || "")
      .toLowerCase()
      .replace(/[‘’ʼ]/g, "'")
      .replace(/\s+/g, " ")
      .replace(/^[\s.]+|[\s.]+$/g, "");
  }

  function anotar(ej, acierto) {
    return APP.almacen.anotarRegla(ej.regla, acierto);
  }

  /* Qué practicar ahora, si no se elige nada: primero lo empezado y no
   * dominado, después lo que no se ha tocado nunca. Así una tanda suelta no
   * abre siempre una regla nueva y deja diez a medias. */
  function sugerida(nivelMaximo) {
    const candidatas = APP.datosReglas.delNivel(nivelMaximo || 3);
    const empezadas = [];
    const nuevas = [];
    candidatas.forEach(function (r) {
      const e = APP.almacen.regla(r.id);
      if (e.dominada) return;
      (e.vistos > 0 ? empezadas : nuevas).push(r);
    });
    // Entre las empezadas, la que peor va: es la que más falta hace.
    empezadas.sort(function (a, b) {
      return APP.almacen.regla(a.id).seguidos - APP.almacen.regla(b.id).seguidos;
    });
    return empezadas[0] || nuevas[0] || candidatas[0] || null;
  }

  function resumen(nivelMaximo) {
    const lista = APP.datosReglas.delNivel(nivelMaximo || 3);
    let dominadas = 0;
    let empezadas = 0;
    lista.forEach(function (r) {
      const e = APP.almacen.regla(r.id);
      if (e.dominada) dominadas++;
      else if (e.vistos > 0) empezadas++;
    });
    return {
      total: lista.length,
      dominadas: dominadas,
      empezadas: empezadas,
      sinEmpezar: lista.length - dominadas - empezadas,
    };
  }

  /* Cuánto le falta a una regla para la etapa siguiente, para poder dibujar la
   * barra de avance. */
  function avance(reglaId) {
    const e = APP.almacen.regla(reglaId);
    const etapa = APP.almacen.etapaRegla(reglaId);
    if (etapa === 2) return { etapa: 2, hechos: 1, faltan: 0, de: 1 };
    const meta = etapa === 0 ? APP.almacen.PARA_ESCRIBIR : APP.almacen.PARA_DOMINAR;
    const desde = etapa === 0 ? 0 : APP.almacen.PARA_ESCRIBIR;
    return {
      etapa: etapa,
      hechos: Math.max(0, e.seguidos - desde),
      de: meta - desde,
      faltan: Math.max(0, meta - e.seguidos),
    };
  }

  APP.reglas = {
    LARGO: LARGO,
    tanda: tanda,
    resuelta: resuelta,
    correcta: correcta,
    anotar: anotar,
    sugerida: sugerida,
    resumen: resumen,
    avance: avance,
  };
})();

</script>
<script>
/* js/diccionario.js */
/* Tocar una palabra y saber qué es.
 *
 * Es la función que más veces se usa y la que menos se nota: leyendo cualquier
 * cosa en un idioma que no dominas, tropiezas con una palabra cada dos líneas.
 * Si averiguarla cuesta salir de la aplicación, abrir un traductor y volver,
 * no se averigua: se salta. Y saltarla es justo lo que impide aprenderla.
 *
 * Busca en lo que la aplicación ya tiene —448 tarjetas, 102 verbos con todas
 * sus formas, los sonidos de las vocales— así que funciona sin internet, que
 * es cuando más falta hace: en el metro, en la sala de espera.
 *
 * Lo que no encuentra, lo dice. Inventar una traducción sería peor que no dar
 * ninguna: enseñaría algo falso con toda la confianza del mundo. Cuando hay
 * internet y una cuenta con el tutor configurado, se puede preguntar ahí.
 */
(function () {
  "use strict";

  const APP = window.APP;

  /* Para buscar se quitan el puntuado y las mayúsculas, pero NO el apóstrofo:
   * "don't" y "dont" son cosas distintas, y "it's" no es "its". */
  function limpiar(palabra) {
    return String(palabra || "")
      .toLowerCase()
      .replace(/[‘’ʼ]/g, "'")
      .replace(/^[^a-z']+|[^a-z']+$/g, "");
  }

  let indice = null;

  function construir() {
    if (indice) return indice;
    indice = {};

    function meter(clave, ficha) {
      const k = limpiar(clave);
      if (!k) return;
      // La primera definición manda: las tarjetas de vocabulario son más
      // precisas que una frase donde la palabra aparece de pasada.
      if (!indice[k]) indice[k] = ficha;
    }

    // 1. El vocabulario: es lo más fiable, una palabra con su traducción.
    APP.datos.TARJETAS.forEach(function (t) {
      if (t.tipo !== "palabra") return;
      meter(t.en, {
        en: t.en, es: t.es, icon: t.icon || null, nota: t.nota || null,
        de: "vocabulario", skill: t.skill,
      });
    });

    /* 2. Los verbos, con todas sus formas apuntando al infinitivo: quien
     * tropieza con "bought" necesita saber que es el pasado de "buy", no
     * quedarse sin nada porque "bought" no esté en ninguna lista.
     *
     * Ojo con de dónde se sacan. Hay dos listas de verbos: la vieja de
     * APP.datos.VERBOS, con 37 y el campo llamado "past", y el banco de
     * APP.datosVerbos, con 102 y los campos pasado/participio. Usar la
     * primera dejaba fuera todos los pasados sin dar ningún error, porque
     * v.pasado salía undefined y la forma simplemente no se indexaba. */
    const banco = (APP.datosVerbos && APP.datosVerbos.VERBOS) || [];
    banco.forEach(function (v) {
      const formas = [
        [v.base, "base"],
        [v.pasado, "pasado de " + v.base],
        [v.participio, "participio de " + v.base],
        [APP.verbos.tercera(v), "he/she/it " + v.base],
        [APP.verbos.gerundio(v), "-ing de " + v.base],
      ];
      if (v.pasado2) formas.push([v.pasado2, "pasado de " + v.base]);
      formas.forEach(function (f) {
        meter(f[0], {
          en: f[0], es: v.es, de: "verbo", verbo: v.base, forma: f[1],
          irregular: !!v.irregular, nota: v.nota || null,
        });
      });
    });

    // 3. El glosario de los textos de lectura: ya viene palabra por palabra y
    // con la traducción escrita para ese contexto.
    ((APP.datosLectura && APP.datosLectura.TEXTOS) || []).forEach(function (t) {
      (t.glosario || []).forEach(function (g) {
        meter(g.en, { en: g.en, es: g.es, de: "glosario" });
        // Las de varias palabras ("out of stock") también por la primera.
        if (g.en.indexOf(" ") > 0) meter(g.en.split(" ")[0], { en: g.en, es: g.es, de: "glosario" });
      });
    });

    // 4. Las palabras corrientes que aparecen en las frases del curso pero no
    // son tema de vocabulario de nadie: hello, invoice, because.
    ((APP.datosPalabras && APP.datosPalabras.PALABRAS) || []).forEach(function (w) {
      meter(w.en, { en: w.en, es: w.es, de: "palabra", clase: w.clase || null, nota: w.nota || null });
    });

    // 5. Las expresiones y phrasal verbs de varias palabras se indexan por su
    // primera palabra, para poder ofrecerlas cuando se toca ahí.
    APP.datos.TARJETAS.forEach(function (t) {
      if (t.tipo !== "palabra" || t.en.indexOf(" ") < 0) return;
      const primera = limpiar(t.en.split(" ")[0]);
      if (!primera) return;
      (compuestas[primera] = compuestas[primera] || []).push(t);
    });

    return indice;
  }

  const compuestas = {};

  /* Busca una palabra. Si no está tal cual, se prueban las terminaciones
   * regulares antes de rendirse: "invoices" no está en la lista pero "invoice"
   * sí, y decir "no la tengo" teniéndola sería absurdo. */
  function buscar(palabra) {
    const idx = construir();
    const k = limpiar(palabra);
    if (!k) return null;

    if (idx[k]) return Object.assign({ buscado: palabra }, idx[k]);

    const pruebas = [];

    if (/ies$/.test(k)) pruebas.push(k.slice(0, -3) + "y");
    if (/es$/.test(k)) pruebas.push(k.slice(0, -2));
    if (/s$/.test(k)) pruebas.push(k.slice(0, -1));
    if (/'s$/.test(k)) pruebas.push(k.slice(0, -2));
    if (/ed$/.test(k)) {
      pruebas.push(k.slice(0, -2), k.slice(0, -1));
      if (/(.)\1ed$/.test(k)) pruebas.push(k.slice(0, -3));      // stopped → stop
      if (/ied$/.test(k)) pruebas.push(k.slice(0, -3) + "y");     // studied → study
    }
    if (/ing$/.test(k)) {
      pruebas.push(k.slice(0, -3), k.slice(0, -3) + "e");
      if (/(.)\1ing$/.test(k)) pruebas.push(k.slice(0, -4));      // stopping → stop
    }
    /* Comparativos y superlativos. Sin esto, "cheaper" y "bigger" no se
     * encontraban aunque "cheap" y "big" estuvieran: son de las palabras que
     * más salen en los ejercicios de comparar, justo donde hace falta poder
     * mirar qué significa la palabra de base. */
    if (/ier$/.test(k)) pruebas.push(k.slice(0, -3) + "y");       // heavier → heavy
    if (/iest$/.test(k)) pruebas.push(k.slice(0, -4) + "y");
    if (/er$/.test(k)) {
      pruebas.push(k.slice(0, -2), k.slice(0, -1));
      // La consonante doblada está ANTES del -er, no al final de la palabra:
      // "bigger" es bigg+er. Mirar sólo el final dejaba fuera todo este grupo.
      if (/(.)\1er$/.test(k)) pruebas.push(k.slice(0, -3));       // bigger → big
    }
    if (/est$/.test(k)) {
      pruebas.push(k.slice(0, -3), k.slice(0, -2));
      if (/(.)\1est$/.test(k)) pruebas.push(k.slice(0, -4));
    }

    for (let i = 0; i < pruebas.length; i++) {
      const otra = idx[pruebas[i]];
      if (otra) {
        return Object.assign({ buscado: palabra, derivadaDe: pruebas[i] }, otra);
      }
    }
    return null;
  }

  /* Buscar al revés: del español al inglés.
   *
   * Es la mitad que faltaba. Tocar una palabra sirve cuando estás leyendo,
   * pero la pregunta más frecuente de quien escribe es la contraria: "¿cómo se
   * dice factura?". Sin esto había que salir de la aplicación a buscarlo.
   *
   * Se buscan las traducciones enteras y también sus trozos, porque muchas
   * están escritas como "boleta, recibo" o "encargarse de": quien escribe
   * "recibo" tiene que encontrarla igual.
   */
  function buscarEs(texto) {
    const idx = construir();
    const q = String(texto || "").toLowerCase().trim();
    if (q.length < 2) return [];

    const exactas = [];
    const empiezan = [];
    const contienen = [];
    const vistos = {};

    Object.keys(idx).forEach(function (k) {
      const f = idx[k];

      /* Las formas de un verbo comparten traducción, así que buscar "trabajar"
       * devolvía work, works, worked y working: cuatro resultados que son el
       * mismo verbo y que no ayudan a elegir. Se muestra sólo el infinitivo;
       * las demás formas se encuentran buscando en inglés, que es cuando
       * importan. */
      if (f.de === "verbo" && f.forma !== "base") return;

      // Y los plurales, por lo mismo: "facturas" al lado de "factura" no
      // informa de nada.
      const clave = f.verbo || f.en;
      if (vistos[clave]) return;

      const es = String(f.es || "").toLowerCase();
      if (!es) return;
      const trozos = es.split(/[,;]\s*/);

      if (trozos.indexOf(q) >= 0) { vistos[clave] = true; exactas.push(f); return; }
      if (trozos.some(function (t) { return t.indexOf(q) === 0; })) {
        vistos[clave] = true; empiezan.push(f); return;
      }
      if (es.indexOf(q) >= 0) { vistos[clave] = true; contienen.push(f); }
    });

    // Lo exacto primero: quien escribe "casa" quiere "house", no "en la casa".
    return exactas.concat(empiezan, contienen).slice(0, 12);
  }

  /* Una búsqueda que no sabe de antemano en qué idioma viene. Se prueba primero
   * como inglés —es una sola consulta y es lo más común mientras se lee— y si
   * no hay nada, como español. */
  function buscarLibre(texto) {
    const q = String(texto || "").trim();
    if (!q) return { en: null, es: [] };
    return { en: buscar(q), es: buscarEs(q) };
  }

  /* Expresiones que empiezan por esta palabra: tocando "look" conviene ofrecer
   * también "look for" y "look after", porque significan otra cosa y es
   * exactamente donde se equivoca un hispanohablante. */
  function expresionesCon(palabra) {
    construir();
    const k = limpiar(palabra);
    return (compuestas[k] || []).map(function (t) {
      return { en: t.en, es: t.es, nota: t.nota || null };
    });
  }

  /* Cómo suena. No hay transcripción fonética por palabra —no la tenemos, e
   * inventarla sería peor que callarse— pero sí se pueden señalar los sonidos
   * de vocal que la aplicación enseña y que aparecen en la palabra, que es lo
   * que de verdad le cuesta a un hispanohablante. */
  function sonidosDe(palabra) {
    const k = limpiar(palabra);
    if (!k || !APP.datosSonidos) return [];
    const out = [];
    (APP.datosSonidos.SONIDOS || []).forEach(function (s) {
      const pega = (s.ejemplos || []).some(function (e) {
        const w = limpiar(typeof e === "string" ? e : e.en || e.palabra || "");
        return w === k;
      });
      if (pega) out.push({ id: s.id, simbolo: s.simbolo, comoSuena: s.comoSuena, trampa: s.trampa });
    });
    return out;
  }

  /* Trocea un texto en palabras y separadores, conservando todo. La pantalla
   * envuelve las palabras en algo que se puede tocar y deja el resto tal cual,
   * de modo que el texto se sigue leyendo igual. */
  function trocear(texto) {
    const piezas = [];
    const re = /[A-Za-z][A-Za-z'’]*/g;
    let ultimo = 0;
    let m;
    while ((m = re.exec(texto)) !== null) {
      if (m.index > ultimo) piezas.push({ palabra: false, texto: texto.slice(ultimo, m.index) });
      piezas.push({ palabra: true, texto: m[0] });
      ultimo = m.index + m[0].length;
    }
    if (ultimo < texto.length) piezas.push({ palabra: false, texto: texto.slice(ultimo) });
    return piezas;
  }

  /* Todo lo que se sabe de una palabra, de una vez: es lo que muestra la
   * ficha. 'encontrada' en false no es un error, es una respuesta: significa
   * "esta palabra no está en el curso", y se dice tal cual. */
  function ficha(palabra) {
    const base = buscar(palabra);
    return {
      palabra: palabra,
      encontrada: !!base,
      definicion: base,
      expresiones: expresionesCon(palabra),
      sonidos: sonidosDe(palabra),
    };
  }

  APP.diccionario = {
    buscar: buscar,
    buscarEs: buscarEs,
    buscarLibre: buscarLibre,
    ficha: ficha,
    trocear: trocear,
    expresionesCon: expresionesCon,
    sonidosDe: sonidosDe,
    limpiar: limpiar,
  };
})();

</script>
<script>
/* js/examen.js */
/* Los exámenes de nivel y la prueba de nivelación.
 *
 * Un examen no es una lección larga. Se diferencia en cuatro cosas, y las
 * cuatro son a propósito:
 *
 *   sin vidas          equivocarse no te echa; acá se mide, no se enseña
 *   sin corregir sobre la marcha   saber al instante si acertaste cambia cómo
 *                      contestas las siguientes, y entonces ya no se está
 *                      midiendo lo que sabes sino cómo te vas adaptando
 *   las cuatro destrezas  si fueran sólo alternativas se podría aprobar
 *                      adivinando, y reconocer una respuesta entre tres es
 *                      mucho más fácil que producirla
 *   se puede repetir   suspender no cierra nada, sólo dice qué falta
 *
 * Las preguntas salen del contenido del propio nivel, generadas de sus mismas
 * lecciones. Así el examen no puede preguntar algo que el nivel no enseñó, que
 * es la queja justa de cualquiera que reprueba un examen mal hecho.
 */
(function () {
  "use strict";

  const APP = window.APP;

  // Cuántas de cada destreza. Leer y escribir pesan más porque son la mitad
  // del idioma y porque son las que se pueden medir sin depender de que el
  // teléfono tenga micrófono.
  const RECETA = { leer: 8, escribir: 8, escuchar: 4, hablar: 4 };
  const PARA_APROBAR = 70;

  /* Ojo: acá van los tipos que produce el motor, que NO son los que declara
   * una lección. La lección pide "escribe-en" o "dictado"; el ejercicio que
   * sale de los dos lleva tipo "escribe". Mapear por el nombre declarado
   * dejaba fuera del examen todos los ejercicios de escribir sin dar ningún
   * error: el examen salía con cero preguntas escritas y nadie se enteraba.
   *
   * Y "escribe" es de dos destrezas según de dónde venga: escribir una
   * traducción entrena escribir; escribir lo que se oye entrena escuchar. Los
   * distingue 'autoAudio', que sólo lleva el dictado. */
  const DE_DESTREZA = {
    leer: ["elige-en", "elige-es", "pares", "hueco", "regla-elige", "lectura-pregunta"],
    escribir: ["arma", "escribe", "regla-escribe"],
    escuchar: ["escucha-elige"],
    hablar: ["habla"],
  };

  function destrezaDe(ej) {
    if (ej.tipo === "escribe") return ej.autoAudio ? "escuchar" : "escribir";
    for (const d in DE_DESTREZA) {
      if (DE_DESTREZA[d].indexOf(ej.tipo) >= 0) return d;
    }
    return null;
  }

  function revolver(lista) {
    const c = lista.slice();
    for (let i = c.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = c[i]; c[i] = c[j]; c[j] = t;
    }
    return c;
  }

  /* Se genera de golpe un montón de ejercicios de las lecciones del nivel y
   * después se reparten por destreza. Sale más barato y más variado que pedir
   * uno a uno de un tipo concreto, que obliga a reintentar cuando el tema que
   * tocó no admite ese tipo. */
  function cantera(nivelId) {
    const lecciones = revolver(APP.curriculo.leccionesDelNivel(nivelId));
    const pozo = { leer: [], escribir: [], escuchar: [], hablar: [] };
    const vistos = {};

    lecciones.forEach(function (l) {
      if (l.texto) return; // los textos se tratan aparte, enteros

      /* Se piden dos tandas: la lección tal cual, y otra forzando los tipos
       * que producen escribir y hablar. Sin la segunda, un nivel cuyas
       * lecciones son casi todas de reconocer no daría de dónde sacar
       * preguntas de producción, y el examen mediría medio idioma. */
      let pozoLocal = APP.motor.sesionLeccion(l);
      if (l.skills && l.skills.length) {
        pozoLocal = pozoLocal.concat(
          APP.motor.sesionLeccion({
            skills: l.skills,
            tipos: ["escribe-en", "arma-en", "arma-es", "habla", "dictado"],
            n: 6,
          })
        );
      }
      pozoLocal.forEach(function (e) {
        const d = destrezaDe(e);
        if (!d) return;
        const huella = e.tipo + "|" + (e.frase || e.respuesta || e.pregunta || JSON.stringify(e.opciones || ""));
        if (vistos[huella]) return;
        vistos[huella] = true;
        pozo[d].push(e);
      });
    });
    return pozo;
  }

  /* Un texto del nivel con sus preguntas: es la única forma honesta de medir
   * si se lee de corrido, que no es lo mismo que entender frases sueltas. */
  function trozoDeLectura(nivelId) {
    const conTexto = APP.curriculo.leccionesDelNivel(nivelId).filter(function (l) { return l.texto; });
    if (!conTexto.length) return [];
    const l = revolver(conTexto)[0];
    const s = APP.motor.sesionLeccion(l);
    // El texto y hasta tres preguntas suyas; más alargaría demasiado el examen.
    return s.slice(0, 4);
  }

  function armar(nivelId, opciones) {
    const op = opciones || {};
    const pozo = cantera(nivelId);
    const puede = {
      escuchar: op.sinVoz ? false : true,
      hablar: op.sinMicro ? false : true,
    };

    const receta = Object.assign({}, RECETA);
    /* Si el teléfono no tiene voz o micrófono, esas preguntas no se pueden
     * hacer. En vez de dejar el examen corto —lo que bajaría la nota de
     * cualquiera por un problema del aparato— se reparten entre leer y
     * escribir. */
    APP.curriculo.DESTREZAS.forEach(function (d) {
      if (puede[d] === false || !pozo[d].length) {
        const sobran = receta[d] || 0;
        receta[d] = 0;
        receta.leer += Math.ceil(sobran / 2);
        receta.escribir += Math.floor(sobran / 2);
      }
    });

    const preguntas = [];
    APP.curriculo.DESTREZAS.forEach(function (d) {
      revolver(pozo[d]).slice(0, receta[d]).forEach(function (e) {
        preguntas.push(Object.assign({}, e, { destreza: d }));
      });
    });

    const mezcladas = revolver(preguntas);
    // La lectura va al final y en bloque: el texto tiene que quedar pegado a
    // sus preguntas, y separarlos con otras cosas en medio sería absurdo.
    const lectura = trozoDeLectura(nivelId).map(function (e) {
      return Object.assign({}, e, { destreza: "leer" });
    });

    const todas = mezcladas.concat(lectura);
    return {
      nivel: nivelId,
      preguntas: todas,
      // El texto no se cuenta como pregunta: no se responde.
      total: todas.filter(function (p) { return p.tipo !== "lectura-texto"; }).length,
      paraAprobar: PARA_APROBAR,
    };
  }

  /* Corregir. Las respuestas llegan como un objeto {indice: acierto}, que es
   * lo que la pantalla ya sabe calcular con las mismas reglas de comparación
   * que usa una lección normal: así el examen no puede ser más estricto ni más
   * blando que la práctica. */
  function corregir(examen, aciertos) {
    const porDestreza = {};
    APP.curriculo.DESTREZAS.forEach(function (d) {
      porDestreza[d] = { bien: 0, de: 0 };
    });

    let bien = 0;
    let de = 0;
    examen.preguntas.forEach(function (p, i) {
      if (p.tipo === "lectura-texto") return;
      de++;
      const ok = !!aciertos[i];
      if (ok) bien++;
      const d = porDestreza[p.destreza];
      if (d) { d.de++; if (ok) d.bien++; }
    });

    const porcentaje = de ? Math.round((bien / de) * 100) : 0;
    const aprueba = porcentaje >= PARA_APROBAR;

    // La destreza más floja, para poder decir qué practicar. Sólo se miran las
    // que de verdad se preguntaron.
    let floja = null;
    APP.curriculo.DESTREZAS.forEach(function (d) {
      const x = porDestreza[d];
      if (!x.de) return;
      const tasa = x.bien / x.de;
      if (!floja || tasa < floja.tasa) floja = { destreza: d, tasa: tasa, bien: x.bien, de: x.de };
    });

    return {
      bien: bien,
      de: de,
      porcentaje: porcentaje,
      aprueba: aprueba,
      paraAprobar: PARA_APROBAR,
      porDestreza: porDestreza,
      floja: floja,
    };
  }

  function guardar(examen, resultado) {
    const n = APP.almacen.anotarExamen(examen.nivel, resultado.porcentaje, resultado.aprueba);
    if (resultado.aprueba) {
      const siguiente = nivelDespuesDe(examen.nivel);
      if (siguiente) APP.almacen.abrirNivel(siguiente);
    }
    return n;
  }

  function nivelDespuesDe(id) {
    const ns = APP.curriculo.NIVELES;
    for (let i = 0; i < ns.length - 1; i++) {
      if (ns[i].id === id) return ns[i + 1].id;
    }
    return null;
  }

  /* Un nivel está abierto si es el primero, si se aprobó el anterior, o si la
   * prueba de nivelación lo abrió. Nunca se cierra de vuelta. */
  function abierto(id) {
    const ns = APP.curriculo.NIVELES;
    if (ns.length && ns[0].id === id) return true;
    if (APP.almacen.nivelCurso(id).abierto) return true;
    for (let i = 1; i < ns.length; i++) {
      if (ns[i].id === id) return APP.almacen.nivelCurso(ns[i - 1].id).aprobado;
    }
    return false;
  }

  /* ---------------- La prueba de nivelación ----------------
   *
   * Quince preguntas que van de lo más fácil a lo más difícil. No es un examen:
   * no se aprueba ni se reprueba, sólo sirve para no hacerle empezar en "Hola"
   * a alguien que ya sabe presentarse. Aburrirse las tres primeras semanas es
   * la forma más común de abandonar un curso de idiomas.
   */
  function nivelacion() {
    const preguntas = [];
    APP.curriculo.NIVELES.forEach(function (n) {
      const pozo = cantera(n.id);
      // Cinco de cada nivel, de leer y escribir: se puede hacer en cualquier
      // teléfono y en cualquier sitio, sin depender del micrófono ni de estar
      // en un lugar donde se pueda hablar en voz alta.
      const mezcla = revolver(pozo.leer).slice(0, 3).concat(revolver(pozo.escribir).slice(0, 2));
      mezcla.forEach(function (e) {
        preguntas.push(Object.assign({}, e, { deNivel: n.id }));
      });
    });
    return { preguntas: preguntas, total: preguntas.length };
  }

  /* Dónde empezar. La regla es deliberadamente generosa por abajo: mandar a
   * alguien a un nivel que le queda grande lo deja perdido y sin saber por
   * qué, mientras que empezar un poco por debajo se arregla solo en dos días
   * saltando lecciones. */
  function recomendar(prueba, aciertos) {
    const porNivel = {};
    APP.curriculo.NIVELES.forEach(function (n) { porNivel[n.id] = { bien: 0, de: 0 }; });
    prueba.preguntas.forEach(function (p, i) {
      const x = porNivel[p.deNivel];
      if (!x) return;
      x.de++;
      if (aciertos[i]) x.bien++;
    });

    // Se sube de nivel sólo si el anterior sale claramente bien: 80%.
    let recomendado = APP.curriculo.NIVELES[0].id;
    for (let i = 0; i < APP.curriculo.NIVELES.length - 1; i++) {
      const id = APP.curriculo.NIVELES[i].id;
      const x = porNivel[id];
      if (x.de && x.bien / x.de >= 0.8) recomendado = APP.curriculo.NIVELES[i + 1].id;
      else break;
    }
    return { nivel: recomendado, porNivel: porNivel };
  }

  function aplicarNivelacion(rec) {
    // Se abren todos los niveles hasta el recomendado, sin darlos por
    // aprobados: el examen final sigue estando ahí para quien lo quiera.
    const ns = APP.curriculo.NIVELES;
    for (let i = 0; i < ns.length; i++) {
      APP.almacen.abrirNivel(ns[i].id);
      if (ns[i].id === rec.nivel) break;
    }
  }

  APP.examen = {
    PARA_APROBAR: PARA_APROBAR,
    armar: armar,
    corregir: corregir,
    guardar: guardar,
    abierto: abierto,
    nivelDespuesDe: nivelDespuesDe,
    nivelacion: nivelacion,
    recomendar: recomendar,
    aplicarNivelacion: aplicarNivelacion,
    destrezaDe: destrezaDe,
  };
})();

</script>
<script>
/* js/tutor.js */
/* Conversar en inglés con un tutor, hablando o escribiendo.
 *
 * Es lo único de la aplicación que necesita internet, cuesta dinero y puede
 * no estar configurado. Las tres cosas se manejan diciendo la verdad: si no
 * está disponible se explica por qué y cómo se arregla, en vez de mostrar un
 * botón que no hace nada.
 *
 * La clave de la API no está acá ni puede estarlo: vive en el servidor. Este
 * archivo sólo habla con /api/tutor, que es de la misma dirección, así que la
 * cookie de sesión viaja sola.
 *
 * La conversación se guarda en memoria y nada más. No va al servidor ni al
 * almacenamiento del teléfono: alguien practicando cuenta cosas de su trabajo
 * y de su vida, y eso no hay por qué archivarlo en ninguna parte.
 */
(function () {
  "use strict";

  const APP = window.APP;
  const RAIZ = "/api/tutor";
  const ESPERA = 60000;

  // Los primeros temas. Tener de qué hablar es la mitad del problema: delante
  // de un cuadro de texto vacío no se le ocurre nada a nadie.
  const ARRANQUES = [
    { emo: "☕", es: "Tu día de hoy", en: "Tell me about your day." },
    { emo: "💼", es: "Tu trabajo", en: "What do you do for work?" },
    { emo: "✈️", es: "Un viaje", en: "Tell me about a trip you took." },
    { emo: "🍽️", es: "Pedir en un restaurante", en: "Let's practise ordering food. I'm the waiter." },
    { emo: "📞", es: "Llamar a un proveedor", en: "Let's practise a call with a supplier. I'm the supplier." },
    { emo: "🗣️", es: "Lo que tú quieras", en: "" },
  ];

  let conversacion = [];

  function estado() {
    return pedir("GET", "/estado").catch(function () {
      // Sin internet no se puede saber; se dice eso y no "no configurado",
      // que mandaría a revisar Render por nada.
      return { disponible: false, motivo: "sin_internet" };
    });
  }

  function mandar(texto) {
    return pedir("POST", "/mensaje", {
      texto: texto,
      historia: conversacion.map(function (t) {
        return { papel: t.papel, texto: t.texto };
      }),
    });
  }

  function pedir(metodo, ruta, cuerpo) {
    const corta = new AbortController();
    const reloj = setTimeout(function () { corta.abort(); }, ESPERA);

    return fetch(RAIZ + ruta, {
      method: metodo,
      credentials: "same-origin",
      headers: cuerpo ? { "Content-Type": "application/json" } : {},
      body: cuerpo ? JSON.stringify(cuerpo) : undefined,
      signal: corta.signal,
    })
      .then(function (r) {
        clearTimeout(reloj);
        return r.json().then(function (d) {
          if (!r.ok) throw new Error(d.error || "Algo falló");
          return d;
        }).catch(function (e) {
          if (e instanceof Error && e.message !== "Algo falló") throw e;
          throw new Error("Algo falló");
        });
      })
      .catch(function (e) {
        clearTimeout(reloj);
        if (e.name === "AbortError") throw new Error("El tutor tardó demasiado.");
        throw e;
      });
  }

  function historial() { return conversacion.slice(); }
  function anotar(papel, texto, correccion) {
    conversacion.push({ papel: papel, texto: texto, correccion: correccion || null });
  }
  function reiniciar() { conversacion = []; }

  /* Si se puede dictar. No es lo mismo que tener micrófono para los ejercicios:
   * acá hace falta reconocimiento de voz del navegador, que Firefox no trae. */
  function sePuedeDictar() {
    return APP.audio.hayMicrofono();
  }

  APP.tutor = {
    ARRANQUES: ARRANQUES,
    estado: estado,
    mandar: mandar,
    historial: historial,
    anotar: anotar,
    reiniciar: reiniciar,
    sePuedeDictar: sePuedeDictar,
  };
})();

</script>
<script>
/* js/cuenta.js */
/* La cuenta: tu avance guardado fuera del teléfono.
 *
 * La regla de la que cuelga todo el diseño: **la cuenta es opcional y viene
 * después**. La aplicación funciona entera sin haber entrado nunca, sin
 * internet y sin registrarse; el progreso vive en el teléfono igual que
 * siempre. Entrar sólo agrega una copia en el servidor.
 *
 * Eso tiene dos consecuencias concretas:
 *
 *  - Registrarse no borra lo que ya practicaste. Al entrar por primera vez, lo
 *    que hay en el teléfono se junta con lo que haya en la cuenta, en vez de
 *    que uno pise al otro.
 *  - Quedarse sin señal no rompe nada. Si el servidor no contesta, se sigue
 *    practicando con lo local y se sube en la próxima sincronización.
 *
 * El servidor guarda el documento entero y no lo entiende. Juntar dos avances
 * sin perder nada lo hace fusionarProgreso() en almacen.js, que ya existía para
 * los ratos sin conexión y está probado.
 */
(function () {
  "use strict";

  const A = function () { return APP.almacen; };

  // La API vive en el mismo sitio que la aplicación, así que basta una ruta
  // relativa: no hay dirección que configurar ni CORS que pelear.
  const RAIZ = "/api";
  const ESPERA = 20000; // el plan gratuito de Render duerme y tarda en despertar

  let sesion = { conectado: false, email: null, comprobada: false, respondio: false };
  let sincronizando = false;
  let ultimoIntento = 0;

  function ajustes() {
    return A().estado().ajustes;
  }

  function pedir(ruta, opciones) {
    const o = opciones || {};
    const control = new AbortController();
    const reloj = setTimeout(function () { control.abort(); }, o.espera || ESPERA);

    return fetch(RAIZ + ruta, {
      method: o.metodo || "GET",
      // Sin esto la cookie de sesión no viaja y el servidor no sabe quién eres.
      credentials: "same-origin",
      headers: o.cuerpo ? { "Content-Type": "application/json" } : {},
      body: o.cuerpo ? (typeof o.cuerpo === "string" ? o.cuerpo : JSON.stringify(o.cuerpo)) : undefined,
      signal: control.signal,
    }).then(
      function (r) { clearTimeout(reloj); return r; },
      function (e) {
        clearTimeout(reloj);
        throw new Error(e && e.name === "AbortError"
          ? "El servidor no respondió a tiempo"
          : "No se pudo conectar");
      }
    );
  }

  function leerError(r) {
    return r.json().then(
      function (d) { return new Error((d && d.error) || "Algo falló"); },
      function () { return new Error("Algo falló en el servidor"); }
    );
  }

  /* ---------------- Sesión ---------------- */

  function comprobarSesion() {
    return pedir("/yo")
      .then(function (r) { return r.ok ? r.json() : { conectado: false }; })
      .then(function (d) {
        sesion = {
          conectado: !!d.conectado, email: d.email || null,
          comprobada: true, respondio: true,
        };
        if (sesion.conectado && sesion.email) {
          ajustes().entroComo = sesion.email;
          ajustes().aparatoAbierto = true;
          A().guardar();
        }
        return sesion;
      })
      .catch(function () {
        /* Sin conexión no se sabe. Se marca 'respondio: false' porque la
         * diferencia importa: que el servidor diga "no hay sesión" es motivo
         * para pedir la clave, pero que no conteste no lo es — si no, quedarse
         * sin señal te dejaría fuera de tu propia aplicación. */
        sesion.comprobada = true;
        sesion.respondio = false;
        return sesion;
      });
  }

  function registrar(email, clave) {
    return pedir("/registro", { metodo: "POST", cuerpo: { email: email, clave: clave } })
      .then(function (r) {
        if (!r.ok) return leerError(r).then(function (e) { throw e; });
        return r.json();
      })
      .then(function (d) {
        sesion = { conectado: true, email: d.email, comprobada: true, respondio: true };
        ajustes().entroComo = d.email;
        ajustes().aparatoAbierto = true;
        A().guardar();
        // Recién creada la cuenta, lo primero es subir lo que ya se practicó.
        return sincronizar().then(function () { return sesion; });
      });
  }

  function entrar(email, clave) {
    return pedir("/entrar", { metodo: "POST", cuerpo: { email: email, clave: clave } })
      .then(function (r) {
        if (!r.ok) return leerError(r).then(function (e) { throw e; });
        return r.json();
      })
      .then(function (d) {
        sesion = { conectado: true, email: d.email, comprobada: true, respondio: true };
        ajustes().entroComo = d.email;
        ajustes().aparatoAbierto = true;
        A().guardar();
        return sincronizar().then(function () { return sesion; });
      });
  }

  function salir() {
    /* Salir deja el progreso en el teléfono tal como está. No se borra: la
     * persona sigue pudiendo practicar, y si vuelve a entrar se junta todo. */
    return pedir("/salir", { metodo: "POST" })
      .catch(function () { /* si el servidor no contesta, se sale igual */ })
      .then(function () {
        sesion = { conectado: false, email: null, comprobada: true, respondio: true };
        ajustes().ultimaSync = 0;
        // Salir cierra la puerta: en este aparato habrá que volver a entrar.
        // El correo se deja escrito, que no es ningún secreto y ahorra tener
        // que teclearlo otra vez.
        ajustes().aparatoAbierto = false;
        A().guardar();
        return sesion;
      });
  }

  function cambiarClave(actual, nueva) {
    return pedir("/cambiar-clave", { metodo: "POST", cuerpo: { actual: actual, nueva: nueva } })
      .then(function (r) {
        if (!r.ok) return leerError(r).then(function (e) { throw e; });
        return true;
      });
  }

  function borrarCuenta(clave) {
    return pedir("/borrar-cuenta", { metodo: "POST", cuerpo: { clave: clave } })
      .then(function (r) {
        if (!r.ok) return leerError(r).then(function (e) { throw e; });
        sesion = { conectado: false, email: null, comprobada: true };
        return true;
      });
  }

  /* ---------------- Sincronizar ---------------- */

  function sincronizar() {
    if (!sesion.conectado) return Promise.resolve({ ok: false, motivo: "sin-cuenta" });
    if (sincronizando) return Promise.resolve({ ok: false, motivo: "en-curso" });
    sincronizando = true;
    ultimoIntento = Date.now();

    return pedir("/progreso")
      .then(function (r) {
        if (r.status === 401) {
          // La sesión caducó; se avisa en vez de fallar en silencio.
          sesion = { conectado: false, email: null, comprobada: true };
          throw new Error("Tu sesión caducó. Vuelve a entrar.");
        }
        if (!r.ok) return leerError(r).then(function (e) { throw e; });
        return r.json();
      })
      .then(function (remoto) {
        // {"vacio": true} es una cuenta recién creada: no hay nada que juntar.
        const otro = remoto && remoto.vacio ? null : remoto;
        A().reemplazarEstado(A().fusionarProgreso(A().estado(), otro));
        return pedir("/progreso", { metodo: "PUT", cuerpo: JSON.stringify(A().estado()) });
      })
      .then(function (r) {
        if (!r.ok) return leerError(r).then(function (e) { throw e; });
        ajustes().ultimaSync = Date.now();
        ajustes().ultimoErrorSync = "";
        A().guardar();
        return { ok: true };
      })
      .catch(function (e) {
        ajustes().ultimoErrorSync = e.message;
        A().guardar();
        return { ok: false, motivo: e.message };
      })
      .then(function (resultado) {
        sincronizando = false;
        return resultado;
      });
  }

  function sincronizarSiCorresponde(minimoMinutos) {
    /* Sincronización automática con freno: al abrir, al volver a la aplicación
     * y al terminar una lección. Sin el freno, cambiar de pestaña diez veces
     * dispararía diez sincronizaciones. */
    if (!sesion.conectado) return Promise.resolve({ ok: false, motivo: "sin-cuenta" });
    const minimo = (minimoMinutos === undefined ? 2 : minimoMinutos) * 60000;
    if (Date.now() - ultimoIntento < minimo) return Promise.resolve({ ok: false, motivo: "reciente" });
    return sincronizar();
  }

  function arrancar() {
    /* Al abrir: se pregunta quién está conectado y, si hay cuenta, se baja lo
     * que haya en el servidor antes de dibujar los números. */
    return comprobarSesion().then(function (s) {
      if (!s.conectado) return { ok: false, motivo: "sin-cuenta" };
      return sincronizar();
    });
  }

  function estado() {
    const a = ajustes();
    return {
      conectado: sesion.conectado,
      email: sesion.email,
      comprobada: sesion.comprobada,
      respondio: sesion.respondio,
      // Lo último que se supo en este aparato, aunque ahora no haya señal.
      entroComo: a.entroComo || "",
      aparatoAbierto: !!a.aparatoAbierto,
      sincronizando: sincronizando,
      ultima: a.ultimaSync || 0,
      ultimoError: a.ultimoErrorSync || "",
    };
  }

  window.APP = window.APP || {};
  APP.cuenta = {
    estado: estado,
    arrancar: arrancar,
    registrar: registrar,
    entrar: entrar,
    salir: salir,
    cambiarClave: cambiarClave,
    borrarCuenta: borrarCuenta,
    sincronizar: sincronizar,
    sincronizarSiCorresponde: sincronizarSiCorresponde,
  };
})();

</script>
<script>
/* js/leccion.js */
/* La pantalla de ejercicios: donde de verdad se aprende.
 *
 * Una sesión es una lista de ejercicios ya armados por el motor. Acá sólo se
 * dibujan, se corrigen y se anota el resultado; el motor decide qué preguntar
 * y el repaso espaciado decide cuándo volver a preguntarlo.
 *
 * Tres decisiones que se apartan de Duolingo, a propósito:
 *  - lo que se falla vuelve a preguntarse al final de la misma sesión, no
 *    "algún día": el error se corrige mientras todavía se recuerda;
 *  - la corrección siempre dice por qué, no sólo qué era lo correcto;
 *  - quedarse sin vidas nunca deja a la persona sin poder practicar.
 */
(function () {
  "use strict";

  const d = APP.dom;
  let S = null;
  let raiz = null;

  /* Acá vivían el contrarreloj, las vidas, los puntos y la racha de aciertos.
   * Se quitaron enteros, no se escondieron: una capa de juego no es neutra.
   * El contrarreloj premia contestar rápido, y contestar rápido en un idioma
   * que estás aprendiendo significa contestar con lo que ya sabías; las vidas
   * meten urgencia, y la urgencia empuja a adivinar en vez de pensar. */

  function iniciar(op) {
    /* Si ya hay una lección abierta, se cierra antes. Sin esto, dos toques
     * rápidos en el mismo botón —o empezar un examen sin haber salido de lo
     * anterior— apilan dos capas: la de arriba funciona, la de abajo queda
     * viva debajo, y al cerrar la primera aparece la vieja como si nada. */
    if (raiz && raiz.parentNode) cerrar();

    S = {
      ejercicios: op.ejercicios.slice(),
      titulo: op.titulo || "Práctica",
      modo: op.modo || "practica",
      leccionId: op.leccionId || null,
      corazones: op.corazones !== false && ajuste("corazones") !== false,
      alTerminar: op.alTerminar || function () {},
      alRepetir: op.alRepetir || null,
      i: 0,
      total: op.ejercicios.length,
      aciertos: 0,
      fallos: 0,
      inicio: Date.now(),
      reintentos: [],
      respuesta: null,
      corregido: null,
      falladosIds: [],
      /* En modo examen se guarda qué se acertó y qué no, pero no se enseña
       * hasta el final. Saber al instante si acertaste cambia cómo contestas
       * las siguientes —te confías o te bloqueas— y entonces ya no se está
       * midiendo lo que sabes. */
      examen: op.examen || null,
      aciertosExamen: {},
      /* Qué etapas ya se anunciaron. Una sola vez cada una: en la segunda
       * vuelta —la de lo fallado— los ejercicios vienen mezclados de todas las
       * etapas, y anunciarlas otra vez llenaba la lección de carteles
       * repitiendo "Reconocer, Escribir, Reconocer…" cada dos preguntas. */
      etapasVistas: {},
      etapaAnunciada: null,
      segundaVuelta: false,
    };

    if (!S.ejercicios.length) {
      d.avisar("Nada que practicar", "Avanza un poco en el camino y vuelve: el repaso se llena solo.");
      return;
    }

    raiz = document.createElement("div");
    raiz.className = "leccion";
    raiz.id = "leccion";
    document.body.appendChild(raiz);
    document.body.style.overflow = "hidden";
    engancharEventos();
    pintar();
  }

  function ajuste(k) {
    return APP.almacen.estado().ajustes[k];
  }

  function cerrar() {
    APP.audio.callar();
    APP.audio.detenerEscucha();
    if (raiz && raiz.parentNode) raiz.parentNode.removeChild(raiz);
    document.body.style.overflow = "";
    raiz = null;
    S = null;
  }

  function actual() {
    return S.ejercicios[S.i];
  }

  /* ---------------- Dibujo ---------------- */

  /* Anuncia la etapa al entrar en ella.
   *
   * Una lección no es una tanda de ejercicios mezclados: es una secuencia que
   * pide cada vez un poco más sobre el mismo material. Ver → reconocer →
   * escribir → escuchar → decir. Anunciarlo cambia cómo se afronta lo que
   * viene: "ahora sin opciones" prepara para escribir, y sin ese aviso el
   * primer ejercicio de escribir se siente como un salto injusto.
   */
  function anuncioEtapa(ej) {
    const def = (APP.motor.ETAPAS || []).filter(function (e) { return e.id === ej.etapa; })[0];
    if (!def) return "";
    const cuantos = S.ejercicios.filter(function (x) { return x.etapa === ej.etapa; }).length;
    const idx = (APP.motor.ETAPAS || []).map(function (e) { return e.id; }).indexOf(ej.etapa);

    return (
      '<div class="leccion-caja"><div class="leccion-cuerpo anuncio">' +
      '<div class="pasos">' +
      (APP.motor.ETAPAS || []).map(function (e, i) {
        const hay = S.ejercicios.some(function (x) { return x.etapa === e.id; });
        if (!hay) return "";
        return '<span class="paso-punto' + (i < idx ? " hecho" : i === idx ? " ahora" : "") + '">' +
          d.esc(e.nombre) + "</span>";
      }).join("") +
      "</div>" +
      "<h1>" + d.esc(def.nombre) + "</h1>" +
      '<p class="apagado">' + d.esc(def.sub) + "</p>" +
      '<p class="mini apagado">' + cuantos + (cuantos === 1 ? " ejercicio" : " ejercicios") + "</p>" +
      "</div>" +
      '<div class="pie"><button class="btn" data-accion="etapa-seguir">Vamos</button></div></div>'
    );
  }

  function pintar() {
    const ej = actual();
    const avance = Math.round((S.i / S.total) * 100);

    // En un examen no se anuncian etapas: ahí se mide, y la estructura de la
    // práctica no viene al caso.
    if (!S.examen && !S.segundaVuelta && ej.etapa && !S.etapasVistas[ej.etapa]) {
      raiz.innerHTML = anuncioEtapa(ej);
      return;
    }
    if (ej.etapa) S.etapaAnunciada = ej.etapa;

    raiz.innerHTML =
      '<div class="leccion-caja">' +
      cabecera(avance) +
      '<div class="leccion-cuerpo" id="cuerpo">' + cuerpo(ej) + "</div>" +
      '<div id="pie"></div>' +
      "</div>";
    pintarPie();
    if (ej.autoAudio && ej.audio) setTimeout(function () { decir(ej.audio); }, 350);
    // Sin foco automático: abre el teclado y tapa media pantalla. Se deja que
    // lo abra ella cuando quiera escribir.
  }

  function cabecera(avance) {
    /* La barra dice dónde vas y nada más. Antes llevaba corazones y un contador
     * de puntos: dos cosas que no son inglés compitiendo por la atención con
     * el ejercicio, que sí lo es. */
    return (
      '<div class="barra">' +
      '<button class="icono-btn" data-accion="salir" aria-label="Salir">✕</button>' +
      '<div class="barra-prog"><i style="width:' + avance + '%"></i></div>' +
      '<span class="contador paso">' + Math.min(S.i + 1, S.total) + "/" + S.total + "</span>" +
      "</div>" +
      (S.etapaAnunciada && !S.examen
        ? '<div class="etapa-actual">' + d.esc(nombreEtapa(S.etapaAnunciada)) + "</div>"
        : "")
    );
  }

  function nombreEtapa(id) {
    const e = (APP.motor.ETAPAS || []).filter(function (x) { return x.id === id; })[0];
    return e ? e.nombre : "";
  }

  function cuerpo(ej) {
    switch (ej.tipo) {
      case "elige-en":
      case "elige-es":
        return elegir(ej);
      case "escucha-elige":
        return escuchaElige(ej);
      case "arma":
        return armar(ej);
      case "escribe":
        return escribir(ej);
      case "habla":
        return hablar(ej);
      case "hueco":
        return hueco(ej);
      case "pares":
        return pares(ej);
      case "regla-elige":
        return reglaElige(ej);
      case "regla-escribe":
        return reglaEscribe(ej);
      case "lectura-texto":
        return lecturaTexto(ej);
      case "lectura-pregunta":
        return lecturaPregunta(ej);
      default:
        return "<p>Ejercicio desconocido.</p>";
    }
  }

  function bloquePrompt(ej) {
    let out = "";
    if (ej.promptHex) out += '<div class="muestra-color" style="background:' + d.esc(ej.promptHex) + '"></div>';
    else if (ej.promptIcon) out += '<div class="emoji-grande">' + d.esc(ej.promptIcon) + "</div>";
    if (ej.prompt) {
      out += '<div class="prompt-grande">' + marcar(ej.prompt, ej.promptEn) + "</div>";
      if (ej.audio) out += botonAudio(ej.audio, "Escuchar");
    }
    return out;
  }

  function claseOpcion(ej, o, i) {
    /* Después de comprobar, cada opción se pinta: verde la correcta, roja la
     * que eligió si estaba mal. Sin esto la corrección dice "casi" pero no
     * muestra dónde estuvo el error, que es la mitad de lo que enseña. */
    if (!S.corregido) return S.respuesta === i ? " elegida" : "";
    if (o.correcta) return " buena";
    if (S.respuesta === i) return " mala";
    return " tachada";
  }

  function botonAudio(texto, etiqueta, grande) {
    return (
      '<button class="btn azul ' + (grande ? "" : "chico") + '" data-accion="audio" data-texto="' +
      d.esc(texto) + '">🔊 ' + d.esc(etiqueta || "Escuchar") + "</button>"
    );
  }

  function elegir(ej) {
    return (
      '<div class="enunciado">' + d.esc(ej.enunciado) + "</div>" +
      bloquePrompt(ej) +
      '<div class="opciones" style="margin-top:16px">' +
      ej.opciones.map(function (o, i) {
        return (
          '<button class="opcion' + claseOpcion(ej, o, i) + '" data-accion="opcion" data-i="' + i + '">' +
          (o.icon ? '<span class="emo">' + d.esc(o.icon) + "</span>" : "") +
          "<span>" + marcar(o.texto, ej.opcionesEn) + "</span></button>"
        );
      }).join("") +
      "</div>"
    );
  }

  function escuchaElige(ej) {
    return (
      '<div class="enunciado">' + d.esc(ej.enunciado) + "</div>" +
      '<div class="centro" style="margin:18px 0 22px">' +
      '<button class="micro" data-accion="audio" data-texto="' + d.esc(ej.audio) + '" aria-label="Escuchar">🔊</button>' +
      '<div><button class="btn hueco chico" data-accion="audio-lento" data-texto="' + d.esc(ej.audio) + '">🐢 Más lento</button></div>' +
      "</div>" +
      '<div class="opciones">' +
      ej.opciones.map(function (o, i) {
        return (
          '<button class="opcion' + claseOpcion(ej, o, i) + '" data-accion="opcion" data-i="' + i + '">' +
          "<span>" + marcar(o.texto, ej.opcionesEn) + "</span>" +
          (o.simbolo ? '<span class="ipa">/' + d.esc(o.simbolo) + "/</span>" : "") +
          "</button>"
        );
      }).join("") +
      "</div>"
    );
  }

  function armar(ej) {
    const puestas = S.respuesta || [];
    return (
      '<div class="enunciado">' + d.esc(ej.enunciado) + "</div>" +
      (ej.audio ? '<div style="margin-bottom:10px">' + botonAudio(ej.audio) + "</div>" : "") +
      '<div class="tarjeta plana"><div class="fuerte">' + marcar(ej.prompt, ej.promptEn) + "</div></div>" +
      '<div class="renglon" id="renglon">' +
      puestas.map(function (p, i) {
        return '<button class="ficha" data-accion="quitar" data-i="' + i + '">' + d.esc(p.texto) + "</button>";
      }).join("") +
      "</div>" +
      '<div class="banco">' +
      ej.fichas.map(function (f, i) {
        const usada = puestas.some(function (p) { return p.origen === i; });
        return (
          '<button class="ficha' + (usada ? " fantasma" : "") + '" data-accion="poner" data-i="' + i + '"' +
          (usada ? " disabled" : "") + ">" + d.esc(f) + "</button>"
        );
      }).join("") +
      "</div>"
    );
  }

  function escribir(ej) {
    const sinTeclado = ajuste("teclado") === false;
    return (
      '<div class="enunciado">' + d.esc(ej.enunciado) + "</div>" +
      (ej.audio
        ? '<div class="centro" style="margin:6px 0 16px"><button class="micro" data-accion="audio" data-texto="' +
          d.esc(ej.audio) + '" aria-label="Escuchar">🔊</button>' +
          '<div><button class="btn hueco chico" data-accion="audio-lento" data-texto="' + d.esc(ej.audio) + '">🐢 Más lento</button></div></div>'
        : bloquePrompt(ej)) +
      // Al corregir se deja lo que escribió, en gris y sin poder editarlo:
      // comparar su respuesta con la correcta es la mitad de la corrección, y
      // si el campo se vacía no queda con qué compararla.
      '<textarea class="campo" id="campo" rows="3" autocapitalize="none" autocorrect="off" spellcheck="false" ' +
      (S.corregido ? "readonly " : "") + 'placeholder="Escribe acá…">' +
      (S.corregido ? d.esc(S.respuesta || "") : "") + "</textarea>" +
      (sinTeclado
        ? '<div class="aviso ojo mini">Tienes el teclado desactivado en Ajustes; estos ejercicios igual necesitan escribir.</div>'
        : "") +
      // Una vez corregido ya no hay nada que rendirse: el botón sólo confundiría.
      (S.corregido
        ? ""
        : '<button class="btn hueco chico" style="margin-top:10px" data-accion="rendirse">No me acuerdo, muéstramelo</button>')
    );
  }

  function hablar(ej) {
    const grabando = S.respuesta && S.respuesta.grabando;
    return (
      '<div class="enunciado">' + d.esc(ej.enunciado) + "</div>" +
      '<div class="tarjeta"><div class="prompt-grande" style="font-size:22px">' +
      marcar(ej.prompt, ej.promptEn) + "</div>" +
      '<div class="apagado chico">' + d.esc(ej.traduccion || "") + "</div>" +
      '<div style="margin-top:10px">' + botonAudio(ej.audio) + "</div></div>" +
      '<div class="centro">' +
      '<button class="micro' + (grabando ? " grabando" : "") + '" data-accion="micro" aria-label="Grabar">🎤</button>' +
      '<div class="apagado chico">' + (grabando ? "Escuchando… habla ahora" : "Toca y di la frase") + "</div>" +
      (S.respuesta && S.respuesta.texto
        ? '<div class="tarjeta plana" style="margin-top:14px;text-align:left">Escuché: <span class="fuerte">' +
          d.esc(S.respuesta.texto) + "</span></div>"
        : "") +
      "</div>" +
      (S.corregido
        ? ""
        : '<button class="btn hueco chico" style="margin-top:14px" data-accion="saltar-habla">' +
          (S.examen ? "Saltar (cuenta como fallada)" : "Ahora no puedo hablar") + "</button>")
    );
  }

  function hueco(ej) {
    const partes = ej.oracion.split("___");
    return (
      '<div class="enunciado">' + d.esc(ej.enunciado) + "</div>" +
      '<div class="tarjeta"><div class="prompt-grande" style="font-size:22px">' +
      marcar(partes[0], ej.oracionEn) + '<span style="color:var(--azul)">_____</span>' +
      marcar(partes[1] || "", ej.oracionEn) +
      "</div></div>" +
      '<div class="opciones">' +
      ej.opciones.map(function (o, i) {
        return '<button class="opcion' + claseOpcion(ej, o, i) + '" data-accion="opcion" data-i="' + i + '"><span>' +
          marcar(o.texto, ej.opcionesEn) + "</span></button>";
      }).join("") +
      "</div>"
    );
  }

  function pares(ej) {
    const est = S.respuesta || { unidas: {}, sel: null, error: null };
    function col(lista, lado) {
      return lista.map(function (x, i) {
        const resuelta = est.unidas[x.id];
        const sel = est.sel && est.sel.lado === lado && est.sel.i === i;
        const err = est.error && est.error.lado === lado && est.error.i === i;
        return (
          '<button class="par' + (resuelta ? " resuelta unida" : "") + (sel ? " elegida" : "") +
          (err ? " error" : "") + '" data-accion="par" data-lado="' + lado + '" data-i="' + i + '">' +
          d.esc(x.texto) + "</button>"
        );
      }).join("");
    }
    return (
      '<div class="enunciado">' + d.esc(ej.enunciado) + "</div>" +
      '<div class="pares"><div style="display:grid;gap:10px">' + col(ej.izquierda, "en") + "</div>" +
      '<div style="display:grid;gap:10px">' + col(ej.derecha, "es") + "</div></div>"
    );
  }

  /* ---------------- Pie: comprobar y corregir ---------------- */

  /* ---------------- Reglas ----------------
   *
   * La frase se parte por el hueco y el hueco se dibuja como tal. Ver dónde
   * falta la palabra —y no un enunciado que la describe— es lo que convierte
   * el ejercicio en algo que se contesta sin leer dos veces. */
  function huecoPartido(ej, relleno) {
    const trozos = String(ej.frase).split("___");
    let out = "";
    trozos.forEach(function (t, i) {
      out += d.esc(t);
      if (i < trozos.length - 1) {
        out += '<span class="hueco-regla">' + (relleno ? d.esc(relleno) : "&nbsp;&nbsp;&nbsp;&nbsp;") + "</span>";
      }
    });
    return out;
  }

  /* Una frase que es sólo el hueco —"___" o "___ …"— no es una frase: es una
   * pregunta suelta, como "¿cómo se dice 'el auto'?". Dibujarla igual dejaba
   * una raya azul flotando sin nada alrededor y la pregunta de verdad en letra
   * chica debajo, que es justo al revés de lo que hay que leer primero. */
  function sinContexto(ej) {
    return String(ej.frase).replace(/_{3}/g, "").replace(/[\s…·.]/g, "") === "";
  }

  function cabeceraRegla(ej) {
    if (sinContexto(ej)) {
      return (
        '<div class="enunciado">' + d.esc(ej.tituloRegla) + "</div>" +
        '<div class="prompt-grande">' + d.esc(ej.es) + "</div>"
      );
    }
    return (
      '<div class="enunciado">' + d.esc(ej.tituloRegla) + "</div>" +
      '<div class="frase-regla">' + huecoPartido(ej) + "</div>" +
      (ej.es ? '<div class="mini apagado centro">' + d.esc(ej.es) + "</div>" : "")
    );
  }

  function reglaElige(ej) {
    return (
      cabeceraRegla(ej) +
      '<div class="opciones" style="margin-top:18px">' +
      ej.opciones.map(function (o, i) {
        let clase = "";
        if (!S.corregido) clase = S.respuesta === i ? " elegida" : "";
        else if (o === ej.ok) clase = " buena";
        else if (S.respuesta === i) clase = " mala";
        else clase = " tachada";
        return (
          '<button class="opcion' + clase + '" data-accion="opcion" data-i="' + i + '">' +
          "<span>" + d.esc(o) + "</span></button>"
        );
      }).join("") +
      "</div>"
    );
  }

  function reglaEscribe(ej) {
    return (
      cabeceraRegla(ej) +
      '<input class="campo" id="campo" type="text" autocomplete="off" autocapitalize="off" ' +
      'autocorrect="off" spellcheck="false" placeholder="Escribe lo que falta" ' +
      (S.corregido ? "disabled" : "") + ' value="' + d.esc(S.respuesta || "") + '">' +
      '<div class="mini apagado centro" style="margin-top:10px">Sólo la palabra que va en el hueco.</div>'
    );
  }

  /* ---------------- Lectura ---------------- */

  function lecturaTexto(ej) {
    /* El texto se entrega entero y sin preguntas: se lee primero. Cada palabra
     * queda tocable, que es lo que permite seguir leyendo en vez de abandonar
     * en la primera que no se entiende. */
    const parrafos = String(ej.cuerpo).split(/\n\n+/).map(function (p) {
      return "<p>" + tocables(p) + "</p>";
    }).join("");

    return (
      '<div class="enunciado">' + d.esc(ej.emo || "📖") + " " + d.esc(ej.titulo) + "</div>" +
      '<div class="lectura">' + parrafos + "</div>" +
      (ej.glosario && ej.glosario.length
        ? '<div class="glosario"><div class="mini apagado">Palabras que quizá no conozcas</div>' +
          ej.glosario.map(function (g) {
            return '<div class="glosa"><b>' + d.esc(g.en) + "</b> · " + d.esc(g.es) + "</div>";
          }).join("") + "</div>"
        : "") +
      '<div class="mini apagado centro" style="margin-top:14px">' +
      "Toca cualquier palabra para ver qué significa.</div>"
    );
  }

  function lecturaPregunta(ej) {
    // Sólo se hace tocable el inglés. Una pregunta en español no tiene nada
    // que consultar, y ofrecerlo sólo produce "no está en el curso".
    const marcar = ej.idioma === "es" ? d.esc : tocables;
    return (
      '<div class="enunciado">' + marcar(ej.pregunta) + "</div>" +
      '<div class="opciones" style="margin-top:16px">' +
      ej.opciones.map(function (o, i) {
        let clase = "";
        if (!S.corregido) clase = S.respuesta === i ? " elegida" : "";
        else if (o === ej.ok) clase = " buena";
        else if (S.respuesta === i) clase = " mala";
        else clase = " tachada";
        return (
          '<button class="opcion izq' + clase + '" data-accion="opcion" data-i="' + i + '">' +
          "<span>" + marcar(o) + "</span></button>"
        );
      }).join("") +
      "</div>"
    );
  }

  /* Envuelve cada palabra inglesa en algo que se puede tocar. El texto se
   * conserva exactamente: los separadores van tal cual, así que lo que se lee
   * es lo que se escribió. */
  /* Pinta un texto haciendo tocable cada palabra, o tal cual si está en
   * español. Se usa en todas partes: enunciados, opciones, fichas.
   *
   * Es la diferencia entre poder contestar y no poder. Una pregunta con una
   * palabra que no conoces no se contesta: se adivina, y adivinar no enseña.
   * Y el diccionario existía pero sólo funcionaba en los textos de lectura,
   * que es donde menos falta hace, porque ahí sí hay glosario. */
  function marcar(texto, enIngles) {
    return enIngles ? tocables(texto) : d.esc(texto);
  }

  function tocables(texto) {
    if (!APP.diccionario) return d.esc(texto);
    return APP.diccionario.trocear(texto).map(function (p) {
      if (!p.palabra) return d.esc(p.texto);
      return '<span class="tocable" data-accion="palabra" data-palabra="' + d.esc(p.texto) + '">' +
        d.esc(p.texto) + "</span>";
    }).join("");
  }

  function pintarPie() {
    const pie = d.$("#pie", raiz);
    if (!pie) return;
    const ej = actual();

    if (ej.tipo === "pares") {
      pie.innerHTML = '<div class="pie"><div class="apagado chico centro">Une las cinco parejas para seguir</div></div>';
      return;
    }

    if (S.corregido) {
      const c = S.corregido;
      pie.className = "";
      pie.innerHTML =
        /* Reconocer que no se sabe no merece el "Casi": no es un fallo, es haber
         * pedido que te lo enseñen, que es lo que hay que hacer cuando no se
         * sabe algo. */
        '<div class="pie ' + (c.correcto ? "bien" : c.rendida ? "neutro" : "mal") + ' entrada-animada">' +
        '<div class="pie-titulo">' +
        '<span class="marca">' + (c.correcto ? "✓" : c.rendida ? "→" : "✗") + "</span>" +
        "<span>" + (c.correcto ? "Correcto" : c.rendida ? "Ahora ya la sabes" : "No es ésa") + "</span></div>" +
        (c.detalle ? '<div class="detalle">' + c.detalle + "</div>" : "") +
        '<button class="btn ' + (c.correcto ? "" : c.rendida ? "azul" : "rojo") + '" data-accion="continuar">Continuar</button>' +
        "</div>";
      return;
    }

    const listo = hayRespuesta(ej);
    /* El botón dice lo que va a pasar. En un texto de lectura no hay nada que
     * comprobar —se lee y se sigue— y en un examen no se corrige hasta el
     * final, así que "Comprobar" prometería una corrección que no llega. */
    const etiqueta = ej.tipo === "lectura-texto"
      ? "Ya lo leí"
      : S.examen
        ? (S.i === S.ejercicios.length - 1 ? "Terminar el examen" : "Siguiente")
        : "Comprobar";
    /* "No la sé" al lado de comprobar.
     *
     * Sin esta salida, una pregunta que no se entiende obliga a adivinar, y
     * adivinar no enseña nada: si aciertas por suerte la aplicación cree que
     * lo sabes y no te la vuelve a preguntar. Decir "no la sé" da mejor
     * información que un acierto con un 25% de probabilidad.
     *
     * No cuesta vida a propósito. Si costara, saldría más barato adivinar, y
     * entonces el botón no lo usaría nadie.
     */
    const puedeRendirse = ej.tipo !== "lectura-texto" && ej.tipo !== "pares" && ej.tipo !== "habla";

    pie.innerHTML =
      '<div class="pie">' +
      '<button class="btn" data-accion="comprobar"' + (listo ? "" : " disabled") + ">" +
      etiqueta + "</button>" +
      '<div class="pie-secundarios">' +
      (puedeRendirse
        ? '<button class="btn hueco chico" data-accion="no-se">No la sé, muéstrame</button>'
        : "") +
      // Preguntar sin salir del ejercicio. Las dudas llegan justo acá, y si hay
      // que salir a buscarlas a otra pantalla, no se preguntan.
      (S.examen ? "" : '<button class="btn hueco chico" data-accion="preguntar">💬 Tengo una duda</button>') +
      "</div></div>";
  }

  function hayRespuesta(ej) {
    // El texto de una lectura no se contesta: se lee y se sigue.
    if (ej.tipo === "lectura-texto") return true;
    if (ej.tipo === "arma") return S.respuesta && S.respuesta.length > 0;
    if (ej.tipo === "escribe" || ej.tipo === "regla-escribe") {
      const c = d.$("#campo", raiz);
      return !!(c && c.value.trim());
    }
    if (ej.tipo === "habla") return !!(S.respuesta && S.respuesta.texto);
    return S.respuesta !== null && S.respuesta !== undefined;
  }

  const ELOGIOS = ["¡Perfecto!", "¡Excelente!", "¡Muy bien!", "¡Eso es!", "¡Impecable!", "¡Vas volando!"];
