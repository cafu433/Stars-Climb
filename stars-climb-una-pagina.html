<script>
/* js/datos-reglas.js */
/* Las reglas del inglés, una por una, con ejercicios que se generan solos.
 *
 * Esto es lo que en los libros de gramática (el Murphy, el Azar) ocupa dos
 * páginas enfrentadas: a la izquierda una regla explicada corta, a la derecha
 * ejercicios de esa regla y de ninguna otra. El formato funciona porque separa
 * dos cosas que la práctica mezclada confunde: entender la regla y
 * automatizarla. Se entiende una vez; se automatiza a base de repetir.
 *
 * La ventaja de hacerlo en pantalla y no en papel es que los ejercicios se
 * generan: en un libro son veinte y se acaban, acá no se acaban nunca y nunca
 * salen en el mismo orden, así que no se aprende la respuesta de memoria.
 *
 * Cada regla trae:
 *   regla    la explicación, contrastada con el español
 *   tabla    la forma de un vistazo
 *   clave    la frase de una línea que hay que recordar
 *   error    el error típico, mal y bien
 *   generar  una función que devuelve un ejercicio distinto cada vez
 *
 * Los ejercicios que devuelve 'generar' tienen todos la misma forma:
 *   { frase, es, opciones, ok, porque }
 * donde 'frase' lleva ___ en el hueco y 'porque' explica la respuesta cuando
 * se falla. Sin ese 'porque', equivocarse enseña sólo cuál era la respuesta.
 */
(function () {
  "use strict";

  /* ---------------- Material para armar los ejercicios ---------------- */

  /* 'gen' y 'num' están para que la traducción de apoyo concuerde. Se anotan
   * porque no se pueden deducir: "you" en español puede ser hombre o mujer, y
   * escribir "cansado" a secas o "cansada" a secas sería inventarse un dato
   * sobre quien está practicando. Cuando no se sabe, gen es "?" y sale
   * "cansado/a", que es lo que hacen los libros. Cuando sí se sabe —he, she,
   * un plural— se pone la forma correcta y ya. */
  const SUJETOS = [
    { en: "I",        es: "yo",             vivo: true, gen: "?", num: "s", ser: "soy",   estar: "estoy",   be: "am",  bePas: "was",  serPas: "era",  estarPas: "estaba",  aux: "do",   auxPas: "did", have: "have", tiene: "tengo",   tercera: false },
    { en: "You",      es: "tú",             vivo: true, gen: "?", num: "s", ser: "eres",  estar: "estás",   be: "are", bePas: "were", serPas: "eras", estarPas: "estabas", aux: "do",   auxPas: "did", have: "have", tiene: "tienes",  tercera: false },
    { en: "He",       es: "él",             vivo: true, gen: "m", num: "s", ser: "es",    estar: "está",    be: "is",  bePas: "was",  serPas: "era",  estarPas: "estaba",  aux: "does", auxPas: "did", have: "has",  tiene: "tiene",   tercera: true },
    { en: "She",      es: "ella",           vivo: true, gen: "f", num: "s", ser: "es",    estar: "está",    be: "is",  bePas: "was",  serPas: "era",  estarPas: "estaba",  aux: "does", auxPas: "did", have: "has",  tiene: "tiene",   tercera: true },
    { en: "We",       es: "nosotros",       vivo: true, gen: "?", num: "p", ser: "somos", estar: "estamos", be: "are", bePas: "were", serPas: "éramos", estarPas: "estábamos", aux: "do", auxPas: "did", have: "have", tiene: "tenemos", tercera: false },
    { en: "They",     es: "ellos",          vivo: true, gen: "m", num: "p", ser: "son",   estar: "están",   be: "are", bePas: "were", serPas: "eran", estarPas: "estaban", aux: "do",   auxPas: "did", have: "have", tiene: "tienen",  tercera: false },
    { en: "My sister",es: "mi hermana",     vivo: true, gen: "f", num: "s", ser: "es",    estar: "está",    be: "is",  bePas: "was",  serPas: "era",  estarPas: "estaba",  aux: "does", auxPas: "did", have: "has",  tiene: "tiene",   tercera: true },
    { en: "The boss", es: "el jefe",        vivo: true, gen: "m", num: "s", ser: "es",    estar: "está",    be: "is",  bePas: "was",  serPas: "era",  estarPas: "estaba",  aux: "does", auxPas: "did", have: "has",  tiene: "tiene",   tercera: true },
    { en: "The invoices", es: "las facturas", vivo: false, gen: "f", num: "p", ser: "son", estar: "están",   be: "are", bePas: "were", serPas: "eran", estarPas: "estaban", aux: "do",   auxPas: "did", have: "have", tiene: "tienen",  tercera: false },
    { en: "My parents", es: "mis padres",   vivo: true, gen: "m", num: "p", ser: "son",   estar: "están",   be: "are", bePas: "were", serPas: "eran", estarPas: "estaban", aux: "do",   auxPas: "did", have: "have", tiene: "tienen",  tercera: false },
  ];

  /* Los complementos dicen si en español piden ser o estar: sin eso, la
   * traducción de apoyo saldría mal justo en la distinción que a un
   * hispanohablante le importa. */
  /* 'es' es la forma masculina singular y 'f' dice cómo flexiona:
   *   "o"   cansado / cansada / cansados / cansadas
   *   "e"   importante / importantes (no distingue género)
   *   "no"  locuciones que no cambian nunca: en la casa, de Chile
   */
  /* 'con' dice a qué sujetos les pega el complemento. Sin esto la combinación
   * libre produce frases absurdas —"las facturas estaban cansadas"— y en un
   * ejercicio de gramática eso no es gracioso: quien está aprendiendo se queda
   * dudando de si entendió mal la frase en vez de pensar en la regla. */
  const COMPLEMENTOS = [
    { en: "tired",          es: "cansado",       f: "o",  v: "estar", con: "vivo" },
    { en: "ready",          es: "listo",         f: "o",  v: "estar", con: "todo" },
    { en: "late",           es: "atrasado",      f: "o",  v: "estar", con: "todo" },
    { en: "busy",           es: "ocupado",       f: "o",  v: "estar", con: "vivo" },
    { en: "at home",        es: "en la casa",    f: "no", v: "estar", con: "vivo" },
    { en: "in the office",  es: "en la oficina", f: "no", v: "estar", con: "todo" },
    { en: "here",           es: "acá",           f: "no", v: "estar", con: "todo" },
    { en: "from Chile",     es: "de Chile",      f: "no", v: "ser",   con: "vivo", permanente: true },
    { en: "very expensive", es: "muy caro",      f: "o",  v: "ser",   con: "cosa" },
    { en: "new",            es: "nuevo",         f: "o",  v: "ser",   con: "cosa" },
    { en: "important",      es: "importante",    f: "e",  v: "ser",   con: "todo" },
    { en: "right",          es: "correcto",      f: "o",  v: "ser",   con: "cosa" },
  ];

  // Un complemento para este sujeto, de los que tienen sentido con él.
  function complementoPara(s, rnd) {
    const quiere = s.vivo ? "vivo" : "cosa";
    return alAzar(
      COMPLEMENTOS.filter(function (c) { return c.con === "todo" || c.con === quiere; }),
      rnd
    );
  }

  /* Concuerda el complemento con el sujeto. Cuando el género no se sabe se
   * deja "cansado/a", que es lo honesto: la aplicación no sabe quién está
   * practicando y no tiene por qué suponerlo. */
  function concordar(c, gen, num) {
    if (c.f === "no") return c.es;
    if (c.f === "e") return num === "p" ? c.es + "s" : c.es;
    const raiz = c.es.slice(0, -1);               // cansad-, muy car-
    if (num === "p") {
      if (gen === "m") return raiz + "os";
      if (gen === "f") return raiz + "as";
      return raiz + "os/as";
    }
    if (gen === "m") return c.es;
    if (gen === "f") return raiz + "a";
    return c.es + "/a";
  }

  /* Verbos elegidos para que salgan todas las reglas de escritura: la -s de
   * tercera persona en sus cuatro formas, el -ed y sus excepciones, y el -ing
   * con la e muda y la consonante doble. */
  /* 'objEs' es el complemento en español. Está para poder escribir la frase de
   * apoyo como una frase de verdad —"Mi hermana ___ el bus ayer. (tomar)"— en
   * vez del galimatías que salía antes: "(tomar) mi hermana…". Una ayuda que
   * no se entiende no ayuda, y encima hace dudar de si el resto está bien. */
  const VERBOS = [
    { base: "work",  tercera: "works",   ing: "working",  pas: "worked",  es: "trabajar", obj: "here",           objEs: "acá" },
    { base: "live",  tercera: "lives",   ing: "living",   pas: "lived",   es: "vivir",    obj: "in Santiago",    objEs: "en Santiago" },
    { base: "study", tercera: "studies", ing: "studying", pas: "studied", es: "estudiar", obj: "English",        objEs: "inglés" },
    { base: "go",    tercera: "goes",    ing: "going",    pas: "went",    es: "ir",       obj: "to the office",  objEs: "a la oficina", irregular: true },
    { base: "watch", tercera: "watches", ing: "watching", pas: "watched", es: "ver",      obj: "the news",       objEs: "las noticias" },
    { base: "play",  tercera: "plays",   ing: "playing",  pas: "played",  es: "jugar",    obj: "tennis",         objEs: "tenis" },
    { base: "make",  tercera: "makes",   ing: "making",   pas: "made",    es: "hacer",    obj: "coffee",         objEs: "café", irregular: true },
    { base: "buy",   tercera: "buys",    ing: "buying",   pas: "bought",  es: "comprar",  obj: "the tickets",    objEs: "las entradas", irregular: true },
    { base: "send",  tercera: "sends",   ing: "sending",  pas: "sent",    es: "enviar",   obj: "the report",     objEs: "el informe", irregular: true },
    { base: "pay",   tercera: "pays",    ing: "paying",   pas: "paid",    es: "pagar",    obj: "the invoice",    objEs: "la factura", irregular: true },
    { base: "need",  tercera: "needs",   ing: "needing",  pas: "needed",  es: "necesitar", obj: "more time",     objEs: "más tiempo" },
    { base: "call",  tercera: "calls",   ing: "calling",  pas: "called",  es: "llamar",   obj: "the supplier",   objEs: "al proveedor" },
    { base: "write", tercera: "writes",  ing: "writing",  pas: "wrote",   es: "escribir", obj: "reports",        objEs: "informes", irregular: true },
    { base: "take",  tercera: "takes",   ing: "taking",   pas: "took",    es: "tomar",    obj: "the bus",        objEs: "el bus", irregular: true },
    { base: "finish",tercera: "finishes",ing: "finishing",pas: "finished",es: "terminar", obj: "at five",        objEs: "a las cinco" },
    { base: "stop",  tercera: "stops",   ing: "stopping", pas: "stopped", es: "parar",    obj: "at six",         objEs: "a las seis" },
  ];

  /* Un sujeto que puede hacer cosas. "The invoices don't take the bus" y "The
   * invoices are playing tennis" son gramaticalmente impecables y no significan
   * nada: en un ejercicio de gramática eso hace dudar de si uno entendió mal la
   * frase, en vez de pensar en la regla. */
  function sujetoVivo(rnd) {
    return alAzar(SUJETOS.filter(function (x) { return x.vivo; }), rnd);
  }

  /* "I" va SIEMPRE con mayúscula, esté donde esté. La aplicación lo enseña como
   * regla y luego escribía "Did i finish?" al meter el sujeto en medio de una
   * pregunta: enseñar una regla y romperla en el ejercicio siguiente es peor
   * que no enseñarla. */
  function enMinusculas(en) {
    return en === "I" ? "I" : en.toLowerCase();
  }

  /* La frase de apoyo, escrita como en un libro de gramática: la oración en
   * español con el hueco y el infinitivo entre paréntesis. No se inventan
   * conjugaciones —serían otra cosa que se puede equivocar— y se entiende. */
  function apoyo(sujetoEs, verbo, cuando, negado) {
    return (
      mayuscula(sujetoEs) + (negado ? " no" : "") + " ___ " + verbo.objEs +
      (cuando ? " " + cuando : "") + ". (" + verbo.es + ")"
    );
  }

  function mayuscula(t) {
    const x = String(t || "");
    return x ? x.charAt(0).toUpperCase() + x.slice(1) : x;
  }

  function alAzar(lista, rnd) {
    return lista[Math.floor((rnd || Math.random)() * lista.length)];
  }

  // Las opciones se barajan para que la correcta no caiga siempre en el mismo
  // sitio: si no, se aprende la posición en vez de la regla.
  function barajar(lista, rnd) {
    const c = lista.slice();

        const ADJ = [
          { en: "new", m: "nuevo", f: "nueva" },

          { en: "red", m: "rojo", f: "roja" },

          { en: "folder", es: "carpeta", g: "f", art: "una" },

          { en: "supplier", es: "proveedor", g: "m", art: "un" },

          { en: "report", es: "informe", g: "m", art: "un" },

        const n = alAzar(SUS, rnd);

          frase: "I need a ___.",
          es: "Necesito " + n.art + " " + n.es + " " + a[n.g] + ".",

          { a: "difficult", ok: "more difficult", porque: "tres sílabas → more" },
          { a: "fast", ok: "faster", porque: "una sílaba → -er" },
        ];
        const MAS = [
          { a: "cheap", ok: "cheaper", porque: "una sílaba → -er" },
          { a: "slow", ok: "slower", porque: "una sílaba → -er" },
          { a: "heavy", ok: "heavier", porque: "dos sílabas en y → -ier" },
          { a: "simple", ok: "simpler", porque: "dos sílabas: admite -er" },
          { a: "useful", ok: "more useful", porque: "no admite -er → more" },
          { a: "reliable", ok: "more reliable", porque: "cuatro sílabas → more" },
          { a: "complicated", ok: "more complicated", porque: "cuatro sílabas → more" },
          { a: "small", ok: "smaller", porque: "una sílaba → -er" },
        ];
        const CONTEXTOS = [
          { en: "This one is ___ than the other.", es: "Éste es más @ que el otro." },

          { en: "Sending it by email is ___ than posting it.", es: "Mandarlo por correo es más @ que enviarlo por carta." },
          { en: "This option looks ___ than the first one.", es: "Esta opción se ve más @ que la primera." },
          { en: "Their price is ___ than ours.", es: "Su precio es más @ que el nuestro." },
        ];
        const c = alAzar(casos.concat(MAS), rnd);
        const ctx = alAzar(CONTEXTOS, rnd);
        const op = [c.ok];
        if (c.ok.indexOf("more ") === 0) op.push(c.a + "er");
        else op.push("more " + c.a);
        op.push("more " + c.ok);
        return {
          frase: ctx.en,
          es: ctx.es.replace("@", c.a),
          opciones: barajar(op.slice(0, 3), rnd),
          ok: c.ok,
          porque: c.a + " → " + c.ok + " (" + c.porque + ")",
        };
      },
    },
  ];

  const GRUPOS = [];
  REGLAS.forEach(function (r) {
    if (GRUPOS.indexOf(r.grupo) < 0) GRUPOS.push(r.grupo);
  });

  const porId = {};
  REGLAS.forEach(function (r) { porId[r.id] = r; });

  window.APP = window.APP || {};
  APP.datosReglas = {

    },
    delNivel: function (n) {
      return REGLAS.filter(function (r) { return r.nivel <= n; });
    },
  };
})();

 *
 * Cada unidad puede abrir con una CLASE —uno o más temas de gramática que se
 * explican antes de practicar— y puede pedir REGLAS, que son tandas de
 * ejercicios de una sola regla. Ése es el orden con que se enseña un idioma en
 * el colegio y en los libros de gramática, y es bastante más rápido que
 * deducir la regla de los ejemplos: un adulto entiende "he lleva -s" en diez
 * segundos leyéndolo, y en veinte ejercicios adivinándolo.
 *
 * La primera unidad no enseña vocabulario: enseña a armar una frase. Está
 * antes que todo lo demás a propósito, porque saberse cien palabras sin saber
 * ponerlas en orden no sirve para hablar.
 *
 * ── Los ids no se tocan ──
 * El avance guardado en el teléfono se archiva por id de lección. Cambiar
 * "u1l1" por otra cosa dejaría huérfano el progreso de quien ya venía usando

<script>
/* js/srs.js */
/* Repaso espaciado: qué toca repasar hoy y qué ya está aprendido.
 *
 * Es la diferencia real con practicar al azar. Cada palabra o frase tiene su
 * propio calendario: la que sale fácil no vuelve a aparecer en semanas, la que
 * cuesta vuelve mañana. Así el tiempo se gasta en lo que todavía no se sabe.
 *
 * El algoritmo es SM-2 (el de Anki) simplificado: un factor de facilidad por
 * tarjeta que sube cuando se acierta y baja cuando se falla, multiplicando el
 * intervalo anterior. Se simplifica en un punto: en vez de pedir a la persona
 * que califique del 0 al 5, la calidad se deduce de cómo respondió (a la
 * primera, con ayuda, o mal), que es lo que la aplicación ya sabe.
 */
(function () {
  "use strict";

  const A = function () { return APP.almacen; };

  // Primeros intervalos fijos, en días. Los saltos grandes recién empiezan
  // después de tres aciertos seguidos: antes de eso una tarjeta "fácil" suele
  // ser sólo una tarjeta recién vista.
  const PRIMEROS = [1, 3, 7];

  function tarjeta(id) {
    const s = A().estado().srs[id];
    if (s) return s;
    return { ef: 2.5, intervalo: 0, rep: 0, proximo: null, aciertos: 0, fallos: 0 };
  }

  function fuerza(id) {
    /* Un 0 a 1 para pintar la barra de "cuánto lo tengo". Se basa en el
     * intervalo alcanzado: a los 30 días de intervalo se considera aprendido. */
    const t = tarjeta(id);
    if (!t.rep) return 0;
    return Math.min(1, t.intervalo / 30);
  }

  function vencida(id) {
    const t = tarjeta(id);
    if (!t.proximo) return true;
    return t.proximo <= A().hoy();
  }

  /* calidad: 2 = a la primera, 1 = costó (segundo intento o con pista), 0 = mal */
  function registrar(id, calidad) {
    const e = A().estado();
    const t = Object.assign({}, tarjeta(id));

    if (calidad <= 0) {
      // Fallar reinicia la escalera pero no el factor de facilidad completo:
      // una tarjeta que se supo diez veces y se falla una no vuelve a cero.
      t.rep = 0;
      t.intervalo = 1;
      t.ef = Math.max(1.3, t.ef - 0.2);
      t.fallos += 1;
    } else {
      t.rep += 1;
      t.aciertos += 1;
      if (calidad === 1) {
        t.ef = Math.max(1.3, t.ef - 0.08);
      } else {
        t.ef = Math.min(2.8, t.ef + 0.06);
      }
      if (t.rep <= PRIMEROS.length) {
        t.intervalo = PRIMEROS[t.rep - 1];
      } else {
        t.intervalo = Math.round(t.intervalo * t.ef);
      }
    }
    t.proximo = A().diaMas(A().hoy(), Math.max(1, t.intervalo));
    e.srs[id] = t;
    A().guardar();
    return t;
  }

  function vistas() {
    return Object.keys(A().estado().srs);
  }

  function pendientes(limite) {
    /* Las tarjetas que tocan hoy, las más atrasadas primero. Sólo entran las
     * ya vistas: el repaso repasa, no enseña cosas nuevas (para eso está el
     * camino). */
    const srs = A().estado().srs;
    const hoy = A().hoy();
    const lista = Object.keys(srs)
      .filter(function (id) {
        return APP.datos.porId(id) && (!srs[id].proximo || srs[id].proximo <= hoy);
      })
      .sort(function (a, b) {
        const pa = srs[a].proximo || "0000-00-00";
        const pb = srs[b].proximo || "0000-00-00";
        if (pa !== pb) return pa < pb ? -1 : 1;
        // A igualdad de fecha, primero lo que más se ha fallado.
        return (srs[b].fallos || 0) - (srs[a].fallos || 0);
      });
    return limite ? lista.slice(0, limite) : lista;
  }

  function debiles(limite) {
    /* Lo que más cuesta, esté vencido o no: alimenta el repaso de errores y la
     * pantalla de progreso. */
    const srs = A().estado().srs;
    return Object.keys(srs)
      .filter(function (id) { return APP.datos.porId(id) && srs[id].fallos > 0; })
      .sort(function (a, b) {
        const da = (srs[a].fallos || 0) - (srs[a].aciertos || 0);
        const db = (srs[b].fallos || 0) - (srs[b].aciertos || 0);
        return db - da;
      })
      .slice(0, limite || 20);
  }

  function resumen() {
    const srs = A().estado().srs;
    const ids = Object.keys(srs).filter(function (id) { return APP.datos.porId(id); });
    let aprendidas = 0;
    let enCurso = 0;
    ids.forEach(function (id) {
      if (fuerza(id) >= 1) aprendidas += 1;
      else enCurso += 1;
    });
    return {
      total: APP.datos.TARJETAS.length,
      vistas: ids.length,
      aprendidas: aprendidas,
      enCurso: enCurso,
      pendientes: pendientes().length,
    };
  }

  function porTema() {
    // Cuánto se lleva de cada tema, para la pantalla de progreso.
    const out = {};
    APP.datos.TARJETAS.forEach(function (t) {
      const s = (out[t.skill] = out[t.skill] || { total: 0, vistas: 0, fuerza: 0 });
      s.total += 1;
      const f = fuerza(t.id);
      if (f > 0 || A().estado().srs[t.id]) s.vistas += 1;
      s.fuerza += f;
    });
    Object.keys(out).forEach(function (k) {
      out[k].promedio = out[k].total ? out[k].fuerza / out[k].total : 0;
    });
    return out;
  }

  window.APP = window.APP || {};
  APP.srs = {
    tarjeta: tarjeta,
    fuerza: fuerza,
    vencida: vencida,
    registrar: registrar,
    vistas: vistas,
    pendientes: pendientes,
    debiles: debiles,
    resumen: resumen,
    porTema: porTema,
  };
})();

</script>
<script>
/* js/audio.js */
/* Voz: escuchar inglés, hablar inglés y los sonidos de acierto/error.
 *
 * Todo con lo que trae el navegador (SpeechSynthesis y SpeechRecognition) y con
 * WebAudio para los efectos. Cero archivos y cero servidor: la aplicación
 * completa sigue funcionando en modo avión.
 */
(function () {
  "use strict";

  let vozElegida = null;
  let vocesListas = false;

  function cargarVoces() {
    if (!window.speechSynthesis) return [];
    const voces = window.speechSynthesis.getVoices() || [];
    if (voces.length) vocesListas = true;
    return voces;
  }

  function acento() {
    try {
      return APP.almacen.estado().ajustes.acento || "en-GB";
    } catch (e) {
      return "en-GB";
    }
  }

  function elegirVoz() {
    const voces = cargarVoces();
    if (!voces.length) return null;
    const pref = acento();
    /* Orden de preferencia: el acento pedido exacto, después cualquier inglés,
     * y recién al final la voz por defecto. Las voces locales van primero
     * porque las que vienen por red se cortan sin avisar cuando no hay señal. */
    const exacta = voces.filter(function (v) { return v.lang === pref; });
    const locales = exacta.filter(function (v) { return v.localService; });
    if (locales.length) return locales[0];
    if (exacta.length) return exacta[0];
    const ingles = voces.filter(function (v) { return v.lang && v.lang.indexOf("en") === 0; });
    if (ingles.length) return ingles[0];
    return null;
  }

  if (window.speechSynthesis) {
    cargarVoces();
    // En Chrome la lista llega asíncrona: sin esto, la primera palabra del día
    // se dice con la voz del sistema (en español) y suena a chiste.
    window.speechSynthesis.onvoiceschanged = function () {
      vozElegida = null;
      cargarVoces();
    };
  }

  function hablar(texto, opciones) {
    const o = opciones || {};
    if (!window.speechSynthesis || !texto) {
      if (o.error) o.error("sin-voz");
      return;
    }
    try {
      window.speechSynthesis.cancel();
    } catch (e) {
      /* algunos navegadores tiran si no había nada sonando */
    }
    const u = new SpeechSynthesisUtterance(texto);
    if (!vozElegida) vozElegida = elegirVoz();
    if (vozElegida) u.voice = vozElegida;
    u.lang = acento();
    u.rate = o.velocidad || velocidad();
    u.pitch = 1;
    u.volume = 1;
    if (o.inicio) u.onstart = o.inicio;
    if (o.fin) u.onend = o.fin;
    u.onerror = function (ev) {
      if (o.error) o.error((ev && ev.error) || "error");
    };
    /* Android deja el motor de voz "pausado" después de un cancel() y el
     * speak() siguiente se pierde en silencio, sin error. El resume() con un
     * respiro de 60 ms lo devuelve a la vida; es feo pero es la única forma
     * conocida de que suene siempre. */
    setTimeout(function () {
      try {
        window.speechSynthesis.resume();
        window.speechSynthesis.speak(u);
      } catch (e) {
        if (o.error) o.error("excepcion");
      }
    }, 60);
  }

  function velocidad() {
    try {
      return APP.almacen.estado().ajustes.velocidad || 0.9;
    } catch (e) {
      return 0.9;
    }
  }

  function callar() {
    try {
      window.speechSynthesis.cancel();
    } catch (e) {
      /* nada que callar */
    }
  }

  function hayVoz() {
    return !!window.speechSynthesis;
  }

  /* ---------------- Micrófono ---------------- */

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  function hayMicrofono() {
    return !!SR;
  }

  let reconocedor = null;

  function escuchar(opciones) {
    const o = opciones || {};
    if (!SR) {
      if (o.error) o.error("sin-microfono");
      return null;
    }
    detenerEscucha();
    const r = new SR();
    r.lang = acento();
    r.interimResults = true;
    r.continuous = false;
    r.maxAlternatives = 3;

    let final = "";
    r.onresult = function (ev) {
      let parcial = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const texto = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) final += texto + " ";
        else parcial += texto;
      }
      if (o.parcial) o.parcial((final + " " + parcial).trim(), ev);
    };
    r.onerror = function (ev) {
      if (o.error) o.error((ev && ev.error) || "error");
    };
    r.onend = function () {
      if (o.fin) o.fin(final.trim());
      reconocedor = null;
    };
    try {
      r.start();
    } catch (e) {
      if (o.error) o.error("no-arranca");
      return null;
    }
    reconocedor = r;
    return r;
  }

  function detenerEscucha() {
    if (reconocedor) {
      try {
        reconocedor.stop();
      } catch (e) {
        /* ya estaba detenido */
      }
      reconocedor = null;
    }
  }

  /* ---------------- Efectos ----------------
   * Tonos cortos generados al vuelo. Un archivo de sonido sería más rico, pero
   * pesaría y habría que descargarlo: acá el acierto suena instantáneo incluso
   * la primera vez que se abre la aplicación.
   */
  let ctx = null;

  function contexto() {
    if (!ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      ctx = new C();
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  function tono(frecuencias, duracion, volumen) {
    let permitido = true;
    try {
      permitido = APP.almacen.estado().ajustes.sonido;
    } catch (e) {
      /* antes de que exista el estado, suena */
    }
    if (!permitido) return;
    const c = contexto();
    if (!c) return;
    frecuencias.forEach(function (f, i) {
      const osc = c.createOscillator();
      const gan = c.createGain();
      osc.type = "sine";
      osc.frequency.value = f;
      const t0 = c.currentTime + i * duracion * 0.6;
      gan.gain.setValueAtTime(0, t0);
      gan.gain.linearRampToValueAtTime(volumen, t0 + 0.01);
      gan.gain.exponentialRampToValueAtTime(0.0001, t0 + duracion);
      osc.connect(gan);
      gan.connect(c.destination);
      osc.start(t0);
      osc.stop(t0 + duracion + 0.02);
    });
  }

  function vibrar(patron) {
    try {
      if (APP.almacen.estado().ajustes.vibrar && navigator.vibrate) navigator.vibrate(patron);
    } catch (e) {
      /* sin vibración */
    }
  }

  /* La escala de la racha: cada acierto seguido suena un paso más arriba.
   *
   * Es el detalle que más se nota jugando. Un mismo "tin" repetido veinte veces
   * es ruido; una escala que sube convierte la racha en algo que se oye, y
   * cortarla se siente antes de leer el error en la pantalla. Son las notas de
   * una escala pentatónica mayor, que suenan bien en cualquier orden.
   */
  const ESCALA = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760];

  const efectos = {
    bien: function (racha) {
      const paso = Math.min(ESCALA.length - 1, Math.max(0, (racha || 0) - 1));
      tono([ESCALA[paso], ESCALA[paso] * 1.5], 0.12, 0.11);
      vibrar(20);
    },
    mal: function () {
      tono([200, 150], 0.18, 0.12);
      vibrar([40, 60, 40]);
    },
    completo: function () {
      tono([523, 659, 784, 1047, 1319], 0.18, 0.13);
      vibrar([30, 40, 30, 40, 60]);
    },
    // Para cuando se rompe un récord: la misma fanfarria, más arriba y más larga.
    record: function () {
      tono([659, 880, 1047, 1319, 1760], 0.2, 0.14);
      vibrar([50, 60, 50, 60, 120]);
    },
    // El reloj del contrarreloj cuando quedan pocos segundos.
    tic: function () {
      tono([1200], 0.04, 0.06);
    },
    toque: function () {
      tono([440], 0.05, 0.05);
    },
  };

  window.APP = window.APP || {};
  APP.audio = {
    hablar: hablar,
    callar: callar,
    hayVoz: hayVoz,
    hayMicrofono: hayMicrofono,
    escuchar: escuchar,
    detenerEscucha: detenerEscucha,
    efectos: efectos,
    vibrar: vibrar,
    voces: cargarVoces,
    reiniciarVoz: function () { vozElegida = null; },
  };
})();

</script>
<script>
/* js/texto.js */
/* Comparar lo que escribió o dijo la persona con la respuesta esperada.
 *
 * La regla de fondo: corregir el inglés, no la puntuación ni el teclado del
 * teléfono. Escribir "i dont know" cuando la respuesta es "I don't know" está
 * bien; escribir "I know" no lo está.
 */
(function () {
  "use strict";

  /* Contracciones y variantes de escritura que valen lo mismo.
   *
   * Se expanden ("dont" → "do not") en vez de acortarse: así la frase conserva
   * la misma cantidad de palabras y el porcentaje de "cuánto dijiste bien" no
   * se distorsiona por escribir "I'm" en vez de "I am".
   *
   * Dos que no están, a propósito: "its" (chocaría con el posesivo) y "were"
   * (chocaría con el pasado de "be", y daría por buena una frase en el tiempo
   * verbal equivocado).
   */
  const EXPANSIONES = {
    dont: "do not", doesnt: "does not", didnt: "did not",
    isnt: "is not", arent: "are not", wasnt: "was not", werent: "were not",
    cant: "can not", cannot: "can not", wont: "will not", couldnt: "could not",
    wouldnt: "would not", shouldnt: "should not", havent: "have not", hasnt: "has not",
    im: "i am", youre: "you are", hes: "he is", shes: "she is", theyre: "they are",
    ive: "i have", youve: "you have", weve: "we have", theyve: "they have",
    lets: "let us", thats: "that is", whats: "what is", wheres: "where is",
  };

  // Diferencias de ortografía entre inglés británico y americano: las dos se
  // aceptan, porque el objetivo es el inglés, no el país.
  const VARIANTES = {
    favourite: "favorite", colour: "color", flavour: "flavor",
    grey: "gray", aeroplane: "airplane", travelling: "traveling",
    ok: "okay", theatre: "theater", centre: "center",
  };

  function normalizar(texto) {
    const limpio = (texto || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "") // tildes: "cafe" y "café" son lo mismo
      .replace(/[\u2019\u2018`]/g, "'")
      .replace(/[^a-z0-9' ]+/g, " ")
      .replace(/'/g, "")
      .replace(/\s+/g, " ")
      .trim();
    if (!limpio) return "";
    return limpio
      .split(" ")
      .map(function (p) {
        // hasOwnProperty y no un acceso directo: si no, una palabra como
        // "constructor" encontraría algo heredado de Object y devolvería basura.
        if (Object.prototype.hasOwnProperty.call(EXPANSIONES, p)) return EXPANSIONES[p];
        if (Object.prototype.hasOwnProperty.call(VARIANTES, p)) return VARIANTES[p];
        return p;
      })
      .join(" ");
  }

  function palabras(texto) {
    const n = normalizar(texto);
    return n ? n.split(" ") : [];
  }

  function iguales(a, b) {
    return normalizar(a) === normalizar(b);
  }

  function distancia(a, b) {
    // Levenshtein clásico, sobre caracteres o sobre palabras según lo que se
    // le pase (arreglos o strings: ambos se indexan igual).
    const m = a.length;
    const n = b.length;
    if (!m) return n;
    if (!n) return m;
    let prev = new Array(n + 1);
    for (let j = 0; j <= n; j++) prev[j] = j;
    for (let i = 1; i <= m; i++) {
      const cur = [i];
      for (let j = 1; j <= n; j++) {
        cur[j] = Math.min(
          prev[j] + 1,
          cur[j - 1] + 1,
          prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
        );
      }
      prev = cur;
    }
    return prev[n];
  }

  function casiIguales(escrito, esperado) {
    /* Un typo no debería costar una vida. Se acepta una diferencia de una letra
     * por cada seis caracteres, con un mínimo de una: "restaurnt" pasa,
     * "restaurant" contra "restrooms" no. */
    const a = normalizar(escrito);
    const b = normalizar(esperado);
    if (!a) return false;
    if (a === b) return true;
    const tolerancia = Math.max(1, Math.floor(b.length / 6));
    return distancia(a, b) <= tolerancia;
  }

  /* Diferencia palabra por palabra, para mostrarle qué dijo de más, de menos o
   * distinto cuando practica hablando. Es lo que convierte "60%" en algo que
   * enseña: sin esto, la nota no dice dónde estuvo el problema. */
  function comparar(esperado, dicho) {
    const a = palabras(esperado);
    const b = palabras(dicho);
    const m = a.length;
    const n = b.length;

    // Tabla completa de Levenshtein para poder reconstruir el camino.
    const d = [];
    for (let i = 0; i <= m; i++) {
      d.push(new Array(n + 1).fill(0));
      d[i][0] = i;
    }
    for (let j = 0; j <= n; j++) d[0][j] = j;
    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        d[i][j] = Math.min(
          d[i - 1][j] + 1,
          d[i][j - 1] + 1,
          d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
        );
      }
    }

    const ops = [];
    let i = m;
    let j = n;
    while (i > 0 || j > 0) {
      if (i > 0 && j > 0 && a[i - 1] === b[j - 1]) {
        ops.unshift({ tipo: "ok", palabra: a[i - 1] });
        i--; j--;
      } else if (i > 0 && j > 0 && d[i][j] === d[i - 1][j - 1] + 1) {
        ops.unshift({ tipo: "cambio", palabra: a[i - 1], dicho: b[j - 1] });
        i--; j--;
      } else if (j > 0 && d[i][j] === d[i][j - 1] + 1) {
        ops.unshift({ tipo: "sobra", palabra: b[j - 1] });
        j--;
      } else {
        ops.unshift({ tipo: "falta", palabra: a[i - 1] });
        i--;
      }
    }

    const buenas = ops.filter(function (o) { return o.tipo === "ok"; }).length;
    const nota = m ? Math.round((buenas / m) * 100) : 0;
    return { ops: ops, nota: nota, total: m, buenas: buenas };
  }

  function fichas(frase) {
    /* Corta la frase en fichas para el ejercicio de armar. Se corta por
     * espacios y no por palabras "de verdad": la persona ve exactamente las
     * piezas que tiene que ordenar, con su puntuación pegada. */
    return (frase || "").trim().split(/\s+/);
  }

  window.APP = window.APP || {};
  APP.texto = {
    normalizar: normalizar,
    palabras: palabras,
    iguales: iguales,
    casiIguales: casiIguales,
    distancia: distancia,
    comparar: comparar,
    fichas: fichas,
  };
})();

</script>
<script>
/* js/motor.js */
/* El motor: convierte contenido en ejercicios.
 *
 * Una lección no trae ejercicios escritos a mano; trae temas y tipos
 * permitidos, y acá se arman en el momento. Por eso repetir una lección no es
 * repetir las mismas diez pantallas: cambian las palabras, cambian los
 * distractores y cambia la forma de preguntar.
 *
 * La elección de qué preguntar no es al azar. Prioriza lo que está por vencer
 * en el repaso espaciado y lo que se ha fallado antes; lo que ya está aprendido
 * aparece sólo de vez en cuando, para no gastar la sesión en lo que ya sabe.
 */
(function () {
  "use strict";

  const D = function () { return APP.datos; };

  function revolver(a) {
    const x = a.slice();
    for (let i = x.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = x[i]; x[i] = x[j]; x[j] = t;
    }
    return x;
  }

  function alAzar(a) {
    return a[Math.floor(Math.random() * a.length)];
  }

  function tercera(base) {
    if (base === "have") return "has";
    if (base === "be") return "is";
    if (base === "go") return "goes";
    if (base === "do") return "does";
    if (/[sxz]$|ch$|sh$/.test(base)) return base + "es";
    if (/[^aeiou]y$/.test(base)) return base.slice(0, -1) + "ies";
    return base + "s";
  }

  function gerundio(base) {
    if (base === "be") return "being";
    if (/[^aeiou]e$/.test(base)) return base.slice(0, -1) + "ing";
    if (/^(run|put|begin|get|sit|stop|plan)$/.test(base)) return base + base.slice(-1) + "ing";
    return base + "ing";
  }

  /* ---------------- Elegir qué preguntar ----------------
   * Cada tarjeta candidata recibe un peso; después se sortea con ese peso. No
   * se toman "las N con más peso" a propósito: eso haría que la misma lección
   * repitiera siempre las mismas palabras difíciles y nunca mostrara el resto.
   */
  function peso(id) {
    const t = APP.srs.tarjeta(id);
    if (!t.rep && !t.fallos) return 3; // nueva: interesa mostrarla
    if (APP.srs.vencida(id)) return 5; // toca repasarla hoy
    const f = APP.srs.fuerza(id);
    return Math.max(0.4, 3 * (1 - f)); // cuanto más floja, más probable
  }

  function sortear(candidatos, n) {
    const pool = candidatos.slice();
    const salida = [];
    while (salida.length < n && pool.length) {
      const pesos = pool.map(function (c) { return peso(c.id); });
      const total = pesos.reduce(function (a, b) { return a + b; }, 0);
      let r = Math.random() * total;
      let i = 0;
      while (i < pool.length - 1 && r > pesos[i]) {
        r -= pesos[i];
        i++;
      }
      salida.push(pool.splice(i, 1)[0]);
    }
    return salida;
  }

  /* El tope de nivel por defecto, según dónde esté la lección en el curso.
   *
   * Sin esto había lecciones básicas hechas casi enteras de material
   * avanzado: "Verbos del día" es de las primeras unidades y nueve de sus
   * quince tarjetas eran de nivel 3. El tema era el correcto y el nivel,
   * absurdo — el mismo error que hacía preguntar "Have a lovely evening" en
   * la lección "Hola".
   *
   * Una lección puede pedir un tope más bajo con nivelMax (las tres primeras
   * lo ponen en 1). Lo que no puede es subirlo por encima del de su nivel.
   */
  const TOPE_POR_NIVEL = { basico: 2, intermedio: 3 };

  function topeDe(leccion) {
    const porNivel = TOPE_POR_NIVEL[leccion.nivel];
    if (leccion.nivelMax && porNivel) return Math.min(leccion.nivelMax, porNivel);
    return leccion.nivelMax || porNivel || 0;
  }

  function candidatas(skills, filtro, nivelMax) {
    let out = [];
    skills.forEach(function (s) {
      out = out.concat(D().porSkill(s));
    });
    /* Un tope de nivel para que una lección de principiante no alcance las
     * frases largas del mismo tema. Sin esto, la primera lección del curso
     * podía preguntar "Have a lovely evening" a alguien que recién aprendió
     * que "hi" es hola: el tema era el correcto y el nivel, absurdo.
     *
     * Si con el tope no queda casi nada, se suelta: más vale una lección un
     * poco difícil que una lección de tres ejercicios. */
    if (nivelMax) {
      const cabe = out.filter(function (t) { return (t.nivel || 2) <= nivelMax; });
      if (cabe.length >= 8) out = cabe;
    }
    if (filtro) out = out.filter(filtro);
    return out;
  }

  function distractores(tarjeta, banco, campo, n) {
    /* Los distractores buenos se parecen a la respuesta: mismo tema y largo
     * parecido. Un distractor obviamente absurdo convierte el ejercicio en un
     * "aprieta el más largo" y no enseña nada. */
    const otros = banco.filter(function (t) { return t.id !== tarjeta.id && t[campo]; });
    const mismoTema = otros.filter(function (t) { return t.skill === tarjeta.skill; });
    const fuente = mismoTema.length >= n ? mismoTema : otros;
    const objetivo = (tarjeta[campo] || "").length;
    const ordenados = revolver(fuente).sort(function (a, b) {
      return Math.abs(a[campo].length - objetivo) - Math.abs(b[campo].length - objetivo);
    });
    const vistos = {};
    const out = [];
    ordenados.forEach(function (t) {
      if (out.length >= n) return;
      const clave = APP.texto.normalizar(t[campo]);
      if (vistos[clave] || clave === APP.texto.normalizar(tarjeta[campo])) return;
      vistos[clave] = true;
      out.push(t);
    });
    return out;
  }

  /* ---------------- Constructores por tipo ----------------
   * Cada uno devuelve un ejercicio o null. Devolver null es legítimo: significa
   * "con este contenido este ejercicio no tiene sentido" (armar una frase con
   * una palabra suelta, por ejemplo) y el generador simplemente prueba otro.
   */

  /* Qué partes de un ejercicio están en inglés.
   *
   * Hace falta para poder tocar una palabra y ver qué significa: si se hicieran
   * tocables las palabras españolas, tocar "conocerte" respondería "no está en
   * el curso", que es absurdo. Y si no se marca nada, la función no se puede
   * ofrecer en los ejercicios —que es justo donde más falta hace, porque una
   * pregunta con una palabra que no conoces no se puede contestar—.
   *
   * Se anota acá, al construir, y no se adivina al pintar: el mismo tipo
   * "escribe" sirve para traducir (enunciado en español) y para el dictado
   * (sin enunciado), y el mismo "arma" va en los dos sentidos.
   */
  const constructores = {
    "elige-en": function (t, banco) {
      const malos = distractores(t, banco, "en", 3);
      if (malos.length < 3) return null;
      const opciones = revolver(
        [{ texto: t.en, icon: t.icon, correcta: true }].concat(
          malos.map(function (m) { return { texto: m.en, icon: m.icon, correcta: false }; })
        )
      );
      return {
        tipo: "elige-en",
        tarjetaId: t.id,
        enunciado: "¿Cómo se dice en inglés?",
        prompt: t.es,
        promptIcon: t.icon,
        promptHex: t.hex,
        opciones: opciones,
        audioAlAcertar: t.en,
        respuesta: t.en,
        nota: t.nota,
        promptEn: false,
        opcionesEn: true,
      };
    },

    "elige-es": function (t, banco) {
      const malos = distractores(t, banco, "es", 3);
      if (malos.length < 3) return null;
      const opciones = revolver(
        [{ texto: t.es, correcta: true }].concat(
          malos.map(function (m) { return { texto: m.es, correcta: false }; })
        )
      );
      return {
        tipo: "elige-es",
        tarjetaId: t.id,
        enunciado: "¿Qué significa?",
        prompt: t.en,
        promptIcon: t.icon,
        audio: t.en,
        opciones: opciones,
        respuesta: t.es,
        nota: t.nota,
        promptEn: true,
        opcionesEn: false,
      };
    },

    "escucha-elige": function (t, banco) {
      if (!APP.audio.hayVoz()) return null;
      const malos = distractores(t, banco, "en", 3);
      if (malos.length < 3) return null;
      const opciones = revolver(
        [{ texto: t.en, correcta: true }].concat(
          malos.map(function (m) { return { texto: m.en, correcta: false }; })
        )
      );
      return {
        tipo: "escucha-elige",
        tarjetaId: t.id,
        enunciado: "¿Qué escuchaste?",
        audio: t.en,
        autoAudio: true,
        opciones: opciones,
        respuesta: t.en,
        traduccion: t.es,
        opcionesEn: true,
      };
    },

    "arma-en": function (t, banco) {
      const piezas = APP.texto.fichas(t.en);
      if (piezas.length < 3) return null;
      return {
        tipo: "arma",
        tarjetaId: t.id,
        enunciado: "Arma la frase en inglés",
        prompt: t.es,
        respuesta: t.en,
        fichas: revolver(piezas.concat(fichasSenuelo(t, banco, piezas))),
        audioAlAcertar: t.en,
        idioma: "en",
        promptEn: false,
        fichasEn: true,
      };
    },

    "arma-es": function (t) {
      const piezas = APP.texto.fichas(t.es);
      if (piezas.length < 3) return null;
      return {
        tipo: "arma",
        tarjetaId: t.id,
        enunciado: "Arma la traducción",
        prompt: t.en,
        audio: t.en,
        respuesta: t.es,
        fichas: revolver(piezas),
        idioma: "es",
        promptEn: true,
        fichasEn: false,
      };
    },

    "escribe-en": function (t) {
      if (t.en.split(/\s+/).length > 9) return null;
      return {
        tipo: "escribe",
        tarjetaId: t.id,
        enunciado: "Escríbelo en inglés",
        prompt: t.es,
        promptIcon: t.icon,
        respuesta: t.en,
        audioAlAcertar: t.en,
        promptEn: false,
      };
    },

    dictado: function (t) {
      if (!APP.audio.hayVoz()) return null;
      if (t.en.split(/\s+/).length > 9) return null;
      return {
        tipo: "escribe",
        tarjetaId: t.id,
        enunciado: "Escucha y escribe lo que oyes",
        audio: t.en,
        autoAudio: true,
        respuesta: t.en,
        traduccion: t.es,
      };
    },

    habla: function (t) {
      if (!APP.audio.hayMicrofono()) return null;
      return {
        tipo: "habla",
        tarjetaId: t.id,
        enunciado: "Dilo en voz alta",
        prompt: t.en,
        traduccion: t.es,
        audio: t.en,
        respuesta: t.en,
        promptEn: true,
      };
    },
  };

  function fichasSenuelo(t, banco, piezas) {
    /* Dos fichas de más para que armar la frase no sea "usa todas las que hay".
     * Salen de otras frases del mismo tema: palabras plausibles, no ruido. */
    const otras = banco
      .filter(function (x) { return x.id !== t.id && x.tipo === "frase"; })
      .slice(0, 40);
    const usadas = {};
    piezas.forEach(function (p) { usadas[p.toLowerCase()] = true; });
    const pool = [];
    otras.forEach(function (o) {
      APP.texto.fichas(o.en).forEach(function (p) {
        if (!usadas[p.toLowerCase()] && !/^[A-Z]/.test(p)) pool.push(p);
      });
    });
    return revolver(pool).slice(0, Math.min(2, Math.max(0, 8 - piezas.length)));
  }

  /* ---------------- Ejercicios de gramática y oído ----------------
   * Estos no salen de una tarjeta de vocabulario, así que se arman aparte y no
   * alimentan el repaso espaciado (no hay una "palabra" que se olvide).
   */

  function ejercicioVerbo(tiempo) {
    const v = alAzar(D().VERBOS);
    const sujetos = ["She", "He", "My sister", "The manager"];
    const sujeto = alAzar(sujetos);
    const obj = v.obj ? " " + v.obj : "";
    let correcta;
    let opciones;
    let oracion;
    let explicacion;

    if (tiempo === "pasado") {
      correcta = v.past;
      oracion = "Yesterday " + sujeto.toLowerCase() + " ___ (" + v.base + ")" + obj + ".";
      if (v.base === "be") {
        // was/were merece su propio ejercicio: es la confusión más común y no
        // se arregla con el distractor de siempre ("beed" no lo dice nadie).
        opciones = ["was", "were", "is"];
        explicacion = "Con he/she/it el pasado de “be” es “was”. “Were” va con you/we/they.";
      } else {
        opciones = [correcta, v.base + "ed", tercera(v.base)];
        explicacion =
          v.past === v.base + "ed"
            ? "Pasado regular: " + v.base + " + -ed."
            : v.past === v.base
            ? "Ojo: el pasado de “" + v.base + "” se escribe igual que el presente, pero cambia la pronunciación."
            : "Verbo irregular: el pasado de “" + v.base + "” es “" + v.past + "”, no “" + v.base + "ed”.";
      }
    } else if (tiempo === "futuro") {
      correcta = "will " + v.base;
      oracion = "Tomorrow " + sujeto.toLowerCase() + " ___ (" + v.base + ")" + obj + ".";
      opciones = [correcta, v.past, "will " + v.past];
      explicacion = "Futuro con will: siempre “will” + el verbo en su forma base, sin -s ni -ed.";
    } else {
      correcta = tercera(v.base);
      oracion = sujeto + " ___ (" + v.base + ")" + obj + " every day.";
      opciones = [correcta, v.base, gerundio(v.base)];
      explicacion =
        "Presente simple con he/she/it: el verbo lleva -s (“" + correcta + "”). Es el error más repetido de los hispanohablantes.";
    }

    const unicas = [];
    opciones.forEach(function (o) { if (unicas.indexOf(o) < 0) unicas.push(o); });
    if (unicas.length < 2) return null;
    return {
      tipo: "hueco",
      enunciado: "Completa la frase",
      oracion: oracion,
      opciones: revolver(unicas).map(function (o) {
        return { texto: o, correcta: o === correcta };
      }),
      respuesta: correcta,
      explicacion: explicacion,
      traduccion: v.es,
      oracionEn: true,
      opcionesEn: true,
    };
  }

  function ejercicioInged() {
    const it = alAzar(D().INGED);
    return {
      tipo: "hueco",
      enunciado: "Completa la frase",
      oracion: it.sentence,
      opciones: revolver(it.options).map(function (o) {
        return { texto: o, correcta: o === it.correct };
      }),
      respuesta: it.correct,
      explicacion: it.es,
      oracionEn: true,
      opcionesEn: true,
    };
  }

  function ejercicioMinimos() {
    if (!APP.audio.hayVoz()) return null;
    const p = alAzar(D().VOCALES);
    const objetivo = Math.random() < 0.5 ? p.a : p.b;
    return {
      tipo: "escucha-elige",
      enunciado: "¿Qué palabra escuchaste?",
      audio: objetivo,
      autoAudio: true,
      opciones: revolver([
        { texto: p.a, simbolo: p.symbolA, correcta: objetivo === p.a },
        { texto: p.b, simbolo: p.symbolB, correcta: objetivo === p.b },
      ]),
      respuesta: objetivo,
      explicacion: p.tip,
      opcionesEn: true,
    };
  }

  function ejercicioRegistro() {
    const p = alAzar(D().FORMAL);
    const formal = Math.random() < 0.5;
    return {
      tipo: "elige-en",
      enunciado: formal ? "¿Cuál es la forma formal?" : "¿Cuál es la forma informal?",
      prompt: p.situation,
      opciones: revolver([
        { texto: p.formal, correcta: formal },
        { texto: p.informal, correcta: !formal },
      ]),
      respuesta: formal ? p.formal : p.informal,
      explicacion: "Formal: “" + p.formal + "”. Informal: “" + p.informal + "”.",
      // El enunciado ("En una reunión de trabajo…") va en español.
      promptEn: false,
      opcionesEn: true,
    };
  }

  function ejercicioPares(candidatas) {
    const elegidas = sortear(candidatas.filter(function (t) { return t.tipo === "palabra"; }), 5);
    if (elegidas.length < 4) return null;
    return {
      tipo: "pares",
      enunciado: "Une cada palabra con su significado",
      // Sólo el lado inglés se puede tocar: el español no hay nada que
      // consultar, y ofrecerlo sólo daría "no está en el curso".
      izquierda: revolver(elegidas.map(function (t) { return { id: t.id, texto: t.en, lado: "en" }; })),
      derecha: revolver(elegidas.map(function (t) { return { id: t.id, texto: t.es, lado: "es" }; })),
      izquierdaEn: true,
      tarjetas: elegidas.map(function (t) { return t.id; }),
    };
  }

  const ESPECIALES = {
    verbo: function (skills) {
      const tiempo = skills.indexOf("pasado") >= 0 ? "pasado" : skills.indexOf("futuro") >= 0 ? "futuro" : "presente";
      return ejercicioVerbo(tiempo);
    },
    hueco: function (skills) {
      if (skills.indexOf("inged") >= 0) return ejercicioInged();
      const tiempo = skills.indexOf("pasado") >= 0 ? "pasado" : skills.indexOf("futuro") >= 0 ? "futuro" : "presente";
      return Math.random() < 0.5 ? ejercicioInged() : ejercicioVerbo(tiempo);
    },
    minimos: ejercicioMinimos,
    registro: ejercicioRegistro,
  };

  /* ---------------- Armar una sesión ---------------- */

  function generar(tipo, tarjeta, banco) {
    const f = constructores[tipo];
    if (!f) return null;
    return f(tarjeta, banco);
  }

  function repetido(lista, ej) {
    // No preguntar dos veces la misma tarjeta dentro de una sesión corta: es lo
    // que más se nota y lo que más molesta.
    if (!ej.tarjetaId) return false;
    return lista.some(function (x) { return x.tarjetaId === ej.tarjetaId; });
  }

  /* Una lección de leer: el texto primero, y después sus preguntas. Va aparte
   * del resto porque no se arma por tarjetas: el texto es la unidad, y
   * trocearlo en ejercicios sueltos perdería justo lo que se entrena, que es
   * seguir una idea a lo largo de varias frases. */
  function sesionLectura(leccion) {
    const t = APP.datosLectura && APP.datosLectura.texto(leccion.texto);
    if (!t) return [];
    const out = [{ tipo: "lectura-texto", texto: t.id, titulo: t.titulo, cuerpo: t.texto, glosario: t.glosario, emo: t.emo }];
    revolver(t.preguntas.slice()).forEach(function (p, i) {
      out.push({
        tipo: "lectura-pregunta",
        texto: t.id,
        id: t.id + "-p" + i,
        pregunta: p.p,
        opciones: p.op.slice(),
        ok: p.op[p.ok],
        /* En qué idioma está la pregunta. Importa para el diccionario: en el
         * nivel 1 las preguntas van en español —para que la dificultad esté en
         * entender el texto y no la pregunta— y hacer tocables esas palabras
         * daría "esta palabra no está en el curso" sobre «olvida», que es
         * absurdo y hace dudar de si el diccionario sirve. */
        idioma: t.nivel === 1 ? "es" : "en",
      });
    });
    return out;
  }

  /* Tandas de una o varias reglas, repartidas. Cuando la lección pide dos
   * reglas se alternan en vez de darse una detrás de otra: mezcladas obligan a
   * decidir cuál aplica, que es la mitad de la dificultad real. */
  function sesionReglas(leccion, modo) {
    const ids = leccion.reglas || [];
    if (!ids.length || !APP.reglas) return [];
    const porRegla = ids.map(function (id) {
      return APP.reglas.tanda(id, Math.ceil((leccion.n || 12) / ids.length) + 2, modo);
    });
    const out = [];
    let i = 0;
    while (out.length < (leccion.n || 12)) {
      let quedaba = false;
      for (let r = 0; r < porRegla.length; r++) {
        if (porRegla[r][i]) { out.push(porRegla[r][i]); quedaba = true; }
        if (out.length >= (leccion.n || 12)) break;
      }
      if (!quedaba) break;
      i++;
    }
    return out;
  }

  /* ---------------- Las etapas de una lección ----------------
   *
   * Una lección no es una tanda de ejercicios mezclados: es una secuencia.
   * Primero ver, después reconocer entre opciones, después escribirlo sin
   * opciones, y al final decirlo en voz alta.
   *
   * El orden no es decorativo. Reconocer la respuesta entre cuatro es mucho
   * más fácil que producirla, y quedarse sólo en reconocer da la sensación de
   * saber algo que después no sale cuando hace falta. Cada etapa pide un poco
   * más que la anterior sobre el mismo material, que es lo que hace que se
   * fije en vez de pasar de largo.
   */
  const ETAPAS = [
    { id: "ver", nombre: "Ver", sub: "Mira cómo es" },
    { id: "reconocer", nombre: "Reconocer", sub: "Elige la correcta" },
    { id: "escribir", nombre: "Escribir", sub: "Ahora sin opciones" },
    { id: "escuchar", nombre: "Escuchar", sub: "Sin mirar la palabra" },
    { id: "decir", nombre: "Decir", sub: "En voz alta" },
  ];

  function etapaDe(ej) {
    if (ej.tipo === "pares") return "ver";
    if (ej.tipo === "habla") return "decir";
    if (ej.tipo === "escucha-elige") return "escuchar";
    if (ej.tipo === "escribe") return ej.autoAudio ? "escuchar" : "escribir";
    if (ej.tipo === "arma" || ej.tipo === "regla-escribe") return "escribir";
    return "reconocer";
  }

  function ordenarPorEtapa(ejercicios) {
    const orden = {};
    ETAPAS.forEach(function (e, i) { orden[e.id] = i; });
    return ejercicios
      .map(function (e) { return Object.assign({}, e, { etapa: e.etapa || etapaDe(e) }); })
      .sort(function (a, b) { return orden[a.etapa] - orden[b.etapa]; });
  }

  /* Completa las etapas que falten.
   *
   * Una lección declara qué tipos de ejercicio quiere, y muchas sólo pedían
   * reconocer. Eso hacía lecciones cortas en las que nunca se escribía ni se
   * decía nada: se avanzaba rápido y se olvidaba igual de rápido. Ahora lo
   * declarado marca el énfasis, pero las cinco etapas se recorren siempre.
   *
   * Las de escuchar y decir dependen del aparato: si no hay voz o micrófono,
   * el constructor devuelve null y esa etapa simplemente no aparece. No se
   * fuerza nada que no se pueda contestar.
   */
  function completarEtapas(leccion, ejercicios) {
    // El mismo tope de nivel que usó sesionNormal. Sin repetirlo aquí, las
    // etapas que se rellenan al final volvían a sacar frases de nivel 2 y se
    // colaban justo por la puerta de atrás.
    const banco = candidatas(leccion.skills, null, topeDe(leccion));
    if (!banco.length) return ejercicios;

    const hay = {};
    ejercicios.forEach(function (e) { hay[e.etapa || etapaDe(e)] = (hay[e.etapa || etapaDe(e)] || 0) + 1; });

    const receta = [
      { etapa: "ver", tipos: ["pares"], cuantos: 1 },
      { etapa: "reconocer", tipos: ["elige-en", "elige-es"], cuantos: 4 },
      { etapa: "escribir", tipos: ["escribe-en", "arma-en"], cuantos: 4 },
      { etapa: "escuchar", tipos: ["dictado", "escucha-elige"], cuantos: 3 },
      { etapa: "decir", tipos: ["habla"], cuantos: 2 },
    ];

    const extra = [];
    receta.forEach(function (r) {
      let faltan = r.cuantos - (hay[r.etapa] || 0);
      let vueltas = 0;
      let i = 0;
      // Dentro de una etapa no se repite tarjeta; entre etapas SÍ, y a
      // propósito: la misma palabra se ve, se reconoce, se escribe y se dice.
      // Repetirla en otra etapa es la idea, no un descuido.
      //
      // Comprobarlo contra la lección entera era justo lo que impedía que las
      // etapas nuevas existieran: con nueve palabras y diez ejercicios ya
      // hechos, todo lo que se generaba salía "repetido" y la lección se
      // quedaba sin escribir ni decir, en silencio.
      const deEstaEtapa = [];
      while (faltan > 0 && vueltas < 40) {
        vueltas++;
        const tipo = r.tipos[i % r.tipos.length];
        i++;
        const fuente = tipo === "arma-en"
          ? banco.filter(function (t) { return t.tipo === "frase"; })
          : banco;
        if (!fuente.length) break;
        const t = sortear(fuente, 1)[0];
        const ej = tipo === "pares" ? ejercicioPares(banco) : generar(tipo, t, banco);
        if (!ej) continue;
        if (repetido(deEstaEtapa, ej)) continue;
        deEstaEtapa.push(ej);
        extra.push(ej);
        faltan--;
      }
    });
    return ejercicios.concat(extra);
  }

  /* Oír y decir la frase de una regla.
   *
   * Una lección de gramática se quedaba en leer y escribir: se aprendía la
   * regla sin haberla dicho nunca en voz alta, y después no sale al hablar.
   * Se arman con la frase ya resuelta —"She is my sister"— que es una oración
   * de verdad y no una palabra suelta.
   *
   * Sólo con las reglas cuya frase tiene contexto: "___" resuelto es una
   * palabra, y hacer repetir "it" a secas no enseña a hablar.
   */
  function vozDeRegla(ejercicios, cuantosOir, cuantosDecir) {
    if (!APP.reglas) return [];
    const frases = [];
    const vistas = {};
    ejercicios.forEach(function (e) {
      if (!e.regla || !e.frase) return;
      const pelada = String(e.frase).replace(/_{3}/g, "").replace(/[\s…·.?]/g, "");
      if (!pelada) return;                       // era sólo el hueco
      const hecha = APP.reglas.resuelta(e);
      if (vistas[hecha] || hecha.split(/\s+/).length < 3) return;
      vistas[hecha] = true;
      frases.push({ en: hecha, es: e.es || "" });
    });

    const out = [];
    const mezcladas = revolver(frases);
    if (APP.audio.hayVoz()) {
      mezcladas.slice(0, cuantosOir).forEach(function (f) {
        out.push({
          tipo: "escribe",
          enunciado: "Escucha y escribe lo que oyes",
          audio: f.en,
          autoAudio: true,
          respuesta: f.en,
          traduccion: f.es,
          etapa: "escuchar",
        });
      });
    }
    if (APP.audio.hayMicrofono()) {
      mezcladas.slice(cuantosOir, cuantosOir + cuantosDecir).forEach(function (f) {
        out.push({
          tipo: "habla",
          enunciado: "Dilo en voz alta",
          prompt: f.en,
          traduccion: f.es,
          audio: f.en,
          respuesta: f.en,
          promptEn: true,
          etapa: "decir",
        });
      });
    }
    return out;
  }

  function sesionLeccion(leccion) {
    if (leccion.texto) return sesionLectura(leccion);

    const total = leccion.n || 12;

    // Una lección puede pedir reglas, ejercicios normales, o las dos cosas.
    if (!leccion.reglas) {
      return ordenarPorEtapa(completarEtapas(leccion, sesionNormal(leccion)));
    }

    /* Una lección de regla se hace en dos etapas sobre el mismo material:
     * primero eligiendo entre opciones y después escribiéndolo sin ellas.
     * Antes sólo daba una de las dos —la que tocara según el dominio— y la de
     * escribir no llegaba hasta ocho aciertos después, en otra sesión. */
    const mitad = Math.max(3, Math.round(total * 0.45));
    const eligiendo = sesionReglas(Object.assign({}, leccion, { n: mitad }), "elegir");
    const escribiendo = sesionReglas(Object.assign({}, leccion, { n: mitad }), "escribir");
    const deReglas = eligiendo.concat(escribiendo);
    const conVoz = deReglas.concat(vozDeRegla(eligiendo.concat(escribiendo), 3, 2));

    if (!leccion.tipos) return ordenarPorEtapa(conVoz);

    const resto = sesionNormal(
      Object.assign({}, leccion, { n: Math.max(2, total - deReglas.length) })
    );
    return ordenarPorEtapa(completarEtapas(leccion, conVoz.concat(resto)));
  }

  function sesionNormal(leccion) {
    const banco = candidatas(leccion.skills, null, topeDe(leccion));
    const palabras = banco.filter(function (t) { return t.tipo === "palabra"; });
    const frases = banco.filter(function (t) { return t.tipo === "frase"; });

    const tipos = leccion.tipos.slice();
    const especiales = tipos.filter(function (t) { return ESPECIALES[t]; });
    const normales = tipos.filter(function (t) { return constructores[t]; });

    const ejercicios = [];

    // "Unir pares" abre la lección cuando hay vocabulario: es el ejercicio más
    // suave y sirve de calentamiento antes de producir nada.
    if (tipos.indexOf("pares") >= 0) {
      const p = ejercicioPares(palabras);
      if (p) ejercicios.push(p);
    }

    let intentos = 0;
    let iTipo = 0;
    while (ejercicios.length < leccion.n && intentos < leccion.n * 12) {
      intentos++;

      // Se alternan los tipos en vez de sortearlos: garantiza variedad dentro
      // de la lección aunque el azar se ponga terco.
      if (especiales.length && (!normales.length || intentos % 3 === 0)) {
        const e = ESPECIALES[especiales[iTipo % especiales.length]](leccion.skills);
        iTipo++;
        if (e) ejercicios.push(e);
        continue;
      }
      if (!normales.length) break;

      const tipo = normales[iTipo % normales.length];
      iTipo++;
      const necesitaFrase = tipo === "arma-en" || tipo === "arma-es";
      const fuente = necesitaFrase ? frases : banco;
      if (!fuente.length) continue;
      const t = sortear(fuente, 1)[0];
      const ej = generar(tipo, t, banco);
      if (ej && !repetido(ejercicios, ej)) ejercicios.push(ej);
    }

    /* Red de seguridad: si con los tipos pedidos no se pudo armar casi nada
     * —por ejemplo en un navegador sin voz, donde los ejercicios de escuchar
     * no existen— se completa con ejercicios de reconocer. Vale más una
     * lección distinta a la planeada que una lección vacía. */
    if (ejercicios.length < Math.min(4, leccion.n)) {
      const respaldo = banco.length ? banco : D().TARJETAS;
      let vueltas = 0;
      while (ejercicios.length < Math.min(6, leccion.n) && vueltas < 60) {
        vueltas++;
        const t = sortear(respaldo, 1)[0];
        if (!t) break;
        const ej = generar("elige-es", t, respaldo) || generar("elige-en", t, respaldo);
        if (ej && !repetido(ejercicios, ej)) ejercicios.push(ej);
      }
    }

    return ejercicios.slice(0, leccion.n);
  }

  function sesionRepaso(n) {
    /* El repaso mezcla todo lo vencido, sin importar de qué unidad venga, y
     * usa siempre el tipo más exigente que la tarjeta permita: repasar es
     * comprobar que se sabe, no volver a reconocerlo entre cuatro opciones. */
    const ids = APP.srs.pendientes(n || 15);
    const banco = D().TARJETAS;
    const ejercicios = [];
    ids.forEach(function (id) {
      const t = D().porId(id);
      if (!t) return;
      const opciones = t.tipo === "frase"
        ? ["arma-en", "escribe-en", "dictado", "arma-es"]
        : ["escribe-en", "escucha-elige", "elige-en", "elige-es"];
      for (let i = 0; i < opciones.length; i++) {
        const ej = generar(opciones[i], t, banco);
        if (ej) {
          ejercicios.push(ej);
          break;
        }
      }
    });
    return ejercicios;
  }

  function sesionErrores(n) {
    const errores = APP.almacen.estado().errores.filter(function (e) { return !e.superado; });
    const banco = D().TARJETAS;
    const ejercicios = [];
    errores.slice(0, n || 12).forEach(function (e) {
      const t = D().porId(e.id);
      if (!t) return;
      const opciones = t.tipo === "frase" ? ["arma-en", "escribe-en"] : ["elige-en", "escribe-en", "elige-es"];
      for (let i = 0; i < opciones.length; i++) {
        const ej = generar(opciones[i], t, banco);
        if (ej) {
          ejercicios.push(ej);
          break;
        }
      }
    });
    return ejercicios;
  }

  function sesionTema(skill, n) {
    return sesionLeccion({
      skills: [skill],
      tipos: ["elige-en", "elige-es", "escucha-elige", "escribe-en", "arma-en", "pares"],
      n: n || 12,
    });
  }

  window.APP = window.APP || {};
  APP.motor = {
    sesionLeccion: sesionLeccion,
    sesionLectura: sesionLectura,
    ETAPAS: ETAPAS,
    etapaDe: etapaDe,
    sesionReglas: sesionReglas,
    sesionRepaso: sesionRepaso,
    sesionErrores: sesionErrores,
    sesionTema: sesionTema,
    revolver: revolver,
    tercera: tercera,
  };
})();

</script>
<script>
/* js/verbos.js */
/* Conjugar: de las cinco formas de un verbo a los ocho tiempos que se usan.
 *
 * La idea es que el banco de datos guarde lo mínimo (base, pasado, participio)
 * y que todo lo demás salga de reglas. Así agregar un verbo son tres palabras,
 * y agregar un tiempo verbal se hace una sola vez acá en vez de cien veces en
 * los datos.
 *
 * Las excepciones existen y están nombradas: "be" es irregular en todo y tiene
 * su propia tabla; el resto se arma con auxiliares.
 */
(function () {
  "use strict";

  const PERSONAS = [
    { id: "i", en: "I", es: "yo", plural: false, tercera: false },
    { id: "you", en: "You", es: "tú", plural: true, tercera: false },
    { id: "he", en: "She", es: "ella", plural: false, tercera: true },
    { id: "we", en: "We", es: "nosotros", plural: true, tercera: false },
    { id: "they", en: "They", es: "ellos", plural: true, tercera: false },
  ];

  const TIEMPOS = [
    { id: "presente", nombre: "Presente simple", es: "Lo que haces siempre",
      ejemplo: "I work here", cuando: "Rutinas, hechos y lo que es verdad en general." },
    { id: "presente-cont", nombre: "Presente continuo", es: "Lo que estás haciendo ahora",
      ejemplo: "I am working", cuando: "Lo que pasa en este momento o en esta temporada." },
    { id: "pasado", nombre: "Pasado simple", es: "Lo que pasó y terminó",
      ejemplo: "I worked yesterday", cuando: "Algo terminado, casi siempre con un “cuándo”." },
    { id: "pasado-cont", nombre: "Pasado continuo", es: "Lo que estabas haciendo",
      ejemplo: "I was working", cuando: "Algo en curso en el pasado, normalmente interrumpido por otra cosa." },
    { id: "perfecto", nombre: "Presente perfecto", es: "Lo que has hecho",
      ejemplo: "I have worked here for years", cuando: "El pasado que todavía importa ahora. En español suele ser “he trabajado”." },
    { id: "futuro", nombre: "Futuro con will", es: "Lo que harás",
      ejemplo: "I will work tomorrow", cuando: "Decisiones del momento, promesas y predicciones." },
    { id: "futuro-going", nombre: "Futuro con going to", es: "Lo que vas a hacer",
      ejemplo: "I am going to work", cuando: "Planes ya decididos antes de hablar." },
    { id: "condicional", nombre: "Condicional", es: "Lo que harías",
      ejemplo: "I would work", cuando: "Situaciones hipotéticas y peticiones educadas." },
  ];

  /* Reglas de escritura. Se calculan en vez de guardarse porque fallan poco, y
   * cuando fallan el verbo trae el campo escrito a mano. */

  function tercera(v) {
    if (v.tercera) return v.tercera;
    const b = v.base;
    if (/[sxz]$|ch$|sh$|o$/.test(b)) return b + "es";
    if (/[^aeiou]y$/.test(b)) return b.slice(0, -1) + "ies";
    return b + "s";
  }

  function gerundio(v) {
    if (v.gerundio) return v.gerundio;
    const b = v.base;
    if (/ie$/.test(b)) return b.slice(0, -2) + "ying"; // die → dying
    /* La -e final muda se cae (make → making), pero sólo si lo que queda sigue
     * siendo una raíz. Sin ese "length > 2", "be" perdía su única vocal y salía
     * "bing" en vez de "being". */
    if (/[^aeiou]e$/.test(b) && b.length > 2) return b.slice(0, -1) + "ing";
    return b + "ing";
  }

  function pasadoDe(v, persona) {
    // "be" es el único que cambia de forma según la persona en pasado.
    if (v.base === "be") return persona && persona.plural ? "were" : "was";
    return v.pasado;
  }

  function serPresente(persona) {
    if (persona.id === "i") return "am";
    return persona.tercera ? "is" : "are";
  }

  function serPasado(persona) {
    return persona.plural ? "were" : "was";
  }

  function haber(persona) {
    return persona.tercera ? "has" : "have";
  }

  /* La conjugación propiamente tal: devuelve la frase completa, con sujeto,
   * para que se pueda leer, escuchar y repetir tal cual. */
  function conjugar(v, tiempo, persona) {
    const suj = persona.en;
    const ger = gerundio(v);

    switch (tiempo) {
      case "presente":
        if (v.base === "be") return suj + " " + serPresente(persona);
        return suj + " " + (persona.tercera ? tercera(v) : v.base);
      case "presente-cont":
        if (v.base === "be") return suj + " " + serPresente(persona) + " being";
        return suj + " " + serPresente(persona) + " " + ger;
      case "pasado":
        return suj + " " + pasadoDe(v, persona);
      case "pasado-cont":
        if (v.base === "be") return suj + " " + serPasado(persona) + " being";
        return suj + " " + serPasado(persona) + " " + ger;
      case "perfecto":
        return suj + " " + haber(persona) + " " + v.participio;
      case "futuro":
        return suj + " will " + v.base;
      case "futuro-going":
        return suj + " " + serPresente(persona) + " going to " + v.base;
      case "condicional":
        return suj + " would " + v.base;
      default:
        return suj + " " + v.base;
    }
  }

  function conFrase(v, tiempo, persona) {
    // La conjugación sola ("She works") se entiende a medias; con complemento
    // ("She works from home") se lee como algo que alguien diría de verdad.
    const base = conjugar(v, tiempo, persona);
    return v.obj ? base + " " + v.obj : base;
  }

  function tabla(v) {
    // Todas las formas de un verbo, para la pantalla de consulta.
    return TIEMPOS.map(function (t) {
      return {
        tiempo: t,
        filas: PERSONAS.map(function (p) {
          return { persona: p, texto: conjugar(v, t.id, p) };
        }),
      };
    });
  }

  function formasPrincipales(v) {
    return [
      { etiqueta: "Base", valor: v.base, ayuda: "La del diccionario" },
      { etiqueta: "3ª persona", valor: tercera(v), ayuda: "he / she / it" },
      { etiqueta: "Pasado", valor: v.pasado + (v.pasado2 ? " / " + v.pasado2 : ""), ayuda: "Pasado simple" },
      { etiqueta: "Participio", valor: v.participio, ayuda: "have / has + …" },
      { etiqueta: "Gerundio", valor: gerundio(v), ayuda: "is / was + …" },
    ];
  }

  /* ---------------- Ejercicios ----------------
   * Se devuelven con la misma forma que usa el resto de la aplicación, así la
   * pantalla de lección los dibuja sin saber que vienen del módulo de verbos.
   */

  function revolver(a) {
    const x = a.slice();
    for (let i = x.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = x[i]; x[i] = x[j]; x[j] = t;
    }
    return x;
  }

  function alAzar(a) {
    return a[Math.floor(Math.random() * a.length)];
  }

  function unicas(lista) {
    const vistas = {};
    return lista.filter(function (x) {
      if (!x || vistas[x]) return false;
      vistas[x] = true;
      return true;
    });
  }

  function idTarjeta(v, que) {
    return "verbo:" + v.base + ":" + que;
  }

  function ejercicioPasado(v) {
    /* El pasado de los irregulares es lo que hay que memorizar sí o sí, y el
     * distractor correcto es siempre el error real: agregarle -ed. */
    const correcta = v.pasado;
    const opciones = unicas([correcta, v.base + "ed", tercera(v), v.participio]).slice(0, 3);
    if (opciones.length < 2) return null;
    return {
      tipo: "hueco",
      tarjetaId: idTarjeta(v, "pasado"),
      enunciado: "Completa en pasado",
      oracion: "Yesterday she ___ (" + v.base + ")" + (v.obj ? " " + v.obj : "") + ".",
      opciones: revolver(opciones).map(function (o) {
        return { texto: o, correcta: o === correcta };
      }),
      respuesta: correcta,
      explicacion: v.irregular
        ? "“" + v.base + "” es irregular: su pasado es “" + v.pasado + "”, no “" + v.base + "ed”." +
          (v.nota ? " " + v.nota : "")
        : "Verbo regular: " + v.base + " + -ed.",
      traduccion: v.es,
    };
  }

  function ejercicioParticipio(v) {
    const correcta = v.participio;
    const opciones = unicas([correcta, v.pasado, v.base, v.base + "ed"]).slice(0, 3);
    if (opciones.length < 2) return null;
    return {
      tipo: "hueco",
      tarjetaId: idTarjeta(v, "participio"),
      enunciado: "Completa el presente perfecto",
      oracion: "She has ___ (" + v.base + ")" + (v.obj ? " " + v.obj : "") + ".",
      opciones: revolver(opciones).map(function (o) {
        return { texto: o, correcta: o === correcta };
      }),
      respuesta: correcta,
      explicacion:
        v.pasado === v.participio
          ? "Acá el pasado y el participio se escriben igual: “" + v.participio + "”."
          : "Ojo: el pasado es “" + v.pasado + "”, pero después de “has” va el participio, “" + v.participio + "”.",
      traduccion: v.es,
    };
  }

  function ejercicioTercera(v) {
    const correcta = tercera(v);
    const opciones = unicas([correcta, v.base, gerundio(v)]).slice(0, 3);
    if (opciones.length < 2) return null;
    return {
      tipo: "hueco",
      tarjetaId: idTarjeta(v, "tercera"),
      enunciado: "Completa en presente",
      oracion: "She ___ (" + v.base + ")" + (v.obj ? " " + v.obj : "") + " every day.",
      opciones: revolver(opciones).map(function (o) {
        return { texto: o, correcta: o === correcta };
      }),
      respuesta: correcta,
      explicacion:
        "Con he/she/it el verbo lleva -s: “" + correcta + "”. Es el error más repetido de los hispanohablantes.",
      traduccion: v.es,
    };
  }

  function ejercicioFuturo(v) {
    const correcta = "will " + v.base;
    const opciones = unicas([correcta, "will " + v.pasado, "will " + tercera(v)]).slice(0, 3);
    if (opciones.length < 2) return null;
    return {
      tipo: "hueco",
      tarjetaId: idTarjeta(v, "futuro"),
      enunciado: "Completa en futuro",
      oracion: "Tomorrow she ___ (" + v.base + ")" + (v.obj ? " " + v.obj : "") + ".",
      opciones: revolver(opciones).map(function (o) {
        return { texto: o, correcta: o === correcta };
      }),
      respuesta: correcta,
      explicacion: "Después de “will” el verbo va siempre en su forma base, sin -s y sin -ed.",
      traduccion: v.es,
    };
  }

  function ejercicioSignificado(v, banco) {
    const otros = revolver(banco.filter(function (x) { return x.base !== v.base; })).slice(0, 3);
    if (otros.length < 3) return null;
    return {
      tipo: "elige-es",
      tarjetaId: idTarjeta(v, "significado"),
      enunciado: "¿Qué significa?",
      prompt: v.base,
      audio: v.base,
      opciones: revolver(
        [{ texto: v.es, correcta: true }].concat(
          otros.map(function (o) { return { texto: o.es, correcta: false }; })
        )
      ),
      respuesta: v.es,
      nota: v.nota,
    };
  }

  function ejercicioEscribir(v, tiempo) {
    const persona = alAzar(PERSONAS);
    const frase = conFrase(v, tiempo, persona);
    return {
      tipo: "escribe",
      tarjetaId: idTarjeta(v, tiempo),
      enunciado: "Escríbelo en inglés",
      prompt: pistaEnEspanol(v, tiempo, persona),
      respuesta: frase,
      audioAlAcertar: frase,
    };
  }

  function pistaEnEspanol(v, tiempo, persona) {
    // No se traduce la frase entera —traducir bien cada tiempo verbal al
    // español daría para otro proyecto— sino que se da el sujeto, el verbo y
    // el tiempo, que es lo que hay que producir.
    const t = TIEMPOS.filter(function (x) { return x.id === tiempo; })[0];
    return persona.es + " · " + v.es + " · " + (t ? t.es.toLowerCase() : tiempo);
  }

  function ejercicioHablar(v, tiempo) {
    if (!APP.audio.hayMicrofono()) return null;
    const persona = alAzar(PERSONAS);
    const frase = conFrase(v, tiempo, persona);
    return {
      tipo: "habla",
      tarjetaId: idTarjeta(v, "voz"),
      enunciado: "Dilo en voz alta",
      prompt: frase,
      traduccion: v.es,
      audio: frase,
      respuesta: frase,
    };
  }

  /* ---------------- Sesiones ---------------- */

  function banco(filtro) {
    let v = APP.datosVerbos.VERBOS;
    if (filtro === "irregulares") v = v.filter(function (x) { return x.irregular; });
    else if (filtro === "regulares") v = v.filter(function (x) { return !x.irregular; });
    else if (filtro === "esenciales") v = v.filter(function (x) { return x.nivel === 1; });
    return v;
  }

  function peso(id) {
    const t = APP.srs.tarjeta(id);
    if (!t.rep && !t.fallos) return 3;
    if (APP.srs.vencida(id)) return 5;
    return Math.max(0.4, 3 * (1 - APP.srs.fuerza(id)));
  }

  function sortear(lista, n, que) {
    // Mismo criterio que el resto de la aplicación: primero lo que toca
    // repasar, después lo nuevo, y lo ya sabido de vez en cuando.
    const pool = lista.slice();
    const out = [];
    while (out.length < n && pool.length) {
      const pesos = pool.map(function (v) { return peso(idTarjeta(v, que)); });
      const total = pesos.reduce(function (a, b) { return a + b; }, 0);
      let r = Math.random() * total;
      let i = 0;
      while (i < pool.length - 1 && r > pesos[i]) { r -= pesos[i]; i++; }
      out.push(pool.splice(i, 1)[0]);
    }
    return out;
  }

  const CONSTRUCTORES = {
    pasado: ejercicioPasado,
    participio: ejercicioParticipio,
    presente: ejercicioTercera,
    futuro: ejercicioFuturo,
  };

  function sesion(modo, n) {
    /* modo: "presente" | "pasado" | "futuro" | "participio" | "irregulares" |
     *       "significado" | "mixto" */
    const cuantos = n || 12;
    const lista = banco(modo === "irregulares" ? "irregulares" : null);
    const todos = APP.datosVerbos.VERBOS;
    const out = [];

    if (modo === "significado") {
      sortear(lista, cuantos, "significado").forEach(function (v) {
        const e = ejercicioSignificado(v, todos);
        if (e) out.push(e);
      });
      return out;
    }

    if (modo === "irregulares") {
      // Los irregulares se drillan en pasado y participio, que es donde duelen.
      sortear(lista, cuantos, "pasado").forEach(function (v, i) {
        const e = i % 3 === 2 ? ejercicioParticipio(v) : ejercicioPasado(v);
        if (e) out.push(e);
      });
      return out;
    }

    if (modo === "mixto") {
      const tipos = ["presente", "pasado", "futuro", "participio"];
      sortear(lista, cuantos, "pasado").forEach(function (v, i) {
        const e = CONSTRUCTORES[tipos[i % tipos.length]](v);
        if (e) out.push(e);
      });
      return out;
    }

    const construir = CONSTRUCTORES[modo] || ejercicioPasado;
    const elegidos = sortear(lista, cuantos, modo);
    elegidos.forEach(function (v, i) {
      // Uno de cada cuatro se produce escribiendo en vez de eligiendo: elegir
      // entre tres opciones se aprende antes de saber decirlo.
      const escribir = i > 0 && i % 4 === 3 && APP.almacen.estado().ajustes.teclado !== false;
      const e = escribir ? ejercicioEscribir(v, modo === "participio" ? "perfecto" : modo) : construir(v);
      if (e) out.push(e);
    });
    return out;
  }

  function sesionDeUnVerbo(v, n) {
    // Practicar un verbo concreto, desde su ficha.
    const out = [];
    const constructores = [ejercicioTercera, ejercicioPasado, ejercicioParticipio, ejercicioFuturo];
    constructores.forEach(function (f) {
      const e = f(v);
